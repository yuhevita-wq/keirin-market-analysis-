[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keirin-market-analysis"
version = "0.1.0"
description = "Market-only keirin trio/trifecta analysis"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
scrape = [
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "requests>=2.32",
]
prediction = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[project.scripts]
keirin-market-analysis = "keirin_market_analysis.cli:main"
keirin-collect-s-yosen-2025 = "keirin_market_analysis.s_yosen_2025:main"
keirin-prediction-engine-v1 = "keirin_market_analysis.prediction_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
