<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>競輪バンク prototype</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #1f2327;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .stage {
      width: min(1200px, 100%);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .apron {
      fill: #d9dde0;
    }

    .track {
      fill: #8d969d;
    }

    .infield {
      fill: #5f9658;
    }

    .outer-line,
    .inner-line,
    .guide-line {
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .outer-line,
    .inner-line {
      stroke: #ffffff;
      stroke-width: 3;
    }

    .guide-line {
      stroke: rgba(255,255,255,.22);
      stroke-width: 2;
      stroke-dasharray: 9 11;
    }

    .finish-line {
      stroke: #ffffff;
      stroke-width: 5;
      vector-effect: non-scaling-stroke;
    }
  </style>
</head>
<body>
  <main class="stage">
    <svg viewBox="0 0 1200 700" role="img" aria-label="競輪バンク">

      <!-- 外側エリア -->
      <rect class="apron" x="55" y="55" width="1090" height="590" rx="295" />

      <!-- バンク本体 -->
      <rect class="track" x="100" y="100" width="1000" height="500" rx="250" />

      <!-- 内側 -->
      <rect class="infield" x="245" y="225" width="710" height="250" rx="125" />

      <!-- 外周線 -->
      <rect class="outer-line" x="100" y="100" width="1000" height="500" rx="250" />

      <!-- 内周線 -->
      <rect class="inner-line" x="245" y="225" width="710" height="250" rx="125" />

      <!-- 将来、駒を走らせるための基準ライン -->
      <rect id="runPath" class="guide-line" x="173" y="163" width="854" height="374" rx="187" />

      <!-- ホーム側のゴール線 -->
      <line class="finish-line" x1="600" y1="475" x2="600" y2="600" />

    </svg>
  </main>
</body>
</html>
