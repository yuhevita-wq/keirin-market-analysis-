<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>競輪バンク prototype</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #07131f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 18px 12px 28px;
    }

    .stage {
      width: min(620px, 100%);
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .piece-strip {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 8px;
      padding: 6px 2px;
    }

    .piece {
      width: 46px;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px solid #ffffff;
      display: grid;
      place-items: center;
      justify-self: center;
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
      user-select: none;
    }

    .p1 { background: #ffffff; color: #111111; }
    .p2 { background: #171717; color: #ffffff; }
    .p3 { background: #e53935; color: #ffffff; }
    .p4 { background: #2878d0; color: #ffffff; }
    .p5 { background: #f2c230; color: #111111; }
    .p6 { background: #25a65a; color: #ffffff; }
    .p7 { background: #e8892d; color: #111111; }
    .p8 { background: #e889b0; color: #111111; }
    .p9 { background: #7d53c7; color: #ffffff; }

    .bank-wrap {
      width: 100%;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .outer-edge {
      fill: none;
      stroke: #d98a43;
      stroke-width: 7;
      vector-effect: non-scaling-stroke;
    }

    .track {
      fill: #6f7478;
    }

    .track-line {
      fill: none;
      stroke: rgba(255,255,255,.78);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .inner-guide {
      fill: none;
      stroke: #b5ad35;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .inner-zone {
      fill: #d75b78;
    }

    .infield {
      fill: #aee637;
    }

    .finish-line {
      stroke: rgba(255,255,255,.82);
      stroke-width: 4;
      vector-effect: non-scaling-stroke;
    }

    @media (max-width: 520px) {
      .stage { gap: 22px; }
      .piece-strip { gap: 4px; }
      .piece {
        width: 34px;
        border-width: 2px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">

    <!-- バンクとは完全に別の駒置き場 -->
    <section class="piece-strip" aria-label="車番駒">
      <div class="piece p1">1</div>
      <div class="piece p2">2</div>
      <div class="piece p3">3</div>
      <div class="piece p4">4</div>
      <div class="piece p5">5</div>
      <div class="piece p6">6</div>
      <div class="piece p7">7</div>
      <div class="piece p8">8</div>
      <div class="piece p9">9</div>
    </section>

    <!-- ここから下がバンク本体 -->
    <div class="bank-wrap">
      <svg viewBox="0 0 620 820" role="img" aria-label="競輪バンク">

        <rect class="track" x="45" y="65" width="530" height="690" rx="235" />
        <rect class="outer-edge" x="41" y="61" width="538" height="698" rx="239" />

        <rect class="track-line" x="78" y="98" width="464" height="624" rx="202" />
        <rect class="track-line" x="116" y="137" width="388" height="546" rx="169" />

        <rect class="inner-guide" x="151" y="175" width="318" height="470" rx="137" />
        <rect class="inner-zone" x="168" y="192" width="284" height="436" rx="120" />
        <rect class="infield" x="208" y="233" width="204" height="354" rx="88" />

        <line class="finish-line" x1="310" y1="65" x2="310" y2="192" />
        <line class="finish-line" x1="310" y1="628" x2="310" y2="755" />

      </svg>
    </div>

  </main>
</body>
</html>
