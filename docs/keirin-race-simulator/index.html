<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>競輪バンク prototype</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #07131f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 18px 12px 40px;
    }

    .stage {
      width: min(680px, 100%);
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .piece-strip {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 8px;
      padding: 6px 2px;
    }

    .piece {
      width: 46px;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px solid #ffffff;
      display: grid;
      place-items: center;
      justify-self: center;
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
      user-select: none;
    }

    .p1 { background: #ffffff; color: #111111; }
    .p2 { background: #171717; color: #ffffff; }
    .p3 { background: #e53935; color: #ffffff; }
    .p4 { background: #2878d0; color: #ffffff; }
    .p5 { background: #f2c230; color: #111111; }
    .p6 { background: #25a65a; color: #ffffff; }
    .p7 { background: #e8892d; color: #111111; }
    .p8 { background: #e889b0; color: #111111; }
    .p9 { background: #7d53c7; color: #ffffff; }

    .bank-wrap {
      width: 100%;
      aspect-ratio: 1000 / 460;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .outer-edge {
      fill: none;
      stroke: #d98a43;
      stroke-width: 7;
      vector-effect: non-scaling-stroke;
    }

    .track { fill: #6f7478; }

    .track-line {
      fill: none;
      stroke: rgba(255,255,255,.78);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .inner-guide {
      fill: none;
      stroke: #b5ad35;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .inner-zone { fill: #d75b78; }
    .infield { fill: #aee637; }

    .finish-line {
      stroke: rgba(255,255,255,.82);
      stroke-width: 4;
      vector-effect: non-scaling-stroke;
    }

    @media (max-width: 520px) {
      .stage { gap: 24px; }
      .piece-strip { gap: 4px; }
      .piece {
        width: 34px;
        border-width: 2px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">

    <section class="piece-strip" aria-label="車番駒">
      <div class="piece p1">1</div>
      <div class="piece p2">2</div>
      <div class="piece p3">3</div>
      <div class="piece p4">4</div>
      <div class="piece p5">5</div>
      <div class="piece p6">6</div>
      <div class="piece p7">7</div>
      <div class="piece p8">8</div>
      <div class="piece p9">9</div>
    </section>

    <div class="bank-wrap">
      <svg viewBox="0 0 1000 460" role="img" aria-label="横長の競輪バンク" preserveAspectRatio="xMidYMid meet">

        <rect class="track" x="70" y="60" width="860" height="340" rx="170" />
        <rect class="outer-edge" x="66" y="56" width="868" height="348" rx="174" />

        <rect class="track-line" x="110" y="92" width="780" height="276" rx="138" />
        <rect class="track-line" x="160" y="126" width="680" height="208" rx="104" />

        <rect class="inner-guide" x="210" y="158" width="580" height="144" rx="72" />
        <rect class="inner-zone" x="232" y="176" width="536" height="108" rx="54" />
        <rect class="infield" x="292" y="202" width="416" height="56" rx="28" />

        <line class="finish-line" x1="500" y1="60" x2="500" y2="176" />
        <line class="finish-line" x1="500" y1="284" x2="500" y2="400" />

      </svg>
    </div>

  </main>
</body>
</html>
