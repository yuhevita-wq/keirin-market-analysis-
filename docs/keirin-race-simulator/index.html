<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>競輪バンク prototype</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #07131f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .stage {
      width: min(980px, 100%);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .outer-edge {
      fill: none;
      stroke: #d98a43;
      stroke-width: 7;
      vector-effect: non-scaling-stroke;
    }

    .track {
      fill: #6f7478;
    }

    .track-line {
      fill: none;
      stroke: rgba(255,255,255,.78);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .inner-guide {
      fill: none;
      stroke: #b5ad35;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .inner-zone {
      fill: #d75b78;
    }

    .infield {
      fill: #aee637;
    }

    .finish-line {
      stroke: rgba(255,255,255,.82);
      stroke-width: 4;
      vector-effect: non-scaling-stroke;
    }
  </style>
</head>
<body>
  <main class="stage">
    <svg viewBox="0 0 1000 640" role="img" aria-label="競輪バンク">

      <!-- 走路本体 -->
      <rect class="track" x="95" y="105" width="810" height="430" rx="205" />

      <!-- 外周オレンジ縁 -->
      <rect class="outer-edge" x="91" y="101" width="818" height="438" rx="209" />

      <!-- 白い走路ライン -->
      <rect class="track-line" x="128" y="136" width="744" height="368" rx="181" />
      <rect class="track-line" x="174" y="176" width="652" height="288" rx="142" />

      <!-- 内側の基準ライン -->
      <rect class="inner-guide" x="219" y="214" width="562" height="212" rx="104" />

      <!-- 内圏の赤い帯 -->
      <rect class="inner-zone" x="237" y="230" width="526" height="180" rx="88" />

      <!-- インフィールド -->
      <rect class="infield" x="287" y="271" width="426" height="98" rx="49" />

      <!-- ホーム側の基準線 -->
      <line class="finish-line" x1="500" y1="105" x2="500" y2="230" />
      <line class="finish-line" x1="500" y1="410" x2="500" y2="535" />

    </svg>
  </main>
</body>
</html>
