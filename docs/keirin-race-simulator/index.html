<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>競輪バンク prototype</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #07131f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 12px;
    }

    .stage {
      width: min(620px, 100%);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .outer-edge {
      fill: none;
      stroke: #d98a43;
      stroke-width: 7;
      vector-effect: non-scaling-stroke;
    }

    .track {
      fill: #6f7478;
    }

    .track-line {
      fill: none;
      stroke: rgba(255,255,255,.78);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .inner-guide {
      fill: none;
      stroke: #b5ad35;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .inner-zone {
      fill: #d75b78;
    }

    .infield {
      fill: #aee637;
    }

    .finish-line {
      stroke: rgba(255,255,255,.82);
      stroke-width: 4;
      vector-effect: non-scaling-stroke;
    }

    .piece circle {
      stroke: #ffffff;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .piece text {
      font-size: 19px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .p1 circle { fill: #ffffff; }
    .p1 text   { fill: #111111; }
    .p2 circle { fill: #171717; }
    .p2 text   { fill: #ffffff; }
    .p3 circle { fill: #e53935; }
    .p3 text   { fill: #ffffff; }
    .p4 circle { fill: #2878d0; }
    .p4 text   { fill: #ffffff; }
    .p5 circle { fill: #f2c230; }
    .p5 text   { fill: #111111; }
    .p6 circle { fill: #25a65a; }
    .p6 text   { fill: #ffffff; }
    .p7 circle { fill: #e8892d; }
    .p7 text   { fill: #111111; }
    .p8 circle { fill: #e889b0; }
    .p8 text   { fill: #111111; }
    .p9 circle { fill: #7d53c7; }
    .p9 text   { fill: #ffffff; }
  </style>
</head>
<body>
  <main class="stage">
    <svg viewBox="0 0 620 980" role="img" aria-label="競輪バンク">

      <!-- バンク外に並べて置く駒 -->
      <g class="piece p1" transform="translate(70 70)"><circle r="22" /><text y="1">1</text></g>
      <g class="piece p2" transform="translate(130 70)"><circle r="22" /><text y="1">2</text></g>
      <g class="piece p3" transform="translate(190 70)"><circle r="22" /><text y="1">3</text></g>
      <g class="piece p4" transform="translate(250 70)"><circle r="22" /><text y="1">4</text></g>
      <g class="piece p5" transform="translate(310 70)"><circle r="22" /><text y="1">5</text></g>
      <g class="piece p6" transform="translate(370 70)"><circle r="22" /><text y="1">6</text></g>
      <g class="piece p7" transform="translate(430 70)"><circle r="22" /><text y="1">7</text></g>
      <g class="piece p8" transform="translate(490 70)"><circle r="22" /><text y="1">8</text></g>
      <g class="piece p9" transform="translate(550 70)"><circle r="22" /><text y="1">9</text></g>

      <!-- 走路本体 -->
      <rect class="track" x="45" y="185" width="530" height="570" rx="235" />

      <!-- 外周オレンジ縁 -->
      <rect class="outer-edge" x="41" y="181" width="538" height="578" rx="239" />

      <!-- 白い走路ライン -->
      <rect class="track-line" x="78" y="218" width="464" height="504" rx="202" />
      <rect class="track-line" x="116" y="257" width="388" height="426" rx="169" />

      <!-- 内側の基準ライン -->
      <rect class="inner-guide" x="151" y="295" width="318" height="350" rx="137" />

      <!-- 内圏の赤い帯 -->
      <rect class="inner-zone" x="168" y="312" width="284" height="316" rx="120" />

      <!-- インフィールド -->
      <rect class="infield" x="208" y="353" width="204" height="234" rx="88" />

      <!-- ホーム側の基準線 -->
      <line class="finish-line" x1="310" y1="185" x2="310" y2="312" />
      <line class="finish-line" x1="310" y1="628" x2="310" y2="755" />

    </svg>
  </main>
</body>
</html>
