<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>競輪将棋 - 盤面プロトタイプ</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
      background: #f5f5f5;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .note {
      margin: 0 0 20px;
      color: #666;
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
      padding: 14px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .piece {
      width: 44px;
      height: 44px;
      border: 2px solid #333;
      border-radius: 50%;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
    }

    .piece.selected {
      outline: 4px solid #bbb;
      transform: translateY(-1px);
    }

    /* 競輪の車番カラー */
    .piece[data-piece="1"], .piece-1 { background: #fff; color: #111; }
    .piece[data-piece="2"], .piece-2 { background: #111; color: #fff; }
    .piece[data-piece="3"], .piece-3 { background: #d62828; color: #fff; }
    .piece[data-piece="4"], .piece-4 { background: #1769aa; color: #fff; }
    .piece[data-piece="5"], .piece-5 { background: #ffd60a; color: #111; }
    .piece[data-piece="6"], .piece-6 { background: #1f9d55; color: #fff; }
    .piece[data-piece="7"], .piece-7 { background: #f28c28; color: #111; }

    .clear {
      margin-left: auto;
      padding: 10px 14px;
      border: 1px solid #aaa;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    .board {
      display: grid;
      gap: 10px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      align-items: center;
    }

    .row-label {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      background: #ececec;
      border: 1px solid #bbb;
      border-radius: 8px;
    }

    .row-zone {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 12px;
      background: #fff;
      border: 1px dashed #bbb;
      border-radius: 10px;
      cursor: pointer;
    }

    .row-zone:hover {
      outline: 2px solid #ccc;
    }

    .placed {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      flex: 0 0 auto;
    }

    /* 配置後の駒にも車番カラーを確実に適用 */
    .placed.piece-1 { background: #fff; color: #111; }
    .placed.piece-2 { background: #111; color: #fff; }
    .placed.piece-3 { background: #d62828; color: #fff; }
    .placed.piece-4 { background: #1769aa; color: #fff; }
    .placed.piece-5 { background: #ffd60a; color: #111; }
    .placed.piece-6 { background: #1f9d55; color: #fff; }
    .placed.piece-7 { background: #f28c28; color: #111; }

    .empty-hint {
      color: #aaa;
      font-size: 13px;
      pointer-events: none;
    }

    .status {
      margin-top: 16px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    @media (max-width: 720px) {
      body { padding: 12px; }

      .rank-row {
        grid-template-columns: 58px 1fr;
        gap: 6px;
      }

      .row-label,
      .row-zone {
        min-height: 60px;
      }

      .placed,
      .piece {
        width: 38px;
        height: 38px;
      }

      .row-zone {
        gap: 7px;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>競輪将棋 盤面プロトタイプ</h1>
    <p class="note">
      横軸の車番固定は廃止。各着順の候補駒を中央揃えで表示します。
      例：1着=1、2着=2・3、3着=2・3・4・5ならピラミッド状になります。
    </p>

    <section class="toolbar" aria-label="駒選択">
      <strong>駒:</strong>
      <button class="piece" data-piece="1">1</button>
      <button class="piece" data-piece="2">2</button>
      <button class="piece" data-piece="3">3</button>
      <button class="piece" data-piece="4">4</button>
      <button class="piece" data-piece="5">5</button>
      <button class="piece" data-piece="6">6</button>
      <button class="piece" data-piece="7">7</button>
      <button class="clear" id="clearBoard">全消去</button>
    </section>

    <section class="board" id="board" aria-label="競輪将棋盤面"></section>

    <div class="status" id="status">駒を選択して、置きたい着順の段を押してください。</div>
  </main>

  <script>
    const rows = [
      { key: "first", label: "1着" },
      { key: "second", label: "2着" },
      { key: "third", label: "3着" }
    ];

    let selectedPiece = null;

    // 各段は「その着順の候補車番」の配列。
    // 横位置に車番の意味は持たせない。
    const state = {
      first: [],
      second: [],
      third: []
    };

    const board = document.getElementById("board");
    const status = document.getElementById("status");

    function addPieceToRow(rowKey, rowLabel) {
      if (!selectedPiece) {
        status.textContent = "先に駒を選択してください。";
        return;
      }

      if (state[rowKey].includes(selectedPiece)) {
        status.textContent = rowLabel + "には駒" + selectedPiece + "がすでにあります。";
        return;
      }

      state[rowKey].push(selectedPiece);
      state[rowKey].sort((a, b) => a - b);

      status.textContent = rowLabel + "候補に駒" + selectedPiece + "を追加しました。";
      renderBoard();
    }

    function removePieceFromRow(rowKey, rowLabel, pieceNo) {
      state[rowKey] = state[rowKey].filter(no => no !== pieceNo);
      status.textContent = rowLabel + "候補から駒" + pieceNo + "を削除しました。";
      renderBoard();
    }

    function renderBoard() {
      board.innerHTML = "";

      rows.forEach(row => {
        const rowWrap = document.createElement("div");
        rowWrap.className = "rank-row";

        const label = document.createElement("div");
        label.className = "row-label";
        label.textContent = row.label;

        const zone = document.createElement("div");
        zone.className = "row-zone";
        zone.dataset.row = row.key;

        zone.addEventListener("click", () => {
          addPieceToRow(row.key, row.label);
        });

        if (state[row.key].length === 0) {
          const hint = document.createElement("span");
          hint.className = "empty-hint";
          hint.textContent = "ここを押して配置";
          zone.appendChild(hint);
        } else {
          state[row.key].forEach(pieceNo => {
            const piece = document.createElement("button");
            piece.type = "button";
            piece.className = "placed piece-" + pieceNo;
            piece.textContent = pieceNo;
            piece.title = row.label + "候補から" + pieceNo + "を削除";

            piece.addEventListener("click", event => {
              event.stopPropagation();
              removePieceFromRow(row.key, row.label, pieceNo);
            });

            zone.appendChild(piece);
          });
        }

        rowWrap.appendChild(label);
        rowWrap.appendChild(zone);
        board.appendChild(rowWrap);
      });
    }

    document.querySelectorAll(".piece").forEach(button => {
      button.addEventListener("click", () => {
        selectedPiece = Number(button.dataset.piece);

        document.querySelectorAll(".piece").forEach(b => {
          b.classList.toggle("selected", b === button);
        });

        status.textContent =
          "駒" + selectedPiece + "を選択中。置きたい着順の段を押してください。";
      });
    });

    document.getElementById("clearBoard").addEventListener("click", () => {
      rows.forEach(row => state[row.key] = []);
      status.textContent = "盤面を全消去しました。";
      renderBoard();
    });

    renderBoard();
  </script>
</body>
</html>
