<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>競輪将棋 - 盤面プロトタイプ</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
      background: #f5f5f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .note {
      margin: 0 0 20px;
      color: #666;
      font-size: 14px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
      padding: 14px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
    }
    .piece {
      width: 44px;
      height: 44px;
      border: 2px solid #333;
      border-radius: 50%;
      background: #fff;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
    }
    .piece.selected {
      outline: 4px solid #bbb;
      transform: translateY(-1px);
    }
    .clear {
      margin-left: auto;
      padding: 10px 14px;
      border: 1px solid #aaa;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
    }
    .board {
      display: grid;
      grid-template-columns: 72px repeat(7, minmax(54px, 1fr));
      gap: 6px;
      align-items: stretch;
    }
    .head, .row-label, .cell {
      min-height: 62px;
      border: 1px solid #bbb;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
    .head, .row-label {
      font-weight: 700;
      background: #ececec;
    }
    .cell {
      cursor: pointer;
      position: relative;
    }
    .cell:hover {
      outline: 2px solid #bbb;
    }
    .placed {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      background: #fff;
      pointer-events: none;
    }
    .status {
      margin-top: 16px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    @media (max-width: 720px) {
      body { padding: 12px; }
      .board {
        grid-template-columns: 58px repeat(7, minmax(40px, 1fr));
        gap: 4px;
      }
      .head, .row-label, .cell { min-height: 52px; }
      .placed, .piece { width: 38px; height: 38px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>競輪将棋 盤面プロトタイプ</h1>
    <p class="note">駒を選んでマスを押すだけ。同じ選手を複数段に置けます。オッズ・移動ルール・車券化はまだ入れていません。</p>

    <section class="toolbar" aria-label="駒選択">
      <strong>駒:</strong>
      <button class="piece" data-piece="1">1</button>
      <button class="piece" data-piece="2">2</button>
      <button class="piece" data-piece="3">3</button>
      <button class="piece" data-piece="4">4</button>
      <button class="piece" data-piece="5">5</button>
      <button class="piece" data-piece="6">6</button>
      <button class="piece" data-piece="7">7</button>
      <button class="clear" id="clearBoard">全消去</button>
    </section>

    <section class="board" id="board" aria-label="競輪将棋盤面"></section>

    <div class="status" id="status">駒を選択してください。</div>
  </main>

  <script>
    const racers = [1,2,3,4,5,6,7];
    const rows = [
      { key: "first", label: "1着" },
      { key: "second", label: "2着" },
      { key: "third", label: "3着" }
    ];

    let selectedPiece = null;
    const state = {
      first: {},
      second: {},
      third: {}
    };

    const board = document.getElementById("board");
    const status = document.getElementById("status");

    function renderBoard() {
      board.innerHTML = "";

      const corner = document.createElement("div");
      corner.className = "head";
      corner.textContent = "着順";
      board.appendChild(corner);

      racers.forEach(no => {
        const head = document.createElement("div");
        head.className = "head";
        head.textContent = no;
        board.appendChild(head);
      });

      rows.forEach(row => {
        const label = document.createElement("div");
        label.className = "row-label";
        label.textContent = row.label;
        board.appendChild(label);

        racers.forEach(column => {
          const cell = document.createElement("button");
          cell.className = "cell";
          cell.type = "button";
          cell.dataset.row = row.key;
          cell.dataset.column = column;

          const pieceNo = state[row.key][column];
          if (pieceNo) {
            const piece = document.createElement("div");
            piece.className = "placed";
            piece.textContent = pieceNo;
            cell.appendChild(piece);
          }

          cell.addEventListener("click", () => {
            const current = state[row.key][column];

            if (current) {
              delete state[row.key][column];
              status.textContent = row.label + "・車番" + column + "の駒を削除しました。";
              renderBoard();
              return;
            }

            if (!selectedPiece) {
              status.textContent = "先に駒を選択してください。";
              return;
            }

            state[row.key][column] = selectedPiece;
            status.textContent = row.label + "・車番" + column + "に駒" + selectedPiece + "を配置しました。";
            renderBoard();
          });

          board.appendChild(cell);
        });
      });
    }

    document.querySelectorAll(".piece").forEach(button => {
      button.addEventListener("click", () => {
        selectedPiece = Number(button.dataset.piece);

        document.querySelectorAll(".piece").forEach(b => {
          b.classList.toggle("selected", b === button);
        });

        status.textContent = "駒" + selectedPiece + "を選択中。置きたいマスを押してください。";
      });
    });

    document.getElementById("clearBoard").addEventListener("click", () => {
      rows.forEach(row => state[row.key] = {});
      status.textContent = "盤面を全消去しました。";
      renderBoard();
    });

    renderBoard();
  </script>
</body>
</html>
