name: Keirin Shogi v23 Conditional Second Third
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-v23-conditional-second-third.yml'
      - 'scripts/keirin_shogi_v23_conditional_second_third.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q scikit-learn
      - run: python scripts/keirin_shogi_v23_conditional_second_third.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v23_conditional_second_third
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v23 conditional second third"
            git push
          fi
