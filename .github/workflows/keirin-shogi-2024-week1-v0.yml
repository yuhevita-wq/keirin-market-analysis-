name: Keirin Shogi 2024 Week 1 v0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/keirin-shogi-2024-week1-v0.yml'
      - 'scripts/keirin_shogi_weekly_v0.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-v0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run weekly evaluator
        run: python scripts/keirin_shogi_weekly_v0.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v0/2024-01-01_2024-01-07
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v0 2024 week 1"
            git push
          fi
