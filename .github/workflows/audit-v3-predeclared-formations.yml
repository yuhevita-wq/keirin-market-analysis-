name: Audit V3 predeclared formations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-v3-predeclared-formations.yml"
      - "src/keirin_market_analysis/audit_v3_predeclared_formations.py"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Run audit
        run: python -m keirin_market_analysis.audit_v3_predeclared_formations
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/audits/v3_predeclared_formation_audit.json').read_text(encoding='utf-8'))
          assert d['status']=='V3_PREDECLARED_FORMATION_AUDIT_COMPLETE'
          assert set(d['strategies'])=={'early','middle','late'}
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/v3_predeclared_formation_audit.json
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "analysis: record V3 formation audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
