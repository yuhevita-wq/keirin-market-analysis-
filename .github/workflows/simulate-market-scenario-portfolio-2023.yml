name: Simulate market scenario portfolio 2023

on:
  push:
    branches: [main]
    paths:
      - 'src/keirin_market_analysis/simulate_market_scenario_portfolio_2023.py'
      - '.github/workflows/simulate-market-scenario-portfolio-2023.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run 2023 scenario portfolio hobby simulation
        run: python -m keirin_market_analysis.simulate_market_scenario_portfolio_2023
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p='data/audits/market_scenario_portfolio_2023.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['years_read']==[2023], x
          assert x['evaluation_year_2024_used'] is False
          assert x['evaluation_year_2025_used'] is False
          assert x['evaluation_year_2026_used'] is False
          assert x['eligible_complete_races'] > 1000
          assert x['purchased_races'] > 0
          assert x['trigami_violations'] == 0
          assert x['minimum_theoretical_hit_roi_pct_across_purchased_races'] > 100.0
          print('VALID', {
              'eligible': x['eligible_complete_races'],
              'purchased': x['purchased_races'],
              'hits': x['hit_races'],
              'roi': x['roi_pct'],
              'profit': x['profit_yen'],
              'min_hit_roi': x['minimum_theoretical_hit_roi_pct_across_purchased_races'],
          })
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/market_scenario_portfolio_2023.json data/audits/market_scenario_portfolio_2023_decisions.csv
          git commit -m 'analysis: add 2023 market scenario portfolio result' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
