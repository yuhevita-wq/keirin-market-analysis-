name: Baby AI GEN-001 week 2 formation training
on:
  push:
    branches: [main]
    paths:
      - 'research/ai_nursery/train_week2.py'
      - 'research/ai_nursery/test_week2.py'
      - '.github/workflows/baby-ai-formation-week2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: baby-ai-formation-week2
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Learn 2023-01-08 to 2023-01-14 from saved week-one weights
        run: |
          python -m pip install 'numpy>=1.26'
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python research/ai_nursery/train_week2.py
      - name: Verify formation marks and parent-child weight continuity
        run: python research/ai_nursery/test_week2.py
      - name: Save the second-week learning diary and checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ai_nursery/outputs/GEN-001/week2/ docs/ai-lab/nursery-week2-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: save GEN-001 second-week formation-sheet learning"
          git pull --rebase origin main
          git push origin HEAD:main
