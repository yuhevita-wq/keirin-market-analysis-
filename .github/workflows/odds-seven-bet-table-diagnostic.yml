name: Diagnose historical KDreams odds table structure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/odds-seven-bet-table-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Extract table structural diagnostics without odds prices
        run: |
          python - <<'PY'
          import re,requests
          from bs4 import BeautifulSoup
          url='https://keirin.kdreams.jp/racedetail/7320240704010001/?pageType=odds'
          session=requests.Session()
          session.headers.update({'User-Agent':'Keirin-Research-Odds-Collector/1.0'})
          from urllib.parse import urljoin,urlparse
          index=session.get('https://keirin.kdreams.jp/kaisai/2024/07/04/',timeout=35)
          print('INDEX',index.status_code,index.url,len(index.content))
          links=[urljoin('https://keirin.kdreams.jp',a.get('href',''))
                 for a in BeautifulSoup(index.text,'html.parser').find_all('a',href=True)
                 if a.get_text(' ',strip=True)=='オッズ'
                 and '7320240704010001' in a.get('href','')]
          print('MATCHING_SOURCE_LINKS',len(links),links[:2])
          target=links[0] if links else url
          r=session.get(target,timeout=35)
          print('ODDS_REPLY',r.status_code,r.url,len(r.content))
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          print('HTML_BYTES',len(r.content),'PAGE_TITLE',soup.title.get_text(' ',strip=True)[:100] if soup.title else 'none')
          print('TABLE_COUNT',len(soup.find_all('table')))
          print('ODDS_TABLE',len(soup.select('table.odds_table')))
          print('ODDS_HEADER',len(soup.select('div.odds_header')))
          pat=re.compile(r'[1-9]=[1-9]=[1-9]')
          for i,t in enumerate(soup.find_all('table')):
              content=t.get_text(' ',strip=True)
              n=len(pat.findall(content))
              if n==0:continue
              chain=[]
              node=t
              for depth in range(5):
                  if node is None:break
                  ident=str(node.get('id',''))[:50]
                  cls='.'.join(node.get('class',[]))[:100]
                  chain.append(f'{node.name}#{ident}.{cls}')
                  node=node.parent
              previous=t.find_previous(['h1','h2','h3','h4'])
              prev=previous.get_text(' ',strip=True)[:90] if previous else ''
              rows=t.find_all('tr')
              columns=[len(row.find_all(['th','td'],recursive=False)) for row in rows[:5]]
              print('TRIPLE_TABLE',i,'matches',n,'rows',len(rows),'cells',columns,
                    'prior_heading',prev,'chain',' / '.join(chain))
          PY
