name: Current Board 2024 Week1 King Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_current_board_2024_week1_king_diagnostic.py'
      - '.github/workflows/current-board-2024-week1-king-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run diagnostic
        run: python scripts/keirin_shogi_current_board_2024_week1_king_diagnostic.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/current_board_2024_week1_king_diagnostic
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: current board 2024 week1 king diagnostic"
            git push
          fi
