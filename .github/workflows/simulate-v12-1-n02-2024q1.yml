name: Simulate v12.1-N02 on 2024Q1

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/keirin_market_analysis/evaluate_v12_1_n02_q1_only.py'
      - 'src/keirin_market_analysis/v12_1_n02_anomaly_first.py'
      - 'src/keirin_market_analysis/market_connection_features_v1.py'
      - 'src/keirin_market_analysis/racecard_fundamentals_v1.py'
      - '.github/workflows/simulate-v12-1-n02-2024q1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            data/2024/s_class_f1_all_parts/2024_q1
            src/keirin_market_analysis
          sparse-checkout-cone-mode: true
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Simulate fixed v12.1-N02 on 2024Q1 only
        run: python src/keirin_market_analysis/evaluate_v12_1_n02_q1_only.py
