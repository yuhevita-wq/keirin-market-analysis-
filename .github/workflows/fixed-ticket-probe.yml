name: Fixed ticket 7-car F1 probe
on:
  push:
    branches:
      - analysis/fixed-ticket-all-f1-20260904
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run seven-car fixed-ticket probe
        run: python3 scripts/fixed_ticket_probe.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: fixed-ticket-7car-f1-result
          path: results/fixed_ticket_7car_f1_20260904.json
