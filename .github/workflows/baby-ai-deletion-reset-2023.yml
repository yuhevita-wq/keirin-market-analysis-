name: GEN008 Deletion AI | restart from January 2023
on:
  push:
    branches: [main]
    paths:
      - 'research/deletion_ai/deletion_core.py'
      - 'research/deletion_ai/run_reset_2023.py'
      - 'research/deletion_ai/verify_reset_2023.py'
      - 'research/deletion_ai/test_deletion_2023.py'
      - '.github/workflows/baby-ai-deletion-reset-2023.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gen008-deletion-2023-from-scratch-full-history
  cancel-in-progress: false
jobs:
  learn_2023:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact-history analysis dependencies
        run: python -m pip install -e '.[scrape]' 'numpy>=1.26'
      - name: Test zero initialized children and removal accounting
        run: |
          python -m py_compile research/deletion_ai/deletion_core.py research/deletion_ai/run_reset_2023.py research/deletion_ai/verify_reset_2023.py research/deletion_ai/test_deletion_2023.py
          python research/deletion_ai/test_deletion_2023.py
      - name: Learn four fresh models from January 2023 (no existing checkpoints inherited)
        run: |
          if [ -f research/deletion_ai/outputs/GEN-008-DELETION-RESET-2023/summary.json ]; then
            echo 'Immutable from-zero 2023 learning already exists. Audit rather than retrain.'
          else
            python research/deletion_ai/run_reset_2023.py --run
          fi
      - name: Verify every pre-result deletion and result-dependent update
        run: python research/deletion_ai/verify_reset_2023.py
      - name: Permanently archive scratch weights, deletion ledgers and frozen 2024 results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/deletion_ai/outputs/GEN-008-DELETION-RESET-2023/
          git add docs/ai-lab/gen008-deletion-reset-2023.json
          if git diff --cached --quiet; then echo 'No new immutable evidence'; exit 0; fi
          git commit -m 'data: freeze scratch 2023 deletion learners and audited 2024 same-race comparison'
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Failed to publish evidence; inspect Actions artifacts and log' >&2
          exit 1
