name: Study Seven-Car State Transfer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_sevencar_state_transfer.py'
      - '.github/workflows/study-sevencar-state-transfer.yml'

permissions:
  contents: write

concurrency:
  group: study-sevencar-state-transfer
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run seven-car transfer study
        run: python scripts/keirin_shogi_sevencar_state_transfer.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/sevencar_state_transfer
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "research: save seven-car state transfer study"
            git pull --rebase origin main
            git push
          fi
