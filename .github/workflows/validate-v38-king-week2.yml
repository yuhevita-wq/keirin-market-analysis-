name: Validate v38 KING Week2 Holdout
on:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_v38_2024w2_holdout.py'
      - '.github/workflows/validate-v38-king-week2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/keirin_shogi_v38_2024w2_holdout.py
      - name: Commit holdout result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add results/keirin_shogi/v38_king_seat_2024w2_holdout
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "results: save v38 KING 2024 week2 holdout"
            git push
          fi
