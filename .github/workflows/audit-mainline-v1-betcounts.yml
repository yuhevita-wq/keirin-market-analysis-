name: Audit mainline v1 bet counts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-mainline-v1-betcounts.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count bet points
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter, defaultdict
          from pathlib import Path
          p=Path('data/2025/s_class_yosen/simulations/mainline_v1/race_simulation.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig')))
          overall=Counter(int(r['bet_count']) for r in rows)
          seg=defaultdict(Counter)
          for r in rows:
              seg[r['segment']][int(r['bet_count'])]+=1
          print('OVERALL', json.dumps(dict(sorted(overall.items())), ensure_ascii=False))
          for s in ('前半','中盤','後半'):
              print(s, json.dumps(dict(sorted(seg[s].items())), ensure_ascii=False))
          print('MIN', min(overall), 'MAX', max(overall))
          PY
