name: Audit V3 leave-one-period-out stability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-v3-leave-one-period-out.yml"
      - "src/keirin_market_analysis/audit_v3_leave_one_period_out.py"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Run audit
        run: python -m keirin_market_analysis.audit_v3_leave_one_period_out
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/audits/v3_leave_one_period_out.json').read_text(encoding='utf-8'))
          assert d['status']=='V3_LEAVE_ONE_PERIOD_OUT_COMPLETE'
          assert set(d['strategies'])=={'early','middle','late'}
          print(json.dumps({s:{'profitable_heldouts':d['strategies'][s]['profitable_heldouts'],'cases':d['strategies'][s]['cases']} for s in d['strategies']},ensure_ascii=False,indent=2))
          PY
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/v3_leave_one_period_out.json
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "analysis: record V3 leave-one-period-out audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
