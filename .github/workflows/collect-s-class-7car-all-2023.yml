name: Collect 2023 S-class 7-car all races

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect-s-class-7car-all-2023.yml"
      - "src/keirin_market_analysis/s_class_7car_2023.py"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[scrape]'

      - name: Collect all 2023 S-class races with exactly seven starters
        run: |
          python -m keirin_market_analysis.s_class_7car_2023 \
            --start-date 2023-01-01 \
            --end-date 2023-12-31 \
            --out-dir data/2023/s_class_7car_all \
            --sleep 0.20

      - name: Validate base collection
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path('data/2023/s_class_7car_all')
          s = json.loads((p/'summary.json').read_text(encoding='utf-8'))
          races = list(csv.DictReader((p/'races.csv').open(encoding='utf-8-sig')))
          entries = list(csv.DictReader((p/'entries.csv').open(encoding='utf-8-sig')))
          failures = list(csv.DictReader((p/'failures.csv').open(encoding='utf-8-sig')))
          assert s['start_date'] == '2023-01-01' and s['end_date'] == '2023-12-31', s
          assert s['parsed_7car_races'] == len(races) and len(races) > 0, s
          assert s['entry_rows'] == len(entries) == len(races) * 7, (s, len(entries))
          assert s['failures'] == 0 and not failures, failures[:20]
          assert all(r['race_type'].startswith('Ｓ級') for r in races)
          assert all(int(r['entry_count']) == 7 for r in races)
          assert all(e['race_type'].startswith('Ｓ級') for e in entries)
          assert all(r['race_date'].startswith('2023-') for r in races)
          assert len({r['race_type'] for r in races}) >= 2, s['race_type_counts']
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY

      - name: Enrich KDreams predicted line formation
        run: |
          python -m keirin_market_analysis.line_formation_2025 \
            --data-dir data/2023/s_class_7car_all \
            --sleep 0.20

      - name: Validate line enrichment
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path('data/2023/s_class_7car_all')
          s = json.loads((p/'line_summary.json').read_text(encoding='utf-8'))
          races = list(csv.DictReader((p/'races.csv').open(encoding='utf-8-sig')))
          failures = list(csv.DictReader((p/'line_failures.csv').open(encoding='utf-8-sig')))
          assert s['race_count'] == len(races), s
          assert s['line_parse_failures'] == 0 and not failures, failures[:20]
          assert all('predicted_line_formation' in r for r in races)
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY

      - name: Extract results and payouts
        run: |
          python -m keirin_market_analysis.results_payouts_2025 \
            --data-dir data/2023/s_class_7car_all \
            --sleep 0.20

      - name: Validate results and payouts
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path('data/2023/s_class_7car_all')
          s = json.loads((p/'result_summary.json').read_text(encoding='utf-8'))
          races = list(csv.DictReader((p/'races.csv').open(encoding='utf-8-sig')))
          results = list(csv.DictReader((p/'results.csv').open(encoding='utf-8-sig')))
          payouts = list(csv.DictReader((p/'payouts.csv').open(encoding='utf-8-sig')))
          failures = list(csv.DictReader((p/'result_failures.csv').open(encoding='utf-8-sig')))
          n = len(races)
          assert s['race_count'] == n and n > 0, s
          assert s['complete_result_races'] == n, s
          assert s['complete_payout_races'] == n, s
          assert s['parse_failures'] == 0 and not failures, failures[:20]
          assert results and payouts
          assert all(r['race_type'].startswith('Ｓ級') for r in results)
          assert all(p['race_type'].startswith('Ｓ級') for p in payouts)
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY

      - name: Collect historical final trifecta and trio odds
        run: |
          python -m keirin_market_analysis.historical_final_odds \
            --data-dir data/2023/s_class_7car_all \
            --workers 3 \
            --sleep 0.15

      - name: Validate final odds
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path('data/2023/s_class_7car_all')
          races = list(csv.DictReader((p/'races.csv').open(encoding='utf-8-sig')))
          s = json.loads((p/'odds_summary.json').read_text(encoding='utf-8'))
          trifecta = list(csv.DictReader((p/'trifecta_final_odds.csv').open(encoding='utf-8-sig')))
          trio = list(csv.DictReader((p/'trio_final_odds.csv').open(encoding='utf-8-sig')))
          assert s['race_count_attempted'] == len(races), (s, len(races))
          assert s['complete_races'] + s['failed_races'] == len(races), s
          assert s['coverage_rate'] >= 0.95, s
          assert trifecta and trio
          complete_ids = {r['race_id'] for r in trio}
          for rid in complete_ids:
              assert sum(r['race_id'] == rid for r in trio) == 35, rid
              assert sum(r['race_id'] == rid for r in trifecta) == 210, rid
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: s-class-7car-all-2023
          retention-days: 7
          path: data/2023/s_class_7car_all

      - name: Commit 2023 S-class 7-car dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/2023/s_class_7car_all
          if git diff --cached --quiet; then
            echo "No 2023 S-class 7-car dataset changes to commit"
          else
            git commit -m "data: add 2023 S-class 7-car all-race dataset"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
