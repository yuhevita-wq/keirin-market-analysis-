name: 2024 Week1 King Miss Audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_2024_week1_king_miss_audit.py'
      - '.github/workflows/2024-week1-king-miss-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/keirin_shogi_2024_week1_king_miss_audit.py
