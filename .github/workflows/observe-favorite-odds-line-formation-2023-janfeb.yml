name: Observe favorite odds by line-based whole formation sets Jan-Feb 2023
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/observe-favorite-odds-line-formation-2023-janfeb.yml'
      - 'research/favorite_odds_line_formation_sets_20261028/observe_janfeb.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: favorite-odds-line-formations-2023-janfeb
  cancel-in-progress: false
jobs:
  observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -e '.[scrape]'
      - name: Verify canonical odds orientation and window
        run: |
          python -m py_compile research/favorite_odds_line_formation_sets_20261028/observe_janfeb.py
          python -m unittest research.snowberg_observation_corrected_20261027.test_orientation
          python - <<'PY'
          import research.favorite_odds_line_formation_sets_20261028.observe_janfeb as mod
          assert mod.START=="2023-01-01" and mod.END=="2023-02-28"
          assert len(mod.REGISTRY)==34
          assert all("2023" in p for p in mod.LINE_SOURCES)
          print("PERIOD_LOCKED_2023_JAN_FEB_ONLY",len(mod.REGISTRY))
          PY
      - name: Observe published line formations + sealed full 3-way odds + exact real outcomes
        env:
          KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM: ${{ secrets.KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM }}
        run: python research/favorite_odds_line_formation_sets_20261028/observe_janfeb.py
      - name: Upload observation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: favorite-odds-line-formations-${{ github.run_id }}
          path: |
            research/favorite_odds_line_formation_sets_20261028/summary.json
            research/favorite_odds_line_formation_sets_20261028/compact.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit observation-only aggregates
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/favorite_odds_line_formation_sets_20261028/summary.json research/favorite_odds_line_formation_sets_20261028/compact.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: 2023 Jan-Feb favorite-odds x line-formation sets observation'
          for try in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
