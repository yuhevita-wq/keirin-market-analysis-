name: Validate all-bet historical odds

on:
  push:
    paths:
      - "odds_market/**"
      - ".github/workflows/odds-market.yml"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Completed first date YYYY-MM-DD"
        required: true
        default: "2024-07-04"
      end_date:
        description: "Completed final date YYYY-MM-DD"
        required: true
        default: "2024-07-04"
      confirm_authorized:
        description: "I have authorization for automated collection and storage"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install requests beautifulsoup4
      - name: Check every combination of each sold bet type
        run: python -m odds_market.test_collect_all_odds

  authorized-collection:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_authorized == true
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install requests beautifulsoup4
      - name: Collect complete historical odds only
        run: |
          python odds_market/collect_all_odds.py \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --out /tmp/odds_only \
            --pause 2 \
            --accept-terms
      - name: Count collected days without publishing source data
        if: always()
        run: |
          find /tmp/odds_only -name '*.csv.gz' -type f | wc -l || true
