name: Paper Chapter 1 | Frozen accuracy vs calibration AI duel
on:
  workflow_dispatch:
  push:
    paths:
      - 'paper_only_ai/chapter1_accuracy_calibration_duel.py'
      - 'paper_only_ai/test_chapter1_accuracy_calibration_duel.py'
      - '.github/workflows/chapter1-accuracy-calibration-duel.yml'
permissions:
  contents: write
concurrency:
  group: chapter1-acc-cal-duel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  historical-head-to-head:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            paper_only_ai
            docs/paper-only-ai-2023/chapter1_accuracy_ai
            docs/paper-only-ai-2023/autonomous_chapter1
            docs/paper-only-ai-2023/chapter1_accuracy_calibration_duel
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install 'numpy<3' 'pandas<3' 'scipy<2' 'scikit-learn<2' 'joblib<2' 'optuna<5'
      - name: Verify one-pick accuracy, probability and paired cash returns
        run: |
          python -m py_compile paper_only_ai/chapter1_accuracy_calibration_duel.py
          python paper_only_ai/test_chapter1_accuracy_calibration_duel.py
      - name: Score immutable AIs on exactly the same completed races and odds
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python paper_only_ai/chapter1_accuracy_calibration_duel.py
      - name: Preserve fully specified loss/ROI and paired probability comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-duel-${{ github.run_id }}
          path: docs/paper-only-ai-2023/chapter1_accuracy_calibration_duel/
          if-no-files-found: warn
          retention-days: 90
      - name: Persist the exact duel result without an automatic rerun
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/paper-only-ai-2023/chapter1_accuracy_calibration_duel/duel_2024q1_q2.json
          if ! git diff --cached --quiet; then
            git commit -m "Record fixed 2024 accuracy-vs-calibration AI historical duel"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
