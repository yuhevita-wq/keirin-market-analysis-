name: tmp g3 line inspect

on:
  push:
    branches:
      - analysis/g3-line-2022-2023

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archive schemas
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          for p in [
              Path("data/grade_races/g3/2022/g3-all-2022-q1-non-girls.zip"),
              Path("data/grade_races/g3/2023/g3-all-2023-q1-non-girls.zip"),
          ]:
              print("\nARCHIVE", p)
              with zipfile.ZipFile(p) as z:
                  names = z.namelist()
                  print("FILES", len(names))
                  for n in names:
                      print(" -", n)
                  for n in names:
                      if n.lower().endswith((".csv",".json")):
                          raw=z.read(n)
                          try: txt=raw.decode("utf-8-sig")
                          except UnicodeDecodeError: txt=raw.decode("cp932",errors="replace")
                          print("\nFILE",n)
                          print("\n".join(txt.splitlines()[:5])[:6000])
          PY
