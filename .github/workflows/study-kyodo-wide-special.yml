name: Study Kyodo Wide Special Structure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_kyodo_wide_study.py'
      - '.github/workflows/study-kyodo-wide-special.yml'

permissions:
  contents: write

concurrency:
  group: study-kyodo-wide-special
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run Kyodo wide study
        run: python scripts/keirin_shogi_kyodo_wide_study.py
      - name: Commit study results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/ninecar_wide_kyodo_study/summary.json
          git add results/keirin_shogi/ninecar_wide_kyodo_study/summary.md
          if git diff --cached --quiet; then
            echo "No study changes."
          else
            git commit -m "research: save Kyodo wide special study"
            git pull --rebase origin main
            git push
          fi
