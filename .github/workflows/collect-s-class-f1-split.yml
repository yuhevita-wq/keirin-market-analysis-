name: Collect F1 S-class checkpointed quarters

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect-s-class-f1-split.yml"

permissions:
  contents: write

jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: "2024_q1"
            start_date: "2024-01-01"
            end_date: "2024-03-31"
            out_dir: "data/2024/s_class_f1_all_parts/2024_q1"
          - label: "2024_q2"
            start_date: "2024-04-01"
            end_date: "2024-06-30"
            out_dir: "data/2024/s_class_f1_all_parts/2024_q2"
          - label: "2024_q3"
            start_date: "2024-07-01"
            end_date: "2024-09-30"
            out_dir: "data/2024/s_class_f1_all_parts/2024_q3"
          - label: "2024_q4"
            start_date: "2024-10-01"
            end_date: "2024-12-31"
            out_dir: "data/2024/s_class_f1_all_parts/2024_q4"
          - label: "2025_q1"
            start_date: "2025-01-01"
            end_date: "2025-03-31"
            out_dir: "data/2025/s_class_f1_all_parts/2025_q1"
          - label: "2025_q2"
            start_date: "2025-04-01"
            end_date: "2025-06-30"
            out_dir: "data/2025/s_class_f1_all_parts/2025_q2"
          - label: "2025_q3"
            start_date: "2025-07-01"
            end_date: "2025-09-30"
            out_dir: "data/2025/s_class_f1_all_parts/2025_q3"
          - label: "2025_q4"
            start_date: "2025-10-01"
            end_date: "2025-12-31"
            out_dir: "data/2025/s_class_f1_all_parts/2025_q4"
          - label: "2026_q1"
            start_date: "2026-01-01"
            end_date: "2026-03-31"
            out_dir: "data/2026_h1/s_class_f1_all_parts/2026_q1"
          - label: "2026_q2"
            start_date: "2026-04-01"
            end_date: "2026-06-30"
            out_dir: "data/2026_h1/s_class_f1_all_parts/2026_q2"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    name: Collect ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[scrape]'

      - name: Collect race cards
        run: |
          python -m keirin_market_analysis.s_class_f1 \
            --start-date "${{ matrix.start_date }}" \
            --end-date "${{ matrix.end_date }}" \
            --out-dir "${{ matrix.out_dir }}" \
            --sleep 0.20

      - name: Validate base collection
        run: |
          OUT_DIR="${{ matrix.out_dir }}" python - <<'PY'
          import csv,json,os
          from pathlib import Path
          p=Path(os.environ['OUT_DIR'])
          s=json.loads((p/'summary.json').read_text(encoding='utf-8'))
          races=list(csv.DictReader((p/'races.csv').open(encoding='utf-8-sig')))
          entries=list(csv.DictReader((p/'entries.csv').open(encoding='utf-8-sig')))
          failures=list(csv.DictReader((p/'failures.csv').open(encoding='utf-8-sig')))
          assert s['parsed_f1_s_class_races']==len(races) and races, s
          assert s['entry_rows']==len(entries) and entries, s
          assert s['failures']==0 and not failures, failures[:20]
          assert all(r['meeting_grade']=='F1' and r['race_type'].startswith('Ｓ級') for r in races)
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Checkpoint base collection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.out_dir }}"
          git diff --cached --quiet || git commit -m "data: checkpoint ${{ matrix.label }} F1 S-class base"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; [ "$i" = "5" ] && exit 1; sleep $((i*5)); done

      - name: Enrich predicted line formation
        run: |
          python -m keirin_market_analysis.line_formation_2025 \
            --data-dir "${{ matrix.out_dir }}" \
            --sleep 0.20

      - name: Checkpoint line formation
        run: |
          git add "${{ matrix.out_dir }}"
          git diff --cached --quiet || git commit -m "data: checkpoint ${{ matrix.label }} F1 S-class lines"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; [ "$i" = "5" ] && exit 1; sleep $((i*5)); done

      - name: Extract results and payouts
        run: |
          python -m keirin_market_analysis.results_payouts_2025 \
            --data-dir "${{ matrix.out_dir }}" \
            --sleep 0.20

      - name: Validate results and payouts
        run: |
          OUT_DIR="${{ matrix.out_dir }}" python - <<'PY'
          import csv,json,os
          from pathlib import Path
          p=Path(os.environ['OUT_DIR'])
          races=list(csv.DictReader((p/'races.csv').open(encoding='utf-8-sig')))
          s=json.loads((p/'result_summary.json').read_text(encoding='utf-8'))
          failures=list(csv.DictReader((p/'result_failures.csv').open(encoding='utf-8-sig')))
          assert s['race_count']==len(races) and races, s
          assert s['complete_result_races']==len(races), s
          assert s['complete_payout_races']==len(races), s
          assert s['parse_failures']==0 and not failures, failures[:20]
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Checkpoint results and payouts
        run: |
          git add "${{ matrix.out_dir }}"
          git diff --cached --quiet || git commit -m "data: checkpoint ${{ matrix.label }} F1 S-class results"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; [ "$i" = "5" ] && exit 1; sleep $((i*5)); done

      - name: Collect historical final trifecta and trio odds
        run: |
          python -m keirin_market_analysis.historical_final_odds \
            --data-dir "${{ matrix.out_dir }}" \
            --workers 3 \
            --sleep 0.15

      - name: Validate final odds
        run: |
          OUT_DIR="${{ matrix.out_dir }}" python - <<'PY'
          import csv,json,math,os
          from pathlib import Path
          p=Path(os.environ['OUT_DIR'])
          races=list(csv.DictReader((p/'races.csv').open(encoding='utf-8-sig')))
          entries=list(csv.DictReader((p/'entries.csv').open(encoding='utf-8-sig')))
          s=json.loads((p/'odds_summary.json').read_text(encoding='utf-8'))
          trifecta=list(csv.DictReader((p/'trifecta_final_odds.csv').open(encoding='utf-8-sig')))
          trio=list(csv.DictReader((p/'trio_final_odds.csv').open(encoding='utf-8-sig')))
          assert s['race_count_attempted']==len(races), (s,len(races))
          assert s['complete_races']+s['failed_races']==len(races), s
          assert s['coverage_rate']>=0.95, s
          by_race={}
          for e in entries: by_race.setdefault(e['race_id'],set()).add(int(e['car_no']))
          tri_by={}; tf_by={}
          for r in trio: tri_by[r['race_id']]=tri_by.get(r['race_id'],0)+1
          for r in trifecta: tf_by[r['race_id']]=tf_by.get(r['race_id'],0)+1
          for rid in tri_by:
              n=len(by_race[rid])
              assert tri_by[rid]==math.comb(n,3), (rid,n,tri_by[rid])
              assert tf_by.get(rid,0)==n*(n-1)*(n-2), (rid,n,tf_by.get(rid,0))
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Checkpoint final odds
        run: |
          git add "${{ matrix.out_dir }}"
          git diff --cached --quiet || git commit -m "data: complete ${{ matrix.label }} F1 S-class dataset"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; [ "$i" = "5" ] && exit 1; sleep $((i*5)); done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s-class-f1-${{ matrix.label }}
          retention-days: 7
          path: ${{ matrix.out_dir }}
          if-no-files-found: ignore
