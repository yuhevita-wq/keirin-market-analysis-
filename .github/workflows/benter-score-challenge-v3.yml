name: Benter V3 score baseline challenge
on:
  push:
    branches:
      - research/benter-score-challenge-v3-20261018
    paths:
      - .github/workflows/benter-score-challenge-v3.yml
      - research/benter_score_challenge_v3/fit_and_freeze.py
      - research/benter_score_challenge_v3/score_frozen.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train_freeze_score:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/benter-score-challenge-v3-20261018
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/benter_fundamental_v1/train_v1.py
            /research/benter_structural_discovery_v2/discover_v2.py
            /research/benter_structural_discovery_v2/output/models.json
            /research/benter_score_challenge_v3/fit_and_freeze.py
            /research/benter_score_challenge_v3/score_frozen.py
            /data/2023/s_class_f1_all_parts/*/entries.csv
            /data/2023/s_class_f1_all_parts/*/results.csv
            /data/2023/s_class_f1_all_parts/*/races.csv
            /data/2024/s_class_f1_all_parts/*/entries.csv
            /data/2024/s_class_f1_all_parts/*/results.csv
            /data/2024/s_class_f1_all_parts/*/races.csv
            /data/2025/s_class_f1_all_parts/*/entries.csv
            /data/2025/s_class_f1_all_parts/*/results.csv
            /data/2025/s_class_f1_all_parts/*/races.csv
            /data/2026_future_block1/s_class_f1_20260701_20260830/races.csv
            /data/2026_future_block1/s_class_f1_20260701_20260830/entries.csv
            /data/2026_future_block1/s_class_f1_20260701_20260830/results.csv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Numeric and tree model dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.5,<2' 'joblib>=1.3'
      - name: Fit on history and freeze all unseen July-August predictions
        run: python -u research/benter_score_challenge_v3/fit_and_freeze.py
      - name: Commit forecasts before reading any H2 result
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f --sparse research/benter_score_challenge_v3/frozen_2026h2_probabilities.csv research/benter_score_challenge_v3/frozen_manifest.json research/benter_score_challenge_v3/frozen_model.joblib
          git commit -m "Freeze V3 out-of-period predictions without inspecting target results [skip ci]"
          git push origin HEAD:research/benter-score-challenge-v3-20261018
      - name: Score frozen predictions separately against actual results
        run: python -u research/benter_score_challenge_v3/score_frozen.py
      - name: Archive objective results
        run: |
          git add -f --sparse research/benter_score_challenge_v3/scorecard.json research/benter_score_challenge_v3/individual_results.csv research/benter_score_challenge_v3/daily_results.csv
          git commit -m "Preserve V3 independent score-only comparison and day-cluster confidence [skip ci]"
          git push origin HEAD:research/benter-score-challenge-v3-20261018
      - uses: actions/upload-artifact@v4
        with:
          name: v3-score-baseline-challenge
          path: |
            research/benter_score_challenge_v3/frozen_2026h2_probabilities.csv
            research/benter_score_challenge_v3/frozen_manifest.json
            research/benter_score_challenge_v3/scorecard.json
            research/benter_score_challenge_v3/daily_results.csv
