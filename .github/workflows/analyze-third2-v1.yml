name: Analyze later S-class preliminary third-place candidates v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-third2-v1.yml"
      - "src/keirin_market_analysis/analyze_third2_v1.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Analyze third-place patterns and two-candidate rules
        run: python -m keirin_market_analysis.analyze_third2_v1
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/2025/s_class_yosen/simulations/mainline_v1/third2_exploration.json')
          s=json.loads(p.read_text(encoding='utf-8'))
          assert s['later_races']==458, s
          assert s['mainline_top2_races']==239, s
          assert len(s['two_candidate_rule_exploration'])==5, s
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - name: Commit analysis output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/2025/s_class_yosen/simulations/mainline_v1/third2_exploration.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "analysis: explore two third-place candidates for later S級予選"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
