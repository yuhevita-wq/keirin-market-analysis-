name: Study Ninecar Board Policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_ninecar_board_policy_study.py'
      - '.github/workflows/study-ninecar-board-policy.yml'

permissions:
  contents: write

concurrency:
  group: study-ninecar-board-policy
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run board policy study
        run: python scripts/keirin_shogi_ninecar_board_policy_study.py
      - name: Commit study result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/ninecar_board_policy_study.json
          if git diff --cached --quiet; then
            echo "No study changes."
          else
            git commit -m "research: save nine-car board policy study"
            git pull --rebase origin main
            git push
          fi
