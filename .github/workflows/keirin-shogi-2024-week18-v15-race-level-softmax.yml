name: Keirin Shogi 2024 Week 18 v15 Race-Level Softmax
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-2024-week18-v15-race-level-softmax.yml'
      - 'scripts/keirin_shogi_weekly_v15_race_level_softmax.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/keirin_shogi_weekly_v15_race_level_softmax.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v15_race_level_softmax/2024-04-29_2024-05-05
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v15 race-level softmax 2024 week 18"
            git push
          fi
