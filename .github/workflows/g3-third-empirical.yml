name: G3 third position census before formula selection
on:
  push:
    branches: [research/g3-independent-first-20261018]
    paths:
      - .github/workflows/g3-third-empirical.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: g3-third-empirical-only
  cancel-in-progress: false
jobs:
  observe_real_third:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/g3-independent-first-20261018
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/grade_races/g3/*/*.zip
            /research/g3_independent_v1/g3_third_empirical.py
            /research/g3_independent_v1/train_g3_second.py
            /research/g3_independent_v1/train_g3_first.py
            /research/g3_independent_v1/vendor/train_v1.py
            /research/g3_independent_v1/vendor/discover_v2.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Numerical requirements
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Observe actual G3 third finishers first
        run: python -u research/g3_independent_v1/g3_third_empirical.py
      - name: Preserve G3 third result census for review before fitting
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f --sparse research/g3_independent_v1/output/g3_third_empirical.json
          git commit -m "G3 third place actual finishing position census before coefficient estimation [skip ci]"
          git pull --rebase origin research/g3-independent-first-20261018
          git push origin HEAD:research/g3-independent-first-20261018
      - uses: actions/upload-artifact@v4
        with:
          name: g3-third-result-census-and-features
          path: |
            research/g3_independent_v1/output/g3_third_empirical.json
            research/g3_independent_v1/stage/g3_third_matrix.npz
            research/g3_independent_v1/stage/g3_third_index.json
          retention-days: 1
