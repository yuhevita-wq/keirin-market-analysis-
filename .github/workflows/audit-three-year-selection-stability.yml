name: Audit three-year selection stability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-three-year-selection-stability.yml'
      - 'src/keirin_market_analysis/audit_three_year_selection_stability.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Run selection stability audit
        run: python -m keirin_market_analysis.audit_three_year_selection_stability
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/audits/three_year_selection_stability.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert set(x['segments'])=={'前半','中盤','後半'}
          for seg in x['segments'].values():
              assert 'true_leave_one_year_out' in seg
          print(json.dumps({k:{'count':v['all3_qualified_count'],'loo':{h:z.get('heldout_profitable') for h,z in v['true_leave_one_year_out'].items()}} for k,v in x['segments'].items()},ensure_ascii=False))
          PY
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audits/three_year_selection_stability.json
          git diff --cached --quiet || git commit -m 'analysis: add three-year selection stability audit'
          git push
