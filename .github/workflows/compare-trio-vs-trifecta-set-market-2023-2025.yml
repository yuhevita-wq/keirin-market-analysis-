name: Compare trio vs trifecta-set market 2023-2025
on:
  push:
    branches: [main]
    paths:
      - 'src/keirin_market_analysis/compare_trio_vs_trifecta_set_market_2023_2025.py'
      - '.github/workflows/compare-trio-vs-trifecta-set-market-2023-2025.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Score markets
        run: PYTHONPATH=src python -m keirin_market_analysis.compare_trio_vs_trifecta_set_market_2023_2025
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p='data/audits/trio_vs_trifecta_set_market_2023_2025.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['years_read']==[2023,2024,2025] and x['evaluation_year_2026_used'] is False
          assert x['combined']['0.0']['races']>4000
          print('VALIDATION PASS')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/trio_vs_trifecta_set_market_2023_2025.json
          git commit -m 'analysis: add trio vs trifecta-set scoring' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
