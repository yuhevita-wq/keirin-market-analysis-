name: Chapter 1 | Learn from real historical ticket PnL
on:
  workflow_dispatch:
  push:
    paths:
      - 'paper_only_ai/chapter1_profit_lab.py'
      - 'paper_only_ai/test_chapter1_profit_lab.py'
      - '.github/workflows/chapter1-historical-profit-lab.yml'
permissions:
  contents: write
concurrency:
  group: chapter1-profit-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  study-historical-profits:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            paper_only_ai
            docs/paper-only-ai-2023/autonomous_chapter1
            docs/paper-only-ai-2023/chapter1_profit_lab
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical fitting and inference dependencies
        run: |
          python -m pip install 'numpy<3' 'pandas<3' 'scipy<2' 'scikit-learn<2' 'joblib<2' 'optuna<5'
      - name: Verify immutable 2023 foundation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen_line_full
          gh release download paper-only-line-rf-2023-v1 --pattern 'line_aware_rf_2023.tar.gz' --dir frozen_line_full
          tar -xzf frozen_line_full/line_aware_rf_2023.tar.gz -C frozen_line_full
          test -s frozen_line_full/manifest.json
      - name: Test probability normalization and anti-overfit profit decision
        run: |
          python -m py_compile paper_only_ai/chapter1_profit_lab.py
          python paper_only_ai/test_chapter1_profit_lab.py
      - name: Let AI learn 2023 market discrepancy and evaluate completed races
        env:
          GH_TOKEN: ${{ github.token }}
          FROZEN_LINE_FULL_DIR: frozen_line_full
          PYTHONUNBUFFERED: '1'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python paper_only_ai/chapter1_profit_lab.py
      - name: Save complete unedited loss and profit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-historical-profit-report-${{ github.run_id }}
          path: docs/paper-only-ai-2023/chapter1_profit_lab/
          if-no-files-found: warn
          retention-days: 90
      - name: Persist fixed historical report to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/paper-only-ai-2023/chapter1_profit_lab/2023_market_fusion.json
          if ! git diff --cached --quiet; then
            git commit -m "Record precommitted odds-aware AI historical-profit experiment"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
