name: Discover new formation unions from outcomes 2023
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-formation-unions-outcomes-2023.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[scrape]'
      - name: Check study implementation
        run: |
          python -m py_compile research/formation_discovery_from_outcomes_20261028/discover.py
          python - <<'PY'
          import research.formation_discovery_from_outcomes_20261028.discover as d
          assert d.START=="2023-01-01" and d.END=="2023-04-30"
          assert len(d.SOURCES)==4
          assert d.union([((1,2),(3,4),(5,6))])=={(a,b,c) for a in (1,2) for b in (3,4) for c in (5,6)}
          print("DISCOVERY_UNION_VALIDATED")
          PY
      - name: Observe actual outcomes and discover variable complete formation sets
        env:
          KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM: ${{ secrets.KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM }}
        run: python research/formation_discovery_from_outcomes_20261028/discover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-formation-unions-${{ github.run_id }}
          path: research/formation_discovery_from_outcomes_20261028/result.json
          if-no-files-found: warn
      - name: Save result
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/formation_discovery_from_outcomes_20261028/result.json
          git commit -m 'research: discovered formation union train and holdout results'
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
