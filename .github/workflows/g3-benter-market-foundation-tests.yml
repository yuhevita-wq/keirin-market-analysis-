name: G3 Benter market bridge strict offline tests
on:
  push:
    branches: [research/g3-independent-first-20261018]
    paths:
      - .github/workflows/g3-benter-market-foundation-tests.yml
      - research/g3_independent_v1/benter_market/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market_foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/g3-independent-first-20261018
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/g3_independent_v1/benter_market/
            /research/g3_independent_v1/train_g3_first.py
            /research/g3_independent_v1/vendor/train_v1.py
            /research/g3_independent_v1/vendor/discover_v2.py
            /research/g3_independent_v1/output/g3_first_win_report.json
            /research/g3_independent_v1/predict_g3_first_second.py
            /research/g3_independent_v1/predict_g3_ordered_triples.py
            /research/g3_independent_v1/test_g3_second.py
            /research/g3_independent_v1/test_g3_third.py
            /research/g3_independent_v1/models/g3_second_conditional_v1.json
            /research/g3_independent_v1/models/g3_third_conditional_v1.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install math dependencies only
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Syntax preflight
        run: python -m compileall -q research/g3_independent_v1/benter_market/
      - name: Unit tests for G3 model and every wager type
        run: |
          python -m unittest discover -s research/g3_independent_v1/benter_market -p 'test_*.py' -v
          python -m unittest discover -s research/g3_independent_v1 -p 'test_g3_*.py' -v
