name: Analyze market support 1-3-4 wide BOX 2023
on:
  push:
    paths:
      - '.github/workflows/analyze-market-support-134-wide-box-2023.yml'
      - 'src/keirin_market_analysis/analyze_market_support_134_wide_box_2023.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/keirin_market_analysis/analyze_market_support_134_wide_box_2023.py
      - name: Commit audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/market_support_134_wide_box_2023.json
          git diff --cached --quiet || git commit -m "Add 2023 market support 1-3-4 wide BOX audit"
          git push
