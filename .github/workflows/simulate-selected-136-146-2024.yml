name: Simulate selected 136-146 2024
on:
  push:
    paths:
      - 'src/keirin_market_analysis/simulate_selected_136_146_2024.py'
      - '.github/workflows/simulate-selected-136-146-2024.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/keirin_market_analysis/simulate_selected_136_146_2024.py
      - name: Commit audit output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/selected_136_146_2024.json
          git diff --cached --quiet || git commit -m 'Add 2024 selected 136-146 frozen-gate audit'
          git push
