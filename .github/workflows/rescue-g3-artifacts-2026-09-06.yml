name: Rescue live G3 artifacts to main

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rescue-g3-artifacts-2026-09-06.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: rescue-g3-artifacts-2026-09-06
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and validate confirmed-live G3 artifacts
        shell: bash
        run: |
          set -euo pipefail
          root='data/grade_races/g3'
          mkdir -p "$root"
          list="$RUNNER_TEMP/g3-live-artifacts.tsv"

          cat > "$list" <<'EOF'
          G3-2024-Q1	9785544974	data/grade_races/g3/2024/g3-2024-q1.zip
          G3-2024-Q2	9790740336	data/grade_races/g3/2024/g3-2024-q2.zip
          G3-2024-Q3	9796166761	data/grade_races/g3/2024/g3-2024-q3.zip
          G3-2024-Q4	9802470186	data/grade_races/g3/2024/g3-2024-q4.zip
          G3-2025-Q1	9810481117	data/grade_races/g3/2025/g3-2025-q1.zip
          G3-2025-Q2	9810185856	data/grade_races/g3/2025/g3-2025-q2.zip
          G3-2025-Q3	9810152428	data/grade_races/g3/2025/g3-2025-q3.zip
          G3-2025-Q4	9810151108	data/grade_races/g3/2025/g3-2025-q4.zip
          G3-2026-Q1	9825216498	data/grade_races/g3/2026_h1/g3-2026-q1.zip
          G3-2026-Q2	9824781860	data/grade_races/g3/2026_h1/g3-2026-q2.zip
          EOF

          manifest="$root/MANIFEST_RESCUED_2026-09-06.csv"
          sums="$root/SHA256SUMS_RESCUED_2026-09-06"
          printf 'dataset,artifact_id,path,bytes,sha256\n' > "$manifest"
          : > "$sums"

          while IFS=$'\t' read -r label id path; do
            mkdir -p "$(dirname "$path")"
            echo "Rescuing $label artifact=$id"
            curl --fail --location --retry 4 --retry-all-errors \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "$path"
            test -s "$path"
            unzip -tq "$path" >/dev/null
            bytes=$(stat -c%s "$path")
            sha=$(sha256sum "$path" | awk '{print $1}')
            printf '%s,%s,%s,%s,%s\n' "$label" "$id" "$path" "$bytes" "$sha" >> "$manifest"
            printf '%s  %s\n' "$sha" "$path" >> "$sums"
          done < "$list"

          test "$(tail -n +2 "$manifest" | wc -l)" -eq 10
          sha256sum -c "$sums"

      - name: Commit rescued G3 archives to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/grade_races/g3
          git commit -m 'data: rescue G3 2024-2026H1 artifacts to main'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify main contains all 10 rescued archives
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          paths=(
            data/grade_races/g3/2024/g3-2024-q1.zip
            data/grade_races/g3/2024/g3-2024-q2.zip
            data/grade_races/g3/2024/g3-2024-q3.zip
            data/grade_races/g3/2024/g3-2024-q4.zip
            data/grade_races/g3/2025/g3-2025-q1.zip
            data/grade_races/g3/2025/g3-2025-q2.zip
            data/grade_races/g3/2025/g3-2025-q3.zip
            data/grade_races/g3/2025/g3-2025-q4.zip
            data/grade_races/g3/2026_h1/g3-2026-q1.zip
            data/grade_races/g3/2026_h1/g3-2026-q2.zip
          )
          for path in "${paths[@]}"; do
            git cat-file -e "origin/main:${path}"
          done
          git cat-file -e 'origin/main:data/grade_races/g3/MANIFEST_RESCUED_2026-09-06.csv'
          git cat-file -e 'origin/main:data/grade_races/g3/SHA256SUMS_RESCUED_2026-09-06'
          echo 'Verified: all 10 rescued G3 archives are committed on origin/main.'
