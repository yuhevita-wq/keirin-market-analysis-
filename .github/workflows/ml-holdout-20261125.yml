name: Frozen integrated holdout profit audit
on:
  workflow_dispatch:
  push:
    branches: [research/ml-holdout-20261125]
    paths:
      - '.github/workflows/ml-holdout-20261125.yml'
      - 'research/ml_holdout_20261125/**'
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/ml_odds_only_20261125/
            /research/ml_integrated_20261125/
            /research/ml_holdout_20261125/
            /data/rider_condition_2025_202610_full/
            /data/2026_future_block1/s_class_f1_20260701_20260830/entries.csv
            /data/2026_future_block1/s_class_f1_20260701_20260830/payouts.csv
            /data/odds_universe_v1/data/2026_future_block1/
            /data/rider_condition_2026_backfill/*/entries.csv
            /data/rider_condition_gap_2026/batch_*/entries.csv
            /data/a_class_12/*/entries.csv
            /data/a3_challenge/*/entries.csv
      - uses: actions/download-artifact@v4
        with:
          name: integrated-ml-conditions-and-models
          run-id: 45540084128
          github-token: ${{ github.token }}
          path: frozen-models
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy<3' 'scipy<2' 'lightgbm>=4.6,<5' 'pandas<3' 'scikit-learn<2'
      - run: python -m py_compile research/ml_holdout_20261125/test.py
      - run: python -u research/ml_holdout_20261125/test.py
      - uses: actions/upload-artifact@v4
        with:
          name: holdout-profit-audit
          path: ml-holdout-results/
