name: Keirin Shogi v29 Top2 Pair Partner Orientation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-v29-top2-pair-partner-orientation.yml'
      - 'scripts/keirin_shogi_v29_top2_pair_partner_orientation.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-v29:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q scikit-learn
      - run: python scripts/keirin_shogi_v29_top2_pair_partner_orientation.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v29_top2_pair_partner_orientation
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v29 top2 pair partner orientation"
            git push
          fi
