name: Compare main vs hole 2023

on:
  push:
    branches: [main]
    paths:
      - 'src/keirin_market_analysis/compare_main_vs_hole_2023.py'
      - '.github/workflows/compare-main-vs-hole-2023.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run comparison
        run: python src/keirin_market_analysis/compare_main_vs_hole_2023.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p='data/audits/market_scenario_main_vs_hole_2023.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['year']==2023
          assert x['components']['main']['tickets']==2740
          assert x['components']['hole']['tickets']==3575
          assert x['components']['main']['wins']==571
          assert x['components']['hole']['wins']==94
          assert x['check']['combined_stake_yen']==1060300
          assert x['check']['combined_payout_yen']==782440
          print('VALID',x['components'])
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/market_scenario_main_vs_hole_2023.json
          git commit -m 'analysis: add 2023 main-vs-hole comparison' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
