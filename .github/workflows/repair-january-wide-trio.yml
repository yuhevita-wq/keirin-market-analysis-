name: Repair January wide and trio and verify saved data
on:
  push:
    branches: [data/monthly-wide-trio-20261126]
    paths: ['.github/workflows/repair-january-wide-trio.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: haruq-monthly-wide-trio
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: odds_market
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Verify saved assets, retry failed races only, consolidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair-audit
          python -u - <<'PY'
          import csv,gzip,hashlib,io,json,os,time,zipfile,tempfile
          from pathlib import Path
          from datetime import date
          from collections import Counter
          import requests
          from odds_market import collect_monthly_wide_trio as m
          from odds_market import collect_all_odds as source
          gh=m.api_session()
          api="https://api.github.com/repos/"+os.environ["GH_REPO"]
          def get(url,accept="application/vnd.github+json"):
              r=gh.get(url,headers={"Accept":accept},timeout=90)
              r.raise_for_status()
              return r
          archive=get(api+"/actions/artifacts/15090353339/zip","application/octet-stream")
          with zipfile.ZipFile(io.BytesIO(archive.content)) as z:
              names=[n for n in z.namelist() if n.rsplit("/",1)[-1]=="summary.json"]
              assert len(names)==1, "missing original audit"
              old=json.loads(z.read(names[0]))
          assert old["month"]=="2025-01" and len(old["days"])==31
          assert sum(x["complete_races"] for x in old["days"])==2163
          assert sum(len(x["failures"]) for x in old["days"])==15
          rel=get(api+"/releases/"+str(old["draft_release_id"])).json()
          assert rel["draft"] and rel["tag_name"]=="haruq-wide-trio-2025-01"
          def assets():
              out={}
              for page in range(1,101):
                  x=get(api+"/releases/"+str(rel["id"])+"/assets?per_page=100&page="+str(page)).json()
                  out.update({a["name"]:a for a in x})
                  if len(x)<100: return out
              raise RuntimeError("asset listing too large")
          def download(asset):
              return get(api+"/releases/assets/"+str(asset["id"]),"application/octet-stream").content
          def sha(b):return hashlib.sha256(b).hexdigest()
          src=requests.Session()
          src.headers["User-Agent"]="Keirin-Research-Odds-Collector/1.0"
          report={"month":"2025-01","original_run":45751664706,"original_complete":2163,"original_failures":15,"draft_release_id":rel["id"],"days":[]}
          def checkpoint():
              Path("repair-audit/summary.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          by_name=assets()
          seen=set()
          counts=Counter()
          blocked=False
          run=os.environ["GITHUB_RUN_ID"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"]
          with tempfile.TemporaryDirectory() as tmp:
              tmp=Path(tmp)
              month=tmp/f"wide-trio-2025-01-verified-{run}.csv.gz"
              with gzip.open(month,"wt",encoding="utf-8",newline="") as mf:
                  mw=csv.writer(mf);mw.writerow(m.FIELDS)
                  for item in old["days"]:
                      day=date.fromisoformat(item["date"])
                      saved=tmp/"saved.csv.gz"
                      raw=download(by_name[item["asset"]])
                      assert sha(raw)==item["sha256"],f"stored checksum mismatch {day}"
                      saved.write_bytes(raw)
                      assert m.check(saved,day)==(item["complete_races"],item["rows"])
                      with gzip.open(saved,"rt",encoding="utf-8",newline="") as f:
                          rows=[tuple(r[k] for k in m.FIELDS) for r in csv.DictReader(f)]
                      before={r[1] for r in rows}
                      fail=[]
                      excluded=0
                      print(str(day),"verified",len(before),"original failures",len(item["failures"]),flush=True)
                      urls={}
                      if item["failures"] and not blocked:
                          try:
                              urls=source.discover(src,day,2)
                          except Exception as e:
                              if isinstance(e,requests.HTTPError) and e.response is not None and e.response.status_code in (403,429): blocked=True
                              print("retry index error",type(e).__name__,flush=True)
                      for oldfail in item["failures"]:
                          rid=oldfail["race_id"]
                          print("original failure",rid,oldfail["reason"],flush=True)
                          if blocked or rid not in urls:
                              fail.append({"race_id":rid,"reason":"retry unavailable","original_reason":oldfail["reason"]})
                              continue
                          assert rid not in before
                          try:
                              time.sleep(2)
                              r=src.get(urls[rid],timeout=35)
                              if r.status_code in (403,429): blocked=True
                              r.raise_for_status()
                              added=m.parse_two(r.text,rid,day)
                              rows.extend(added)
                          except source.ExcludedRace:
                              excluded+=1
                          except Exception as e:
                              reason=type(e).__name__+": "+str(e)[:180]
                              fail.append({"race_id":rid,"reason":reason,"original_reason":oldfail["reason"]})
                              print("retry failure",rid,reason,flush=True)
                      dayfile=tmp/"day.csv.gz"
                      with gzip.open(dayfile,"wt",encoding="utf-8",newline="") as f:
                          wr=csv.writer(f);wr.writerow(m.FIELDS);wr.writerows(rows)
                      n,nrows=m.check(dayfile,day)
                      ids={r[1] for r in rows}
                      assert n==len(ids) and not seen.intersection(ids)
                      assert nrows==len(rows)
                      assert n+item["girls_excluded"]+excluded+len(fail)==item["discovered"]
                      seen.update(ids)
                      counts.update(r[3] for r in rows)
                      mw.writerows(rows)
                      report["days"].append({"date":str(day),"original_complete":len(before),"complete_races":n,"recovered":n-len(before),"girls_excluded":item["girls_excluded"]+excluded,"failures":fail,"rows":nrows})
                      checkpoint()
              expected_hash=sha(month.read_bytes())
              with gzip.open(month,"rt",encoding="utf-8",newline="") as f:
                  readback=list(csv.DictReader(f))
              assert len(readback)==sum(counts.values()) and len({r["race_id"] for r in readback})==len(seen)
              assert len({(r["race_id"],r["bet_type"],r["selection"]) for r in readback})==len(readback)
              m.upload(gh,rel,month)
              assert sha(download(assets()[month.name]))==expected_hash,"monthly upload readback mismatch"
              report.update(complete_races=len(seen),recovered=len(seen)-2163,remaining_failures=sum(len(x["failures"]) for x in report["days"]),wide_rows=counts["wide"],trio_rows=counts["3renpuku"],month_asset=month.name,month_sha256=expected_hash,storage_readback_verified=True,source_blocked=blocked)
              report["status"]="complete" if not report["remaining_failures"] else "partial_verified"
              checkpoint()
              manifest=tmp/f"wide-trio-2025-01-manifest-{run}.json"
              manifest.write_bytes(Path("repair-audit/summary.json").read_bytes())
              m.upload(gh,rel,manifest)
              assert sha(download(assets()[manifest.name]))==sha(manifest.read_bytes())
          print(json.dumps({k:v for k,v in report.items() if k!="days"},ensure_ascii=False),flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"## Verified January collection\n\nRaces: {report['complete_races']}\n\nRecovered: {report['recovered']}\n\nRemaining: {report['remaining_failures']}\n\nStatus: {report['status']}\n\nAuthenticated storage readback: verified\n")
          if report["remaining_failures"]:
              print("::warning::Some races remain unresolved; verified partial data saved. Consult manifest.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: january-repair-audit
          path: repair-audit/
          if-no-files-found: warn
          retention-days: 30
