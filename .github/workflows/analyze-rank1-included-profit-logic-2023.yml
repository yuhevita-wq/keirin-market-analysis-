name: Analyze rank1 included profit logic 2023
on:
  push:
    paths:
      - 'src/keirin_market_analysis/analyze_rank1_included_profit_logic_2023.py'
      - '.github/workflows/analyze-rank1-included-profit-logic-2023.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/keirin_market_analysis/analyze_rank1_included_profit_logic_2023.py
      - name: Commit audit output
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/audits/rank1_included_profit_logic_2023.json
          git diff --cached --quiet || git commit -m 'Add rank1 included profit audit 2023'
          git push
