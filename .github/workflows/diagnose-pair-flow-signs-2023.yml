name: Diagnose pair-flow signs 2023
on:
  push:
    paths:
      - 'src/keirin_market_analysis/diagnose_pair_flow_signs_2023.py'
      - '.github/workflows/diagnose-pair-flow-signs-2023.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run diagnostic
        run: python src/keirin_market_analysis/diagnose_pair_flow_signs_2023.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/audits/pair_flow_sign_diagnostic_2023.json',encoding='utf-8'))
          assert x['must_enter_races'] > 300
          assert set(x['by_formation_sign_category']).issubset({'++','+-','--'})
          print('PASS')
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/pair_flow_sign_diagnostic_2023.json
          git commit -m 'analysis: save pair-flow sign diagnostic 2023' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
