name: ML-centered finite rolling selection
on:
  push:
    branches: [research/ml-centered-autoselection-20261128]
    paths:
      - 'research/ml_centered_20261128/**'
      - '.github/workflows/ml-centered-autoselection-20261128.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  learn:
    strategy:
      fail-fast: false
      matrix:
        bet: [exacta, trio]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/ml_centered_20261128/
            /data/rider_condition_2025_202610_full/*.csv.gz
            /data/odds_only/odds_2025.jsonl.gz
            /data/odds_only/odds_2026.jsonl.gz
            /data/2025/**/payouts.csv
            /data/2026_h1/**/payouts.csv
            /data/a_class_12/2025*/payouts.csv
            /data/a_class_12/2026_0*/payouts.csv
            /data/a3_challenge/2025*/payouts.csv
            /data/a3_challenge/2026_0*/payouts.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.2 scikit-learn==1.6.1 lightgbm==4.6.0
      - name: Compile and validate probability objective
        run: |
          python -m py_compile research/ml_centered_20261128/train.py
          python research/ml_centered_20261128/train.py --self-test
      - name: Run finite machine-learning search and rolling evaluation
        run: python -u research/ml_centered_20261128/train.py ${{ matrix.bet }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.bet }}-ml-centered-autoselection
          path: ml_centered_output/
          if-no-files-found: warn
