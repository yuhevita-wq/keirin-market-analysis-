name: GEN008 four models | all 3連単 and 3連複 paper marks feedback
on:
  push:
    branches: [main]
    paths:
      - 'research/ai_nursery/gen008_all_marks_experiment.py'
      - 'research/ai_nursery/verify_gen008_all_marks.py'
      - 'research/ai_nursery/test_gen008_all_marks.py'
      - '.github/workflows/baby-ai-gen008-all-marks-learning.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gen008-all-trifecta-and-trio-marks-research
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing four GEN008 research model dependencies
        run: python -m pip install -e '.[scrape]' 'numpy>=1.26' 'scipy>=1.12'
      - name: Verify exhaustive sheet and inherited checkpoints
        run: |
          python -m py_compile research/ai_nursery/gen008_all_marks_experiment.py research/ai_nursery/verify_gen008_all_marks.py research/ai_nursery/test_gen008_all_marks.py
          python research/ai_nursery/test_gen008_all_marks.py
          python research/ai_nursery/verify_gen008_frozen_exam.py
          python research/ai_nursery/test_gen008_v3_market_error.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/ai_nursery/outputs/GEN-008-V3-MARKET-ERROR/dec-2023-expanded-authentic-prices/market_error_fit.json')
          f=json.loads(p.read_text())
          assert f['algorithm_sha256']=='48c37ededf914ddffe3f20a5e85bbe18343d8206d6f116db0fdf147221c28cfe'
          assert f['train_dates']==['2023-09-15','2023-10-07']
          print('FOUR_INHERITED_MODELS_AUDITED')
          PY
      - name: Full-field virtual JPY100 marking and supervised four-branch learning
        run: |
          if [ -f research/ai_nursery/outputs/GEN-008-ALL-MARKS/2024-02-01-to-14/summary.json ]; then
            echo 'Immutable experimental archive already exists'
          else
            python research/ai_nursery/gen008_all_marks_experiment.py
          fi
      - name: Recompute all marks outcomes and learning without any retroactive selection
        run: python research/ai_nursery/verify_gen008_all_marks.py
      - name: Archive exhaustive sheets and independently frozen test summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/ai_nursery/outputs/GEN-008-ALL-MARKS/2024-02-01-to-14/
          git add docs/ai-lab/gen008-all-marks-feb2024.json
          if git diff --cached --quiet; then echo 'Already archived'; exit 0; fi
          git commit -m 'data: archive four Gen8 complete paper mark sheets, feedback, and blind scoring'
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Failed to publish immutable evidence' >&2
          exit 1
