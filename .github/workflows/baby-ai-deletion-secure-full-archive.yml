name: GEN008 | full encrypted archive audit and secure retraining
on:
  push:
    branches: [main]
    paths:
      - 'research/deletion_ai/audit_full_archive_sources.py'
      - 'research/deletion_ai/secure_seven_bet_bridge.py'
      - 'research/deletion_ai/train_secure_full_archive_2023_2024.py'
      - 'research/deletion_ai/test_secure_seven_bet_bridge.py'
      - '.github/workflows/baby-ai-deletion-secure-full-archive.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gen008-secure-full-seven-bet-archive-2023-2025
  cancel-in-progress: false
jobs:
  audit_and_secure_training:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing models and secure market parser prerequisites
        run: python -m pip install -e '.[scrape]' 'numpy>=1.26' 'scipy>=1.12'
      - name: Verify official seven-bet CMS decryption using synthetic data only
        run: |
          python -m py_compile research/deletion_ai/audit_full_archive_sources.py research/deletion_ai/secure_seven_bet_bridge.py research/deletion_ai/train_secure_full_archive_2023_2024.py research/deletion_ai/test_secure_seven_bet_bridge.py
          python research/deletion_ai/test_secure_seven_bet_bridge.py
          python research/deletion_ai/test_deletion_2023.py
      - name: Expose original source omission without assuming plaintext coverage
        run: |
          if [ -f data/audits/deletion_full_archive_source_gap.json ]; then
            echo 'Source omission audit exists: immutable, no overwrite.'
          else
            python research/deletion_ai/audit_full_archive_sources.py
          fi
      - name: Check locally configured Actions key without printing it
        id: key_gate
        env:
          KEY: ${{ secrets.KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM }}
        run: |
          if [ -n "$KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Authorized private-key secret detected; executing secure training.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'FULL-ARCHIVE TRAINING NOT RUN: the owner has not configured repository Actions secret KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Existing sealed odds were audited but NOT decrypted. No prices have been guessed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Privately train on all seven-bet sealed sources from 2023 and 2024
        if: steps.key_gate.outputs.available == 'true'
        env:
          KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM: ${{ secrets.KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM }}
        run: |
          if [ -f research/deletion_ai/outputs/GEN-008-SECURE-FULL-ARCHIVE-2023-2024/summary.json ]; then
            echo 'Sealed-source checkpoint already archived; do not overwrite.'
          else
            python research/deletion_ai/train_secure_full_archive_2023_2024.py
          fi
      - name: Publish public coverage audit and ONLY nonsecret aggregate outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audits/deletion_full_archive_source_gap.json
          if [ -f research/deletion_ai/outputs/GEN-008-SECURE-FULL-ARCHIVE-2023-2024/summary.json ]; then
            git add research/deletion_ai/outputs/GEN-008-SECURE-FULL-ARCHIVE-2023-2024/
            git add docs/ai-lab/gen008-secure-full-archive.json
          fi
          if git diff --cached --quiet; then
            echo 'No new public aggregate evidence.'
            exit 0
          fi
          git commit -m 'data: audit omitted sealed books and publish sanitized full-universe deletion model scores'
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Failed to publish public aggregates' >&2
          exit 1
