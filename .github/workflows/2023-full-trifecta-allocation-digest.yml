name: Extract 2023 true-outcome AI allocation error diagnostics

on:
  push:
    branches:
      - research/trifecta-all-ticket-allocation-errors-2023
    paths:
      - 'research/independent_trifecta_2023/allocation_error_digest.py'
      - '.github/workflows/2023-full-trifecta-allocation-digest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize-completed-frozen-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout completed independent 2023 all-ticket results
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/independent_trifecta_2023/allocation_error_digest.py
            /data/audits/independent_trifecta_allocation_errors_2023.json
      - name: Summarize 2023 unused races and compare with in-sample structure
        run: |
          set -euo pipefail
          python -m py_compile research/independent_trifecta_2023/allocation_error_digest.py
          python research/independent_trifecta_2023/allocation_error_digest.py
          test -s data/audits/independent_trifecta_allocation_errors_2023_topline.json
          test -s data/audits/independent_trifecta_allocation_errors_2023_digest.json
      - name: Publish two directly readable diagnostic files on research branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse data/audits/independent_trifecta_allocation_errors_2023_topline.json data/audits/independent_trifecta_allocation_errors_2023_digest.json
          git diff --cached --quiet || git commit -m 'research: publish independent 2023 true holdout structural probability error diagnosis'
          git push origin HEAD:research/trifecta-all-ticket-allocation-errors-2023
      - name: Preserve source and topline for reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2023-full-trifecta-probability-allocation-error-summary
          path: |
            data/audits/independent_trifecta_allocation_errors_2023_topline.json
            data/audits/independent_trifecta_allocation_errors_2023_digest.json
          retention-days: 90
