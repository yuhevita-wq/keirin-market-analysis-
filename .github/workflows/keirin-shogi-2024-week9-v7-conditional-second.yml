name: Keirin Shogi 2024 Week 9 v7 Conditional Second
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-2024-week9-v7-conditional-second.yml'
      - 'scripts/keirin_shogi_weekly_v7_conditional_second.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/keirin_shogi_weekly_v7_conditional_second.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v7_conditional_second/2024-02-26_2024-03-03
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v7 conditional-second 2024 week 9"
            git push
          fi
