name: Chapter 1 | Test deletion against equal-size random and favorites
on:
  workflow_dispatch:
  push:
    paths:
      - 'paper_only_ai/chapter1_full_sheet_deletion_controls.py'
      - 'paper_only_ai/test_chapter1_full_sheet_deletion_controls.py'
      - '.github/workflows/chapter1-full-sheet-deletion-controls.yml'
permissions:
  contents: write
jobs:
  frozen-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            paper_only_ai
            docs/paper-only-ai-2023/chapter1_accuracy_ai
            docs/paper-only-ai-2023/autonomous_chapter1
            docs/paper-only-ai-2023/chapter1_full_sheet_deletion
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install 'numpy<3' 'pandas<3' 'scipy<2' 'scikit-learn<2' 'joblib<2' 'optuna<5'
      - name: Unit-test exact matched-mark-count controls
        run: |
          python -m py_compile paper_only_ai/chapter1_full_sheet_deletion_controls.py
          python paper_only_ai/test_chapter1_full_sheet_deletion_controls.py
      - name: Score frozen November/December model against equal-count controls
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python paper_only_ai/chapter1_full_sheet_deletion_controls.py
      - name: Preserve immutable-audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deletion-fixed-count-controls-${{ github.run_id }}
          path: docs/paper-only-ai-2023/chapter1_full_sheet_deletion/fixed_count_controls_2023.json
          if-no-files-found: warn
          retention-days: 90
      - name: Commit diagnostic without updating original result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/paper-only-ai-2023/chapter1_full_sheet_deletion/fixed_count_controls_2023.json
          if ! git diff --cached --quiet; then
            git commit -m "Record equal-stake independent deletion controls"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
