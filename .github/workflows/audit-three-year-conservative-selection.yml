name: Audit conservative three-year selection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-three-year-conservative-selection.yml'
      - 'src/keirin_market_analysis/audit_three_year_conservative_selection.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e .
      - run: python -m keirin_market_analysis.audit_three_year_conservative_selection
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audits/three_year_conservative_selection.json
          git diff --cached --quiet || git commit -m 'analysis: add conservative three-year selection audit'
          git push
