name: Three random races geometric nonpurchase audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/three-random-joint-formations-diagnostic.yml'
      - 'research/three_random_joint_formation_allocation_20261029/diagnostic.py'
permissions:
  contents: write
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m py_compile research/three_random_joint_formation_allocation_20261029/diagnostic.py
      - run: python research/three_random_joint_formation_allocation_20261029/diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-real-formations-of-three-${{ github.run_id }}
          path: research/three_random_joint_formation_allocation_20261029/geometry_diagnostic.json
          retention-days: 30
          if-no-files-found: warn
      - name: Save only research report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp research/three_random_joint_formation_allocation_20261029/geometry_diagnostic.json /tmp/three-geometries.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/three-geometries.json research/three_random_joint_formation_allocation_20261029/geometry_diagnostic.json
            git add research/three_random_joint_formation_allocation_20261029/geometry_diagnostic.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'research: save concrete nonpurchased three-race formation diagnostics'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
