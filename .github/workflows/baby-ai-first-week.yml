name: Baby AI GEN-001 first seven days
on:
  push:
    branches: [main]
    paths:
      - 'research/ai_nursery/train_week.py'
      - 'research/ai_nursery/test_week.py'
      - '.github/workflows/baby-ai-first-week.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: baby-ai-first-week
  cancel-in-progress: false
jobs:
  seven-day-learn:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Learn the first available common A/S week in date order
        run: |
          python -m pip install 'numpy>=1.26'
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python research/ai_nursery/train_week.py
      - name: Verify saved chronology and frozen paper marks
        run: python research/ai_nursery/test_week.py
      - name: Commit first generation diary and weight checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ai_nursery/outputs/GEN-001/ docs/ai-lab/nursery-summary.json docs/ai-lab/nursery-history.json docs/ai-lab/nursery-checkpoint.json
          if git diff --cached --quiet; then echo "No changed outcomes"; exit 0; fi
          git commit -m "data: save infant GEN-001 first seven days of chronological learning"
          git pull --rebase origin main
          git push origin HEAD:main
