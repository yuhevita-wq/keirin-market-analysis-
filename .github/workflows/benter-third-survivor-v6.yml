name: Benter V6 residual third-line topology
on:
  push:
    branches:
      - research/benter-third-survivor-v6-20261018
    paths:
      - .github/workflows/benter-third-survivor-v6.yml
      - research/benter_third_survivor_v6/model_survivor_v6.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fit_and_replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/benter-third-survivor-v6-20261018
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/benter_third_survivor_v6/model_survivor_v6.py
            /research/benter_line_conditional_v5/model_line_conditional.py
            /research/benter_line_conditional_v5/parameters_pretest.json
            /research/benter_score_challenge_v3/frozen_2026h2_probabilities.csv
            /research/benter_calibration_v4/sep_predictions_frozen.csv
            /research/benter_calibration_v4/sep_holdout/races.csv
            /research/benter_calibration_v4/sep_holdout/results.csv
            /research/benter_structural_discovery_v2/output/test_full_plus_line_win_probability.csv
            /data/2026_future_block1/s_class_f1_20260701_20260830/races.csv
            /data/2026_future_block1/s_class_f1_20260701_20260830/results.csv
            /data/2026_h1/s_class_f1_all/races.csv
            /data/2026_h1/s_class_f1_all/results.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical libs
        run: pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Learn survivor correction only using July-Aug 2026
        run: python -u research/benter_third_survivor_v6/model_survivor_v6.py fit
      - name: Freeze corrections BEFORE holdout scoring
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f --sparse research/benter_third_survivor_v6/frozen_3rd_survivor_parameters.json
          git commit -m "Freeze third-survivor topology coefficients before scoring other months [skip ci]"
          git push origin HEAD:research/benter-third-survivor-v6-20261018
      - name: Score September holdout and count line residuals
        run: python -u research/benter_third_survivor_v6/model_survivor_v6.py score-sep
      - name: Score additional H1 reverse-chronological replication
        run: python -u research/benter_third_survivor_v6/model_survivor_v6.py score-h1
      - name: Archive full outcome audit
        run: |
          git add -f --sparse research/benter_third_survivor_v6/september_survivor_report.json research/benter_third_survivor_v6/september_survivor_by_race.csv research/benter_third_survivor_v6/h1_survivor_report.json
          git commit -m "Evaluate frozen survivor-line probabilities on September and H1 [skip ci]"
          git push origin HEAD:research/benter-third-survivor-v6-20261018
      - uses: actions/upload-artifact@v4
        with:
          name: survivor-third-V6
          path: |
            research/benter_third_survivor_v6/frozen_3rd_survivor_parameters.json
            research/benter_third_survivor_v6/september_survivor_report.json
            research/benter_third_survivor_v6/h1_survivor_report.json
