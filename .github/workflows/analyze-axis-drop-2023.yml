name: Analyze axis and drop 2023

on:
  push:
    paths:
      - '.github/workflows/analyze-axis-drop-2023.yml'
      - 'src/keirin_market_analysis/analyze_axis_drop_2023.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run analysis
        run: python src/keirin_market_analysis/analyze_axis_drop_2023.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/audits/axis_drop_rule_search_2023.json
          git diff --cached --quiet || git commit -m "Analyze 2023 axis and drop rules"
          git push
