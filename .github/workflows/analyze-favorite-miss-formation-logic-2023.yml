name: Analyze favorite miss formation logic 2023
on:
  push:
    paths:
      - '.github/workflows/analyze-favorite-miss-formation-logic-2023.yml'
      - 'src/keirin_market_analysis/analyze_favorite_miss_formation_logic_2023.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/keirin_market_analysis/analyze_favorite_miss_formation_logic_2023.py
      - name: Commit audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/favorite_miss_formation_logic_2023.json
          git diff --cached --quiet || git commit -m "Add 2023 favorite-miss formation logic audit"
          git push
