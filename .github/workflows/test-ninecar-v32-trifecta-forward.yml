name: Forward Test Ninecar V32 Trifecta
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_ninecar_v32_trifecta_forward.py'
      - '.github/workflows/test-ninecar-v32-trifecta-forward.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: python scripts/keirin_shogi_ninecar_v32_trifecta_forward.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/ninecar_v32_trifecta_forward/summary.json
          git diff --cached --quiet || (git commit -m "research: save v32 trifecta forward result" && git pull --rebase origin main && git push)
