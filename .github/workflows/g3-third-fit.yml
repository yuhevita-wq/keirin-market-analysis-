name: G3 third independent mathematical law discovery and verification
on:
  push:
    branches: [research/g3-independent-first-20261018]
    paths:
      - .github/workflows/g3-third-fit.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: g3-third-independent-mle
  cancel-in-progress: false
jobs:
  results_first_then_fit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/g3-independent-first-20261018
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/grade_races/g3/*/*.zip
            /research/g3_independent_v1/g3_third_empirical.py
            /research/g3_independent_v1/g3_third_fit.py
            /research/g3_independent_v1/train_g3_first.py
            /research/g3_independent_v1/train_g3_second.py
            /research/g3_independent_v1/vendor/train_v1.py
            /research/g3_independent_v1/vendor/discover_v2.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: G3 numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Reproduce and verify G3 true third-finisher position census
        run: |
          python -u research/g3_independent_v1/g3_third_empirical.py
          test -s research/g3_independent_v1/output/g3_third_empirical.json
      - name: Derive and evaluate G3 independent third-place conditional formulas
        run: |
          python -u research/g3_independent_v1/g3_third_fit.py
          test -s research/g3_independent_v1/output/g3_third_model_report.json
      - name: Save all empirical results, candidate models and calibration checks
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f --sparse research/g3_independent_v1/output/g3_third_empirical.json research/g3_independent_v1/output/g3_third_model_report.json
          git diff --staged --quiet || git commit -m "Derive G3 exclusive third-place probability from real results; chrono score all candidate formulas [skip ci]"
          git pull --rebase origin research/g3-independent-first-20261018
          git push origin HEAD:research/g3-independent-first-20261018
      - uses: actions/upload-artifact@v4
        with:
          name: g3-third-model-discovery
          path: |
            research/g3_independent_v1/output/g3_third_empirical.json
            research/g3_independent_v1/output/g3_third_model_report.json
          retention-days: 30
