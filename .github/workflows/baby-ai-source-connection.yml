name: Baby AI | connect ALL existing GitHub data sources
on:
  push:
    branches: [main]
    paths:
      - 'research/ai_nursery/source_bridge.py'
      - 'research/ai_nursery/source_connection_audit.py'
      - 'research/ai_nursery/test_source_bridge.py'
      - '.github/workflows/baby-ai-source-connection.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: baby-ai-source-connection
  cancel-in-progress: false
jobs:
  link-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric runtime only
        run: python -m pip install 'numpy>=1.26'
      - name: Read and connect all archived racecards, podiums and final odds
        run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python research/ai_nursery/source_connection_audit.py
      - name: Verify strict race-id matching, source digests and isolation
        run: OPENBLAS_NUM_THREADS=1 python research/ai_nursery/test_source_bridge.py
      - name: Save the actual connection coverage without retraining the AI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ai_nursery/source_connection/coverage.json docs/ai-lab/nursery-source-connection.json
          if git diff --cached --quiet; then
            echo "Existing manifest already validated"
            exit 0
          fi
          git commit -m "data: audit exact-ID joins across archived learner source universes"
          git pull --rebase origin main
          git push origin HEAD:main
