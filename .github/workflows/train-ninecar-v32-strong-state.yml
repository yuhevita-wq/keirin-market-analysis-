name: Train Ninecar V32 Strong State

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_ninecar_v32.py'
      - '.github/workflows/train-ninecar-v32-strong-state.yml'

permissions:
  contents: write

concurrency:
  group: train-ninecar-v32-strong-state
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Train and evaluate v3.2
        run: python scripts/keirin_shogi_ninecar_v32.py --train-evaluate
      - name: Commit model and evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/ninecar_v32
          if git diff --cached --quiet; then
            echo "No v3.2 changes."
          else
            git commit -m "model: train ninecar v3.2 strong-state overlay"
            git pull --rebase origin main
            git push
          fi
