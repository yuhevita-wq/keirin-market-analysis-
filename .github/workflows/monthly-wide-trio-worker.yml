name: Verified monthly collection worker
on:
  workflow_call:
    inputs:
      month:
        required: true
        type: string
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MONTH: ${{ inputs.month }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: odds_market
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: |
          python -m py_compile odds_market/collect_monthly_wide_trio.py
          python -m odds_market.test_collect_all_odds
      - name: Collect or resume and verify monthly assets
        run: python -u -m odds_market.collect_monthly_wide_trio --month "$MONTH" --accept-terms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-audit-${{ inputs.month }}
          path: monthly-audit/
          if-no-files-found: warn
          retention-days: 30
