name: Observation only | 2021 decision-set market calibration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/formation-subset-observe-2021.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: formation-subset-observe-2021
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pre-existing collection dependencies
        run: python -m pip install -e '.[scrape]'
      - name: Compile, regress orientation, protect reserved years
        run: |
          python -m py_compile research/formation_subset_observation_20261028/observe_2021_only.py
          python -m unittest research.snowberg_observation_corrected_20261027.test_orientation
          python - <<'PY'
          from pathlib import Path
          p=Path("research/formation_subset_observation_20261028/observe_2021_only.py")
          s=p.read_text()
          assert 'verified_results(2021)' in s
          assert 'catalog(READ_FIRST,READ_LAST)' in s
          assert 'READ_LAST="2021-12-31"' in s
          assert 'corrected.old.sealed()' not in s
          print("OBSERVATION_WINDOW_FIXED_TO_2021")
          PY
      - name: Observe 2021 only using verified sealed prices and actual results
        env:
          KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM: ${{ secrets.KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM }}
        run: python research/formation_subset_observation_20261028/observe_2021_only.py
      - name: Upload full 27-set observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formation-subset-observation-2021-${{ github.run_id }}
          path: |
            research/formation_subset_observation_20261028/summary.json
            research/formation_subset_observation_20261028/README.md
          retention-days: 30
          if-no-files-found: warn
      - name: Publish aggregate-only observation
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/formation_subset_observation_20261028/summary.json research/formation_subset_observation_20261028/README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: archive 2021 outcome-set vs market observation'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
