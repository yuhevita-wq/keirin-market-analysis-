name: Paper Chapter 1 | Two Problem AI Fork
on:
  workflow_dispatch:
  push:
    paths:
      - 'paper_only_ai/chapter1_two_problem_fork.py'
      - '.github/workflows/chapter1-two-problem-fork.yml'
permissions:
  contents: write
concurrency:
  group: chapter1-two-problem-fork
  cancel-in-progress: false
jobs:
  four-tracks-training-and-frozen-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            paper_only_ai
            docs/paper-only-ai-2023/chapter1_accuracy_ai
            docs/paper-only-ai-2023/autonomous_chapter1
            docs/paper-only-ai-2023/chapter1_full_sheet_deletion
            docs/paper-only-ai-2023/chapter1_deletion_continual
            .github/workflows/chapter1-two-problem-fork.yml
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible frozen model runtime
        run: python -m pip install 'numpy<3' 'pandas<3' 'scipy<2' 'scikit-learn<2' 'joblib<2' 'optuna<5'
      - name: Validate source and independent learning objectives
        run: |
          python -m py_compile paper_only_ai/chapter1_two_problem_fork.py
          python paper_only_ai/chapter1_frozen_2025.py --check
          python paper_only_ai/test_chapter1_iterative_deletion.py
          python paper_only_ai/chapter1_two_problem_fork.py --check
      - name: Train probability-vs-price objectives on 2025, then evaluate 2026 H1 without fitting
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          target="docs/paper-only-ai-2023/chapter1_deletion_continual/two_problem_fork"
          for q in 1 2 3 4; do
            if [ ! -f "$target/training_2025_q$q.json" ]; then
              python paper_only_ai/chapter1_two_problem_fork.py --train-quarter "$q"
              git add "$target/state.json" "$target/training_2025_q$q.json"
              git commit -m "Learn independent probability and price forks on 2025 Q$q prequentially"
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            else
              echo "Preserving sealed 2025 Q$q training results"
            fi
          done
          for q in 1 2; do
            if [ ! -f "$target/frozen_2026_q$q.json" ]; then
              python paper_only_ai/chapter1_two_problem_fork.py --eval-quarter "$q"
              git add "$target/frozen_2026_q$q.json"
              git commit -m "Frozen evaluation of four forked AIs on 2026 Q$q A-class"
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          done
          if [ ! -f "$target/summary_2026_h1.json" ]; then
            python paper_only_ai/chapter1_two_problem_fork.py --audit
            git add "$target/summary_2026_h1.json"
            git commit -m "Publish two-problem AI experiment and held-constant 2026 H1 audit"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Save partial artifacts if a later quarter fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-two-problem-AI-${{ github.run_id }}
          path: docs/paper-only-ai-2023/chapter1_deletion_continual/two_problem_fork/
          if-no-files-found: warn
          retention-days: 90
