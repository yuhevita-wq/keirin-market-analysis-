name: Keirin Shogi v27 Second Inside Outside
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-v27-second-inside-outside.yml'
      - 'scripts/keirin_shogi_v27_second_inside_outside_mixture.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v27:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q scikit-learn
      - run: python scripts/keirin_shogi_v27_second_inside_outside_mixture.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v27_second_inside_outside_mixture
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v27 second inside outside"
            git push
          fi
