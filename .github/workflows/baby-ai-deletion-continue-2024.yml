name: GEN008 Deletion AI | continue throughout 2024
on:
  push:
    branches: [main]
    paths:
      - 'research/deletion_ai/continue_train_2024.py'
      - 'research/deletion_ai/verify_continue_2024.py'
      - 'research/deletion_ai/test_continue_2024.py'
      - '.github/workflows/baby-ai-deletion-continue-2024.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gen008-deletion-2024-continue-four-frozen-2023-models
  cancel-in-progress: false
jobs:
  training:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original 2023 research dependencies
        run: python -m pip install -e '.[scrape]' 'numpy>=1.26'
      - name: Check original 2023 checkpoint, deletion arithmetic and continuation
        run: |
          python -m py_compile research/deletion_ai/continue_train_2024.py research/deletion_ai/verify_continue_2024.py research/deletion_ai/test_continue_2024.py
          python research/deletion_ai/test_deletion_2023.py
          python research/deletion_ai/test_continue_2024.py
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("research/deletion_ai/outputs/GEN-008-DELETION-RESET-2023")
          cp=json.loads((root/"checkpoint.json").read_text())
          assert cp["training_races"]==8088
          assert cp["validation_races"]==1908
          assert cp["2024_test_did_not_train_or_tune"] is True
          print("ORIGINAL_2023_IMMUTABLE_PARENT_VERIFIED",cp["after_training_sha256"])
          PY
      - name: Sequentially continue each of four learners through all 2024
        run: |
          if [ -f research/deletion_ai/outputs/GEN-008-DELETION-CONTINUE-2024/summary.json ]; then
            echo '2024 training archive exists, do not overwrite; proceed to audit'
          else
            python research/deletion_ai/continue_train_2024.py --run
          fi
      - name: Recalculate and audit 2024 online training and frozen 2025 comparison
        run: python research/deletion_ai/verify_continue_2024.py
      - name: Commit audited 2024 incremental weights and January 2025 outcomes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/deletion_ai/outputs/GEN-008-DELETION-CONTINUE-2024/
          git add docs/ai-lab/gen008-deletion-continue-2024.json
          if git diff --cached --quiet; then echo 'Training results already archived'; exit 0; fi
          git commit -m 'data: archive deletion-first 2024 continual learning and 2025 frozen independent comparison'
          for retry in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Failed publishing audit evidence to main' >&2
          exit 1
