name: Simulate support pair formations 2023

on:
  push:
    branches: [main]
    paths:
      - 'src/keirin_market_analysis/simulate_support_pair_formations_2023.py'
      - '.github/workflows/simulate-support-pair-formations-2023.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run simulation
        run: python src/keirin_market_analysis/simulate_support_pair_formations_2023.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p='data/audits/support_pair_formation_simulation_2023.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['accounting']['must_enter_evaluated'] > 300
          assert len(x['ranked_rules_by_realized_2023_roi']) == 16
          assert x['frozen_inputs']['outcome_used_only_for_scoring'] is True
          print('PASS', x['ranked_rules_by_realized_2023_roi'][:3])
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/support_pair_formation_simulation_2023.json
          git commit -m 'analysis: save 2023 support pair formation simulation' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
