name: Simulate 2023 market scenario portfolio v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/keirin_market_analysis/simulate_market_scenario_portfolio_2023_v1.py'
      - '.github/workflows/simulate-market-scenario-portfolio-2023-v1.yml'

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run 2023 v1 hobby simulation
        run: python src/keirin_market_analysis/simulate_market_scenario_portfolio_2023_v1.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p='data/audits/market_scenario_portfolio_2023_v1.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['years_read']==[2023]
          assert not x['evaluation_year_2024_used']
          assert not x['evaluation_year_2025_used']
          assert not x['evaluation_year_2026_used']
          assert x['trigami_violations']==0
          print('validated', x['roi_pct'])
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audits/market_scenario_portfolio_2023_v1.json data/audits/market_scenario_portfolio_2023_v1_decisions.csv
          git diff --cached --quiet || git commit -m 'Save 2023 market scenario portfolio v1 hobby simulation'
          git push
