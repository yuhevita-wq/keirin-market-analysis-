name: Fixed model coverage-return audit
on:
  push:
    branches: [research/ml-coverage-return-audit-20261128]
    paths:
      - 'research/ml_coverage_return_20261128/**'
      - '.github/workflows/ml-coverage-return-audit-20261128.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/ml_coverage_return_20261128/
      - uses: actions/download-artifact@v4
        with:
          name: trio-ml-centered-autoselection
          run-id: 46093918439
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frozen_source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 pandas==2.2.3
      - name: Validate audit
        run: |
          python -m py_compile research/ml_coverage_return_20261128/audit.py
          python research/ml_coverage_return_20261128/audit.py --self-test
      - name: Evaluate coverage return frontier
        run: python -u research/ml_coverage_return_20261128/audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-coverage-return-audit
          path: coverage_output/
          if-no-files-found: warn
