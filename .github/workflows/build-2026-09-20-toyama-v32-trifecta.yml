name: Build 2026-09-20 Toyama V32 Trifecta Plan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_today_2026_09_20_v32_trifecta.py'
      - '.github/workflows/build-2026-09-20-toyama-v32-trifecta.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: python scripts/keirin_shogi_today_2026_09_20_v32_trifecta.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/today_2026_09_20_v32_trifecta.json
          git diff --cached --quiet || (git commit -m "research: save 2026-09-20 Toyama v32 trifecta plan" && git pull --rebase origin main && git push)
