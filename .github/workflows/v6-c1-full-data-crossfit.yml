name: V6-C1 full 2023-2026 calibration | blocked crossfit

on:
  push:
    branches:
      - research/v6-c1-full-data-crossfit
    paths:
      - 'research/v6_c1_full_data/calibrate.py'
      - '.github/workflows/v6-c1-full-data-crossfit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v6-c1-full-data-crossfit
  cancel-in-progress: false

jobs:
  v6-c1-full-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout complete pre-race rider line cards and actual top-three outcomes
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/independent_trifecta_2023/observe.py
            /research/independent_trifecta_2023/line_dependence_v2.py
            /research/independent_trifecta_2023/aab_guarded_v3.py
            /research/independent_trifecta_2023/v4_pattern_floor_2026.py
            /research/independent_trifecta_2023/v5_rider_score_role_size_interactions.py
            /research/independent_trifecta_2023/v6_opponent_competition_structure.py
            /research/independent_trifecta_2024/calibration_audit.py
            /research/independent_trifecta_2024/validate_2025.py
            /data/a_class_12/2023_*/races.csv
            /data/a_class_12/2023_*/entries.csv
            /data/a3_challenge/2023_*/races.csv
            /data/a3_challenge/2023_*/entries.csv
            /data/2023/**/races.csv
            /data/2023/**/entries.csv
            /data/grade_races/g1g2/*2023*.zip
            /data/grade_races/g3/2023/*.zip
            /data/result_universe_v2/combined/results_2023.jsonl.gz
            /data/a_class_12/2024_*/races.csv
            /data/a_class_12/2024_*/entries.csv
            /data/a3_challenge/2024_*/races.csv
            /data/a3_challenge/2024_*/entries.csv
            /data/2024/**/races.csv
            /data/2024/**/entries.csv
            /data/grade_races/g1g2/*2024*.zip
            /data/grade_races/g3/2024/*.zip
            /data/result_universe_v2/combined/results_2024.jsonl.gz
            /data/a_class_12/2025_*/races.csv
            /data/a_class_12/2025_*/entries.csv
            /data/a3_challenge/2025_*/races.csv
            /data/a3_challenge/2025_*/entries.csv
            /data/2025/**/races.csv
            /data/2025/**/entries.csv
            /data/grade_races/g1g2/*2025*.zip
            /data/grade_races/g3/2025/*.zip
            /data/result_universe_v2/combined/results_2025.jsonl.gz
            /data/a_class_12/2026_*/races.csv
            /data/a_class_12/2026_*/entries.csv
            /data/a_class_12/pilot_2026*/races.csv
            /data/a_class_12/pilot_2026*/entries.csv
            /data/a3_challenge/2026_*/races.csv
            /data/a3_challenge/2026_*/entries.csv
            /data/2026_h1/**/races.csv
            /data/2026_h1/**/entries.csv
            /data/2026_future_block1/**/races.csv
            /data/2026_future_block1/**/entries.csv
            /data/grade_races/g3/2026_h1/*.zip
            /data/result_universe_v2/combined/results_2026.jsonl.gz
            /research/independent_trifecta_2023/weak_rider_podium_zero_excluded.py
            /research/independent_trifecta_2023/v8_targeted_weak_podium_calibration.py
            /research/v6_c1_full_data/calibrate.py

      - name: Install numerical optimization libraries
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy scipy

      - name: Assert immutable original V6 and run self tests
        run: |
          set -euo pipefail
          python -m py_compile research/v6_c1_full_data/calibrate.py
          test "$(git hash-object research/independent_trifecta_2023/observe.py)" = "19701f16c80fcc95dc8c032ed47b80dfcfe93bc6"
          test "$(git hash-object research/independent_trifecta_2023/line_dependence_v2.py)" = "2bb7362490b7b7f7eb0e8390face22f248649216"
          for year in 2023 2024 2025 2026; do
            test -s "data/result_universe_v2/combined/results_$year.jsonl.gz"
          done
          echo V6_C1_FROZEN_INPUT_VERIFIED

      - name: Calibrate V6-C1 on all eligible 2023-2026 and run year-blocked crossfit
        run: |
          set -euo pipefail
          python research/v6_c1_full_data/calibrate.py

      - name: Verify genuine model artifact and correct mass accounting
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path("data/audits/v6_c1_full_data_crossfit_2023_2026")
          m=json.loads((d/"v6_c1_fitted_model.json").read_text())
          r=json.loads((d/"v6_c1_calibration_report.json").read_text())
          assert m["model_name"]=="V6-C1"
          assert m["no_market_odds_in_features_or_labels"]
          assert m["per_race_normalize_to_one"]
          assert m["total_races"]>70000
          assert r["v6_untouched"] and r["no_market_odds_teacher"]
          assert r["crossfit_summary"]["v6_frozen"]["races"]==m["total_races"]
          for year in ["2023","2024","2025","2026"]:
              assert r["crossfit_by_stage_year"][m["selected_stage"]][year]["evaluation"]["races"]>1000
          print("V6_C1_FITTED_MODEL_AND_BLOCKED_CV_VERIFIED")
          PY

      - name: Save the trained C1 coefficients and calibration report to research branch
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/v6_c1_full_data_crossfit_2023_2026/v6_c1_fitted_model.json
          git add data/audits/v6_c1_full_data_crossfit_2023_2026/v6_c1_calibration_report.json
          if ! git diff --staged --quiet; then
            git commit -m "data: persist V6-C1 all-years calibration coefficients and crossfit audit"
            git push origin HEAD:research/v6-c1-full-data-crossfit
          fi
          echo V6_C1_MODEL_PERSISTED_IN_RESEARCH_BRANCH

      - name: Upload complete trained model and cross-validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-c1-trained-all-2023-2026-blocked-crossfit
          path: data/audits/v6_c1_full_data_crossfit_2023_2026/
          retention-days: 90
          if-no-files-found: warn
