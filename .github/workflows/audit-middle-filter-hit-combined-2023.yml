name: Audit middle filter hit and combined odds 2023

on:
  push:
    paths:
      - 'src/keirin_market_analysis/audit_middle_filter_hit_combined_2023.py'
      - '.github/workflows/audit-middle-filter-hit-combined-2023.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m keirin_market_analysis.audit_middle_filter_hit_combined_2023
      - name: Validate scope
        run: |
          python - <<'PY'
          import json
          p='data/audits/middle_filter_hit_combined_2023.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['years_read']==[2023]
          assert d['evaluation_year_2024_used'] is False
          assert d['evaluation_year_2025_used'] is False
          assert d['evaluation_year_2026_used'] is False
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/middle_filter_hit_combined_2023.json
          git commit -m 'Add 2023 middle hit and combined odds audit result' || exit 0
          git push
