name: Keirin Shogi 2024 Week 11 v9 Inverted Participation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-2024-week11-v9-inverted-participation.yml'
      - 'scripts/keirin_shogi_weekly_v9_inverted_participation.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/keirin_shogi_weekly_v9_inverted_participation.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v9_inverted_participation/2024-03-11_2024-03-17
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v9 inverted participation 2024 week 11"
            git push
          fi
