name: Search dynamic two-point laws 2023
on:
  push:
    paths:
      - 'src/keirin_market_analysis/search_dynamic_two_point_laws_2023.py'
      - '.github/workflows/search-dynamic-two-point-laws-2023.yml'
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run search
        run: python src/keirin_market_analysis/search_dynamic_two_point_laws_2023.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p='data/audits/dynamic_two_point_laws_2023.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['law_count']==12
          assert x['accounting']['must_enter_evaluated']>300
          assert x['scope'].startswith('2023 development')
          print('PASS',x['selected_for_forward_test']['law'])
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/dynamic_two_point_laws_2023.json
          git commit -m 'analysis: save dynamic two-point law search 2023' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
