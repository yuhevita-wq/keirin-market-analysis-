name: Analyze 2023 support max-entropy residuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-support-maxent-residuals-2023.yml'
      - 'src/keirin_market_analysis/analyze_support_maxent_residuals_2023.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 2023 market decomposition
        run: python src/keirin_market_analysis/analyze_support_maxent_residuals_2023.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          p='data/audits/support_maxent_residuals_2023.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['uses_results_or_payouts'] is False
          assert x['accounting']['analyzed_7_rider_races'] > 1000
          assert x['accounting']['solver_failures'] == 0
          assert x['accounting']['max_solver_marginal_error'] < 1e-9
          assert len(x['patterns_all_35']) == 35
          print('PASS',x['accounting'])
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/support_maxent_residuals_2023.json
          git commit -m 'analysis: save 2023 support max-entropy residuals' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
