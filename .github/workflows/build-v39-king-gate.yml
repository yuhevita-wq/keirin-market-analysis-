name: Build v39 King Gate
on:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_v39_king_gate_2024w1.py'
      - '.github/workflows/build-v39-king-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/keirin_shogi_v39_king_gate_2024w1.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add results/keirin_shogi/v39_king_gate_2024w1
          if ! git diff --cached --quiet; then git commit -m "results: save v39 king gate"; git push; fi
