name: Compare frozen 2024 vs 2025 structure

on:
  push:
    branches: [main]
    paths:
      - "src/keirin_market_analysis/compare_frozen_2024_2025_structure.py"
      - ".github/workflows/compare-frozen-2024-2025-structure.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Rebuild frozen 2024 decisions
        run: python -m keirin_market_analysis.simulate_2024_oos_frozen --data-dir data/2024/s_class_yosen --out-dir /tmp/frozen2024 --year 2024
      - name: Rebuild frozen 2025 decisions
        run: python -m keirin_market_analysis.simulate_2024_oos_frozen --data-dir data/2025/s_class_yosen --out-dir /tmp/frozen2025 --year 2025
      - name: Compare structural outcomes
        run: python -m keirin_market_analysis.compare_frozen_2024_2025_structure --sim-2024 /tmp/frozen2024 --sim-2025 /tmp/frozen2025 --out data/audits/frozen_structure_2024_vs_2025.json
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-structure-2024-vs-2025
          path: data/audits/frozen_structure_2024_vs_2025.json
      - name: Commit comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/frozen_structure_2024_vs_2025.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "analysis: save frozen 2024 vs 2025 structural comparison"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
