name: Rebuild nonfavorite formation collections from results
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-result-first-collections.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[scrape]'
      - run: python research/unrestricted_result_first_collections_20261028/discover.py
      - uses: actions/upload-artifact@v4
        with:
          name: result-first-collections
          path: research/unrestricted_result_first_collections_20261028/*.json
