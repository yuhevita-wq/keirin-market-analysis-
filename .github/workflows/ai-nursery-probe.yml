name: Baby AI source schema probe
on:
  push:
    branches: [main]
    paths:
      - 'research/ai_nursery/**'
      - '.github/workflows/ai-nursery-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/ai_nursery/probe.py
