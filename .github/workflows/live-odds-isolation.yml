name: Live odds isolation - strict fresh snapshots

on:
  push:
    paths:
      - 'odds_market/live_watch.py'
      - 'odds_market/market_isolation.py'
      - 'odds_market/test_live_watch.py'
      - 'odds_market/collect_all_odds.py'
      - '.github/workflows/live-odds-isolation.yml'
  workflow_dispatch:
    inputs:
      race_url:
        description: 'Authorized https://keirin.kdreams.jp/.../racedetail/16-digit-id/ URL'
        required: true
        type: string
      close_jst:
        description: 'Official cutoff, ISO 8601, e.g. 2026-10-16T20:25+09:00'
        required: true
        type: string
      confirm_authorized:
        description: 'I have permission to automatically collect and store these source odds'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: authorized-live-odds-${{ github.ref }}-${{ github.event.inputs.race_url || 'tests' }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Old all-bet parser regression
        run: python -m odds_market.test_collect_all_odds
      - name: Fresh odds, strict full combinations, synthetic 3-4-1 mispricing
        run: python -m odds_market.test_live_watch

  authorized-capture:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_authorized == true
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install requests beautifulsoup4
      - name: Collect only fully parsed source-stamped snapshots until deadline
        shell: bash
        run: |
          python -m odds_market.live_watch \
            --url "${{ inputs.race_url }}" \
            --close-jst "${{ inputs.close_jst }}" \
            --interval-seconds 45 \
            --max-age-minutes 4 \
            --out "$RUNNER_TEMP/live_private" \
            --report "$RUNNER_TEMP/isolation_report.json" \
            --accept-terms
      - name: Seal all complete snapshots with existing public recipient certificate
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/isolation_report.json"
          count=0
          while IFS= read -r -d '' odds; do
            rid="$(basename "$(dirname "$odds")")"
            basename_file="$(basename "$odds" .csv.gz)"
            dest="data/live_odds_ciphertext/$rid/$GITHUB_RUN_ID/$basename_file.p7m"
            mkdir -p "$(dirname "$dest")"
            openssl cms -encrypt -binary -aes-256-gcm \
              -in "$odds" -out "$dest" -outform DER \
              odds_market/vault_public_cert.pem
            test -s "$dest"
            count=$((count+1))
          done < <(find "$RUNNER_TEMP/live_private" -type f -name '*.csv.gz' -print0)
          test "$count" -gt 0
          echo "Sealed $count complete fresh odds snapshots; raw plaintext never committed" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit ciphertext only (not public raw odds or output reports)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/live_odds_ciphertext
          git commit -m "data(odds): seal fresh live odds observations $GITHUB_RUN_ID"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
