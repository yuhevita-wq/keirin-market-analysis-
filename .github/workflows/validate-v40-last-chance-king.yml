name: Validate v40 Last Chance KING
on:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_v40_last_chance_king.py'
      - '.github/workflows/validate-v40-last-chance-king.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: validate-v40-last-chance-king
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/keirin_shogi_v40_last_chance_king.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add results/keirin_shogi/v40_last_chance_king
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "results: save v40 last-chance KING validation"
            git push
          fi