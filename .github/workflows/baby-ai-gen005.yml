name: Baby AI GEN-005 stress on 10000 yen depletion
on:
  push:
    branches: [main]
    paths:
      - 'research/ai_nursery/train_week5.py'
      - 'research/ai_nursery/test_week5.py'
      - '.github/workflows/baby-ai-gen005.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: baby-ai-gen005
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Train on Jan 29 to Feb 4 with new simulated stress feedback
        run: |
          python -m pip install 'numpy>=1.26'
          if [ -f research/ai_nursery/outputs/GEN-005/summary.json ]; then
            echo "GEN-005 already frozen: audit only"
          else
            OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python research/ai_nursery/train_week5.py
          fi
      - name: Validate stress signals, ancestry, cashflow and result sealing
        run: |
          OPENBLAS_NUM_THREADS=1 python research/ai_nursery/test_week5.py
      - name: Archive GEN-005 records and learned weights to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ai_nursery/outputs/GEN-005/ docs/ai-lab/nursery-gen005-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: save GEN-005 stress learning week"
          git pull --rebase origin main
          git push origin HEAD:main
