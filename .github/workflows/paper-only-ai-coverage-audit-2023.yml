name: Paper-only AI | 2023 coverage audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'paper_only_ai/audit_2023_training_coverage.py'
      - '.github/workflows/paper-only-ai-coverage-audit-2023.yml'
permissions:
  contents: write
concurrency:
  group: paper-only-ai-coverage-audit-2023
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            paper_only_ai
            docs/paper-only-ai-2023
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies to reuse exact training loader
        run: python -m pip install 'numpy<3' 'pandas<3' 'scipy<2' 'scikit-learn<2' 'optuna<5' 'joblib<2'
      - name: Verify script and compute 2023 exact race-ID intersections
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -m py_compile paper_only_ai/audit_2023_training_coverage.py
          python paper_only_ai/audit_2023_training_coverage.py
      - name: Preserve audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-only-ai-2023-coverage-reconciliation
          path: docs/paper-only-ai-2023/coverage_audit_2023.json
          if-no-files-found: warn
      - name: Publish result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/paper-only-ai-2023/coverage_audit_2023.json
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile 2023 22633 historical results with AI training IDs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
