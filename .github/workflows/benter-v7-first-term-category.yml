name: V7 F1 S-class first-place special-term correction
on:
  push:
    branches:
      - research/benter-minimal-line-v7-20261018
    paths:
      - .github/workflows/benter-v7-first-term-category.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v7-f1-s-foreign-term-research
  cancel-in-progress: false
jobs:
  freeze_corrected_first_win:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/benter-minimal-line-v7-20261018
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/benter_fundamental_v1/train_v1.py
            /research/benter_structural_discovery_v2/discover_v2.py
            /research/benter_walkforward_v7/freeze_prior_win_term_category.py
            /research/benter_walkforward_v7/frozen_term_category/*
            /data/2023/s_class_f1_all_parts/*/entries.csv
            /data/2023/s_class_f1_all_parts/*/races.csv
            /data/2023/s_class_f1_all_parts/*/results.csv
            /data/2024/s_class_f1_all_parts/*/entries.csv
            /data/2024/s_class_f1_all_parts/*/races.csv
            /data/2024/s_class_f1_all_parts/*/results.csv
            /data/2025/s_class_f1_all_parts/*/entries.csv
            /data/2025/s_class_f1_all_parts/*/races.csv
            /data/2025/s_class_f1_all_parts/*/results.csv
            /data/2026_h1/s_class_f1_all/entries.csv
            /data/2026_h1/s_class_f1_all/races.csv
            /data/2026_h1/s_class_f1_all/results.csv
            /data/2026_future_block1/s_class_f1_20260701_20260830/entries.csv
            /data/2026_future_block1/s_class_f1_20260701_20260830/races.csv
            /data/2026_future_block1/s_class_f1_20260701_20260830/results.csv
            /research/benter_calibration_v4/sep_holdout/entries.csv
            /research/benter_calibration_v4/sep_holdout/races.csv
            /research/benter_calibration_v4/sep_holdout/results.csv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Existing multinomial V2 dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Refit only from earlier records and freeze separate candidate
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          for period in 2024q1 2024q2 2024q3 2024q4 2025q1 2025q2 2025q3 2025q4 2026q1 2026q2 2026julaug 2026sep
          do
            if [ -f "research/benter_walkforward_v7/frozen_term_category/independent_win_$period.csv" ]; then
              echo "Already frozen: $period; not overwriting"
              continue
            fi
            python -u research/benter_walkforward_v7/freeze_prior_win_term_category.py --period "$period"
            git add -f --sparse "research/benter_walkforward_v7/frozen_term_category/independent_win_$period.csv" "research/benter_walkforward_v7/frozen_term_category/manifest_$period.json"
            git commit -m "Freeze F1 S first-win term999 category model $period [skip ci]"
            git pull --rebase origin research/benter-minimal-line-v7-20261018
            git push origin HEAD:research/benter-minimal-line-v7-20261018
          done
