name: Unconditional result-first formation market residual discovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unconditional-formation-residuals-20261028.yml'
      - 'research/unconditional_formation_residuals_20261028/discover.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unconditional-result-first-formation-residuals
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Validate source before analysis
        run: python -m py_compile research/unconditional_formation_residuals_20261028/discover.py
      - name: Analyze complete actual-results-vs-all-trifecta-odds market
        run: python research/unconditional_formation_residuals_20261028/discover.py
      - name: Keep full output as verifiable workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unconditional-result-first-formation-${{ github.run_id }}
          path: |
            research/unconditional_formation_residuals_20261028/summary.json
            research/unconditional_formation_residuals_20261028/compact.json
          retention-days: 30
          if-no-files-found: warn
      - name: Publish read-only research results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp research/unconditional_formation_residuals_20261028/compact.json /tmp/unconditional-compact.json
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p research/unconditional_formation_residuals_20261028
            cp /tmp/unconditional-compact.json research/unconditional_formation_residuals_20261028/compact.json
            git add research/unconditional_formation_residuals_20261028/compact.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'research: publish unconditional result-first formation market residuals'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
