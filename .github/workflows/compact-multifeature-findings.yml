name: Compact multi-feature findings

on:
  push:
    paths:
      - 'src/keirin_market_analysis/compact_multifeature_findings.py'
      - '.github/workflows/compact-multifeature-findings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m keirin_market_analysis.compact_multifeature_findings
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/multifeature_signals_compact_2023_2025.json
          git commit -m 'Add compact multi-feature findings' || exit 0
          git push
