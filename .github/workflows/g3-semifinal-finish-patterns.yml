name: G3 Semifinal Finish Patterns

on:
  push:
    branches:
      - analysis/g3-day3-reality
    paths:
      - 'scripts/analyze_g3_semifinal_finish_patterns.py'
      - '.github/workflows/g3-semifinal-finish-patterns.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/g3-day3-reality
      - name: Analyze semifinal finish patterns
        run: python scripts/analyze_g3_semifinal_finish_patterns.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/g3_day3_reality/semifinal_finish_patterns.md results/g3_day3_reality/semifinal_finish_patterns.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'analysis: semifinal finish patterns output [skip ci]'
            git pull --rebase origin analysis/g3-day3-reality
            git push origin HEAD:analysis/g3-day3-reality
          fi
