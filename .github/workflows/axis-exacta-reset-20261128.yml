name: Independent exacta anchor learning
on:
  push:
    branches: ['research/axis-exacta-reset-20261128']
    paths: ['.github/workflows/axis-exacta-reset-20261128.yml','research/axis_exacta_reset_20261128/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data
            research/axis_exacta_reset_20261128
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<3' pandas scikit-learn catboost
      - run: python research/axis_exacta_reset_20261128/train.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-exacta-anchor-report
          path: axis_exacta_output/
          if-no-files-found: warn
