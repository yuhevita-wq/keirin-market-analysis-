name: Collect odds and evaluate frozen 236-146 cond134 2026 H1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-odds-and-evaluate-236-146-cond134-2026-h1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[scrape]'
      - name: Collect archived final odds for 2026 H1
        run: |
          python -m keirin_market_analysis.historical_final_odds \
            --data-dir data/2026_h1/s_class_yosen \
            --workers 3 --sleep 0.15
      - name: Validate odds coverage
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('data/2026_h1/s_class_yosen')
          races=list(csv.DictReader(open(p/'races.csv',encoding='utf-8-sig')))
          s=json.load(open(p/'odds_summary.json',encoding='utf-8'))
          assert s['race_count_attempted']==len(races), (s,len(races))
          assert s['complete_races']+s['failed_races']==len(races), s
          assert s['coverage_rate']>=0.95, s
          assert s['trio_rows']>0, s
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - name: Run frozen strategy
        run: python src/keirin_market_analysis/simulate_selected_236_146_conditional_134_2026_h1.py
      - name: Commit odds and frozen result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/2026_h1/s_class_yosen/trifecta_final_odds.csv
          git add data/2026_h1/s_class_yosen/trio_final_odds.csv
          git add data/2026_h1/s_class_yosen/odds_failures.csv
          git add data/2026_h1/s_class_yosen/odds_summary.json
          git add data/audits/selected_236_146_conditional_134_2026_h1.json
          git commit -m 'data: add 2026 H1 final odds and frozen conditional 134 check' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
