name: Independent trifecta V3 | discover hidden within-line rider arrival structures

on:
  push:
    branches:
      - research/trifecta-rider-missed-arrival-structure-all-shapes
    paths:
      - 'research/independent_trifecta_2023/rider_missed_arrival_structure_2024_2026.py'
      - '.github/workflows/independent-trifecta-rider-missed-arrival-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-trifecta-rider-missed-arrival-all-shapes
  cancel-in-progress: false

jobs:
  audit-all-conditional-stages:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Sparse checkout immutable 2023-trained model and 2024-2026 result-only datasets
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/independent_trifecta_2023/observe.py
            /research/independent_trifecta_2023/line_dependence_v2.py
            /research/independent_trifecta_2023/aab_guarded_v3.py
            /research/independent_trifecta_2023/v4_pattern_floor_2026.py
            /research/independent_trifecta_2023/rider_missed_arrival_structure_2024_2026.py
            /research/independent_trifecta_2024/calibration_audit.py
            /research/independent_trifecta_2024/validate_2025.py
            /data/a_class_12/2023_*/races.csv
            /data/a_class_12/2023_*/entries.csv
            /data/a3_challenge/2023_*/races.csv
            /data/a3_challenge/2023_*/entries.csv
            /data/2023/**/races.csv
            /data/2023/**/entries.csv
            /data/grade_races/g1g2/*2023*.zip
            /data/grade_races/g3/2023/*.zip
            /data/result_universe_v2/combined/results_2023.jsonl.gz
            /data/a_class_12/2024_*/races.csv
            /data/a_class_12/2024_*/entries.csv
            /data/a3_challenge/2024_*/races.csv
            /data/a3_challenge/2024_*/entries.csv
            /data/2024/**/races.csv
            /data/2024/**/entries.csv
            /data/grade_races/g1g2/*2024*.zip
            /data/grade_races/g3/2024/*.zip
            /data/result_universe_v2/combined/results_2024.jsonl.gz
            /data/a_class_12/2025_*/races.csv
            /data/a_class_12/2025_*/entries.csv
            /data/a3_challenge/2025_*/races.csv
            /data/a3_challenge/2025_*/entries.csv
            /data/2025/**/races.csv
            /data/2025/**/entries.csv
            /data/grade_races/g1g2/*2025*.zip
            /data/grade_races/g3/2025/*.zip
            /data/result_universe_v2/combined/results_2025.jsonl.gz
            /data/a_class_12/2026_*/races.csv
            /data/a_class_12/2026_*/entries.csv
            /data/a_class_12/pilot_2026*/races.csv
            /data/a_class_12/pilot_2026*/entries.csv
            /data/a3_challenge/2026_*/races.csv
            /data/a3_challenge/2026_*/entries.csv
            /data/2026_h1/**/races.csv
            /data/2026_h1/**/entries.csv
            /data/2026_future_block1/**/races.csv
            /data/2026_future_block1/**/entries.csv
            /data/grade_races/g3/2026_h1/*.zip
            /data/result_universe_v2/combined/results_2026.jsonl.gz

      - name: Verify immutable V2 and V3, no market odds, no earlier model changes
        run: |
          set -euo pipefail
          python -m py_compile research/independent_trifecta_2023/rider_missed_arrival_structure_2024_2026.py research/independent_trifecta_2023/aab_guarded_v3.py research/independent_trifecta_2023/v4_pattern_floor_2026.py
          test "$(git hash-object research/independent_trifecta_2023/observe.py)" = "19701f16c80fcc95dc8c032ed47b80dfcfe93bc6"
          test "$(git hash-object research/independent_trifecta_2023/line_dependence_v2.py)" = "2bb7362490b7b7f7eb0e8390face22f248649216"
          test "$(git hash-object research/independent_trifecta_2023/aab_guarded_v3.py)" = "04bb3a7956a5a5d43a987194df557838b6ac81e5"
          for year in 2023 2024 2025 2026; do
            test -s "data/result_universe_v2/combined/results_$year.jsonl.gz"
            test ! -e "data/odds_only/odds_$year.jsonl.gz"
          done
          echo FROZEN_MODELS_NO_MARKET_ALL_YEARS_VERIFIED

      - name: Audit ALL ordered triples and conditional line/rider stages over three result years
        run: |
          set -euo pipefail
          python research/independent_trifecta_2023/rider_missed_arrival_structure_2024_2026.py

      - name: Assert all three 2024-2026 cohorts and conditional probability partitions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          f='data/audits/trifecta_all_shapes_rider_missed_arrival_structures_2024_2026.json'
          x=json.load(open(f,encoding='utf-8'))
          assert x['state']=='V3_RIDER_SELECTION_STRUCTURE_RESEARCH_ALL_SHAPES_COMPLETE'
          assert x['production_model_changed'] is False
          assert x['market_odds_or_payout_used'] is False
          assert x['specific_line_shape_prioritized'] is False
          assert x['fresh_blind_out_of_sample_test'] is False
          assert x['candidate_correction_performed'] is False
          cohorts={'2024':(25348,44,13,14),'2025':(24635,43,17,17),'2026':(11797,42,13,10)}
          for year,(n,a,b,c) in cohorts.items():
              report=x['years'][year]
              assert report['races']==n
              assert report['distinct_line_shapes']>10
              assert sum(report['all_line_shape_races'].values())==n
              for stage,actual in enumerate((a,b,c),1):
                  bins=report['per_stage_category_stats'][f's{stage}/p_band']
                  assert sum(v['actual_winner_count'] for v in bins.values())==n
                  assert abs(sum(v['expected_winner_count'] for v in bins.values())-n)<.01
                  tail=report['per_stage_category_stats'][f's{stage}/tail_all']['all']
                  assert tail['actual_winner_count']==actual
              assert report['total_rare_winner_examples']==a+b+c
          print('ALL_LINE_FORMATIONS_RIDER_CONDITIONAL_STRUCTURE_CHECKS_PASSED')
          PY

      - name: Upload structure signals and all within-line conditional candidate exposures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-trifecta-rider-arrival-structure-all-shapes-2024-2026
          path: data/audits/trifecta_all_shapes_rider_missed_arrival_structures_2024_2026.json
          retention-days: 90
          if-no-files-found: warn
