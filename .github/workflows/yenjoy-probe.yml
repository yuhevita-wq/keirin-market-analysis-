name: YenJoy Probe

on:
  push:
    paths:
      - 'scripts/yenjoy_probe.py'
      - '.github/workflows/yenjoy-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml
      - name: Probe YenJoy calendar
        run: python scripts/yenjoy_probe.py
