name: Keirin Shogi v24 Second Diagnosis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-v24-second-diagnosis.yml'
      - 'scripts/keirin_shogi_v24_second_diagnosis.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q scikit-learn
      - run: python scripts/keirin_shogi_v24_second_diagnosis.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v24_second_diagnosis
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v24 second diagnosis"
            git push
          fi
