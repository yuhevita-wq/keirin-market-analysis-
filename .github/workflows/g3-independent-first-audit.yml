name: G3-only fundamental model source audit
on:
  push:
    branches: [research/g3-independent-first-20261018]
    paths:
      - .github/workflows/g3-independent-first-audit.yml
      - research/g3_independent_v1/audit_sources.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit_g3_archives:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/g3-independent-first-20261018
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/g3_independent_v1/audit_sources.py
            /data/grade_races/g3/*/*.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect G3-only archive data schemas and file coverage
        run: python -u research/g3_independent_v1/audit_sources.py
      - name: Preserve reproducible archive inventory
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f --sparse research/g3_independent_v1/output/source_archive_audit.json
          git commit -m "Inventory G3 archive records and source hashes for independent model [skip ci]"
          git pull --rebase origin research/g3-independent-first-20261018
          git push origin HEAD:research/g3-independent-first-20261018
      - uses: actions/upload-artifact@v4
        with:
          name: independent-g3-archive-audit
          path: research/g3_independent_v1/output/source_archive_audit.json
