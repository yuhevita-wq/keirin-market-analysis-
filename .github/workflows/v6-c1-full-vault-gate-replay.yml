name: V6-C1 full encrypted seven-bet odds Feb-Apr | purchase selectivity experiment

on:
  push:
    branches:
      - research/v6-c1-full-odds-and-race-gate
    paths:
      - 'research/v6_c1_full_odds_gate/secure_replay.py'
      - '.github/workflows/v6-c1-full-vault-gate-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v6-c1-full-encrypted-vault-gate-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PRIVATE_KEY_PRESENT: ${{ secrets.KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM != '' }}
    steps:
      - name: Checkout all authenticated 2023 sealed odds, previous model and sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/independent_trifecta_2023/observe.py
            /research/independent_trifecta_2023/line_dependence_v2.py
            /research/independent_trifecta_2023/aab_guarded_v3.py
            /research/independent_trifecta_2023/v4_pattern_floor_2026.py
            /research/independent_trifecta_2023/v5_rider_score_role_size_interactions.py
            /research/independent_trifecta_2023/v6_opponent_competition_structure.py
            /research/independent_trifecta_2024/calibration_audit.py
            /research/independent_trifecta_2024/validate_2025.py
            /data/a_class_12/2023_*/races.csv
            /data/a_class_12/2023_*/entries.csv
            /data/a3_challenge/2023_*/races.csv
            /data/a3_challenge/2023_*/entries.csv
            /data/2023/**/races.csv
            /data/2023/**/entries.csv
            /data/grade_races/g1g2/*2023*.zip
            /data/grade_races/g3/2023/*.zip
            /data/result_universe_v2/combined/results_2023.jsonl.gz
            /data/a_class_12/2024_*/races.csv
            /data/a_class_12/2024_*/entries.csv
            /data/a3_challenge/2024_*/races.csv
            /data/a3_challenge/2024_*/entries.csv
            /data/2024/**/races.csv
            /data/2024/**/entries.csv
            /data/grade_races/g1g2/*2024*.zip
            /data/grade_races/g3/2024/*.zip
            /data/result_universe_v2/combined/results_2024.jsonl.gz
            /data/a_class_12/2025_*/races.csv
            /data/a_class_12/2025_*/entries.csv
            /data/a3_challenge/2025_*/races.csv
            /data/a3_challenge/2025_*/entries.csv
            /data/2025/**/races.csv
            /data/2025/**/entries.csv
            /data/grade_races/g1g2/*2025*.zip
            /data/grade_races/g3/2025/*.zip
            /data/result_universe_v2/combined/results_2025.jsonl.gz
            /data/a_class_12/2026_*/races.csv
            /data/a_class_12/2026_*/entries.csv
            /data/a_class_12/pilot_2026*/races.csv
            /data/a_class_12/pilot_2026*/entries.csv
            /data/a3_challenge/2026_*/races.csv
            /data/a3_challenge/2026_*/entries.csv
            /data/2026_h1/**/races.csv
            /data/2026_h1/**/entries.csv
            /data/2026_future_block1/**/races.csv
            /data/2026_future_block1/**/entries.csv
            /data/grade_races/g3/2026_h1/*.zip
            /data/result_universe_v2/combined/results_2026.jsonl.gz
            /research/independent_trifecta_2023/weak_rider_podium_zero_excluded.py
            /research/independent_trifecta_2023/v8_targeted_weak_podium_calibration.py
            /research/independent_trifecta_2023/v10_rank_role_slot_v6_calibration.py
            /data/a_class_12/2023_*/payouts.csv
            /data/a_class_12/2024_*/payouts.csv
            /data/a_class_12/2025_*/payouts.csv
            /data/a_class_12/2026_*/payouts.csv
            /data/a_class_12/pilot_2026*/payouts.csv
            /data/a3_challenge/2023_*/payouts.csv
            /data/a3_challenge/2024_*/payouts.csv
            /data/a3_challenge/2025_*/payouts.csv
            /data/a3_challenge/2026_*/payouts.csv
            /data/2023/**/payouts.csv
            /data/2024/**/payouts.csv
            /data/2025/**/payouts.csv
            /data/2026_h1/**/payouts.csv
            /data/2026_future_block1/**/payouts.csv
            /research/independent_trifecta_2023/v6_settled_payout_only_2023_2026.py
            /research/independent_trifecta_2023/v6_all_trifecta_75pct_audit.py
            /research/independent_trifecta_2023/v6_probability_donor_recipient_structural_audit.py
            /research/independent_trifecta_2023/v6_2023_full_year_donor_recipient.py
            /data/odds_only/odds_2023.jsonl.gz
            /research/v6_january_2023_formation_ev/prepare.py
            /research/v6_january_2023_formation_ev/settle.py
            /research/v6_c1_full_data/apply.py
            /data/audits/v6_c1_full_data_crossfit_2023_2026/v6_c1_fitted_model.json
            /research/v6_c1_april_2023/prepare.py
            /research/v6_c1_april_2023/settle.py
            /research/v6_c1_full_odds_gate/admission.py
            /research/v6_c1_full_odds_gate/secure_replay.py
            /research/deletion_ai/secure_seven_bet_bridge.py
            /odds_market/collect_all_odds.py
            /odds_market/vault_public_cert.pem
            /data/audits/odds_seven_bet_archive_count.json
            /data/audits/odds_only_export.json
            /data/audits/odds_seven_bet_runs/*.json
            /data/odds_ciphertext/2023/**
      - name: Install only existing archive verifier dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - name: Confirm source is untouched and key is configured
        run: |
          set -euo pipefail
          test "$PRIVATE_KEY_PRESENT" = "true" || { echo "::error::OWNER_KEY_NOT_CONFIGURED"; exit 1; }
          test "$(git hash-object research/independent_trifecta_2023/observe.py)" = "19701f16c80fcc95dc8c032ed47b80dfcfe93bc6"
          test "$(git hash-object research/independent_trifecta_2023/line_dependence_v2.py)" = "2bb7362490b7b7f7eb0e8390face22f248649216"
          python -m py_compile research/v6_c1_full_odds_gate/secure_replay.py research/deletion_ai/secure_seven_bet_bridge.py
          python research/v6_c1_full_odds_gate/admission.py
          test -s data/audits/odds_seven_bet_archive_count.json
          test -s data/audits/v6_c1_full_data_crossfit_2023_2026/v6_c1_fitted_model.json
          echo "FULL_VAULT_GATE_INPUTS_VERIFIED"
      - name: Reprocess authentic encrypted odds; compare C1 all-buy vs market-disagreement gate
        env:
          KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM: ${{ secrets.KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          python research/v6_c1_full_odds_gate/secure_replay.py
      - name: Verify complete source replay and no plaintext odds in report
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("data/audits/v6_c1_full_vault_purchase_gate_feb_apr_2023.json")
          d=json.loads(f.read_text(encoding="utf-8"))
          assert d["status"]=="FULL_SEVEN_BET_VAULT_FEB_APR_REPLAY_COMPLETE"
          assert d["source_audit"]["days_loaded"]==89
          assert d["source_audit"]["source_eligible_books"]>0
          assert d["source_audit"]["matched_full_V6_card"]>0
          assert d["original_V6_unmodified"] and d["original_V6_C1_unmodified"]
          assert d["original_formation_generator_unmodified"]
          assert d["no_result_join_before_selection_seal"]
          assert "odds" not in d.get("official_settlement",{}).keys()
          print("FULL_VAULT_VALIDATION_PASS")
          PY
      - name: Upload aggregate audit only, never any decrypted price grids or keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-c1-full-vault-2023-feb-apr-selective-gate-aggregates-only
          path: data/audits/v6_c1_full_vault_purchase_gate_feb_apr_2023.json
          retention-days: 90
          if-no-files-found: warn
