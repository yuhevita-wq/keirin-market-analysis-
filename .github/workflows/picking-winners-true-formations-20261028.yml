name: Picking Winners | TWO TRUE trifecta formations share-change study
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/picking-winners-true-formations-20261028.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: picking-winners-true-formations-20261028
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing environment
        run: python -m pip install -e '.[scrape]'
      - name: Static check and orientation regression
        run: |
          python -m py_compile research/picking_winners_true_formations_20261028/observe.py
          python -m unittest research.snowberg_observation_corrected_20261027.test_orientation
      - name: Run full historical archive and verified-result comparison
        env:
          KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM: ${{ secrets.KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM }}
        run: python research/picking_winners_true_formations_20261028/observe.py
      - name: Preserve results even if publishing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picking-winners-real-formations-${{ github.run_id }}
          path: research/picking_winners_true_formations_20261028/summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Save aggregate summary (no private odds)
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/picking_winners_true_formations_20261028/summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: save complete-formation pair overlap and payout evidence'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
