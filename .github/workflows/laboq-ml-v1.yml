name: Laboq podium model
on:
  push:
    branches: [research/laboq-ml-v1]
    paths: ['research/laboq-ml/**', '.github/workflows/laboq-ml-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # Draft Releases require repository push access for authenticated reads.
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/laboq-ml/requirements.txt
      - run: python research/laboq-ml/train.py --cache "${RUNNER_TEMP}/laboq-data" --output laboq-ml-output
      - name: Fit purchase decisions using archived pre-cutoff odds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/laboq-ml/train_purchase.py --cache "${RUNNER_TEMP}/laboq-data" --output laboq-ml-output
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: laboq-ml-v1
          path: laboq-ml-output/
          if-no-files-found: error
