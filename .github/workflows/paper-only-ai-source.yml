name: Paper-only AI | 2023 source connection
on:
  workflow_dispatch:
  push:
    paths:
      - 'paper_only_ai/github_bridge.py'
      - 'paper_only_ai/probe_schema.py'
      - '.github/workflows/paper-only-ai-source.yml'
permissions:
  contents: write
concurrency:
  group: paper-only-ai-source
  cancel-in-progress: false
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            paper_only_ai
            docs/paper-only-ai-2023
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate actual GitHub 2023 odds and results
        run: python paper_only_ai/github_bridge.py --year 2023 --out docs/paper-only-ai-2023/source_status.json
      - name: Probe entry and result schemas for 2023 training
        run: python paper_only_ai/probe_schema.py
      - name: Persist read-only source status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/paper-only-ai-2023/source_status.json docs/paper-only-ai-2023/schema_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Update independent AI source status for 2023"
            git push
          fi
