name: Simulate selected 136-146 2023
on:
  push:
    paths:
      - 'src/keirin_market_analysis/simulate_selected_136_146_2023.py'
      - '.github/workflows/simulate-selected-136-146-2023.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/keirin_market_analysis/simulate_selected_136_146_2023.py
      - name: Commit audit output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/selected_136_146_2023.json
          git diff --cached --quiet || git commit -m 'Add selected 136-146 2023 audit'
          git push
