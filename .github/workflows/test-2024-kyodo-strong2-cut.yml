name: Test 2024 Kyodo Strong2 Cut

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_kyodo_2024_strong2_cut.py'
      - '.github/workflows/test-2024-kyodo-strong2-cut.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/keirin_shogi_kyodo_2024_strong2_cut.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/kyodo_2024_strong2_cut.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "research: save 2024 Kyodo strong2 cut result"
            git pull --rebase origin main
            git push
          fi
