name: Odds-only market probability audit 2023-2026

on:
  push:
    branches: [main]
    paths:
      - 'research/odds_only_v1/**'
      - '.github/workflows/odds-only-market-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-only-market-audit
  cancel-in-progress: false

jobs:
  fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26' 'scipy>=1.13'
      - name: Train odds-only probabilities and compare market baselines
        run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python research/odds_only_v1/train.py
      - name: Validate zero race-card features and chronological evaluation
        run: |
          python - <<'PY'
          import json,math
          r=json.load(open('data/audits/odds_only_model_2023_2026.json',encoding='utf-8'))
          assert r['no_race_cards_or_lineup_or_score'] is True
          assert sum(r['results_by_year'].values())>12000
          for y in ('2023','2024','2025','2026'):
              assert r['results_by_year'][y]>1000
          for y in ('2024','2025','2026'):
              s=r['models'][y]
              for model in ('market','temp','cross','full'):
                  assert math.isfinite(s[model]['logloss'])
                  assert s[model]['n']==r['results_by_year'][y]
              assert s['trio_market']['n']==r['results_by_year'][y]
          print('ODDS ONLY VERIFICATION PASSED')
          PY
      - name: Commit research output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/odds_only_model_2023_2026.json data/models/odds_only_model_2025.json
          git commit -m 'research: save odds-only time-separated probability audit' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
