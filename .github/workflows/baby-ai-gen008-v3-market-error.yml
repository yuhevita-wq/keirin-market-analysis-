name: GEN-008 V3 | learn reproducible market pricing errors
on:
  push:
    branches: [main]
    paths:
      - 'research/ai_nursery/gen008_v3_market_error.py'
      - 'research/ai_nursery/run_gen008_v3_market_error.py'
      - 'research/ai_nursery/verify_gen008_v3_market_error.py'
      - 'research/ai_nursery/test_gen008_v3_market_error.py'
      - '.github/workflows/baby-ai-gen008-v3-market-error.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gen008-v3-market-error-frozen-first-dec2023
  cancel-in-progress: false
jobs:
  learn-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific optimizer and original market parsers
        run: python -m pip install -e '.[scrape]' 'numpy>=1.26' 'scipy>=1.12'
      - name: Test price-error math and the frozen parent checkpoints
        run: |
          python -m py_compile research/ai_nursery/gen008_v3_market_error.py research/ai_nursery/run_gen008_v3_market_error.py research/ai_nursery/verify_gen008_v3_market_error.py
          python research/ai_nursery/test_gen008_v3_market_error.py
          python research/ai_nursery/test_gen008_v3.py
          python research/ai_nursery/verify_parallel_month.py
          python research/ai_nursery/verify_gen008_frozen_exam.py
          python research/ai_nursery/verify_gen008_v3.py
      - name: Empirically fit market errors to historic outcomes, then score NEW untouched December
        run: |
          if [ -f research/ai_nursery/outputs/GEN-008-V3-MARKET-ERROR/frozen-dec-01-to-14-2023/summary.json ]; then
            echo 'Already sealed. Audit without retraining or replacing.'
          else
            python research/ai_nursery/run_gen008_v3_market_error.py
          fi
      - name: Recalculate every sealed ticket and settlement
        run: python research/ai_nursery/verify_gen008_v3_market_error.py
      - name: Save market-error coefficients and frozen forward assessment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/ai_nursery/outputs/GEN-008-V3-MARKET-ERROR/frozen-dec-01-to-14-2023/
          git add docs/ai-lab/gen008-v3-market-error-dec-2023.json
          if git diff --cached --quiet; then echo 'No new archive'; exit 0; fi
          git commit -m 'data: preserve trained market-error coefficients and blind December evidence'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Could not publish independent market-error exam' >&2
          exit 1
