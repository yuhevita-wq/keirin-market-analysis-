name: Score quality guard | unknown versus verified low rider

on:
  push:
    branches:
      - fix/separate-unknown-rider-score-from-low-ability
    paths:
      - 'src/keirin_market_analysis/score_quality.py'
      - 'src/keirin_market_analysis/audit_zero_scores.py'
      - 'tests/test_score_quality.py'
      - '.github/workflows/score-quality-unknown-vs-low.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-score-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Assert unknown never ranked as low and verified low remains unchanged
        run: pytest -q tests/test_score_quality.py tests/test_core.py
      - name: Audit raw historical zero-score states without rewriting raw input
        run: |
          python - <<'PY'
          from keirin_market_analysis.score_quality import classify_score, ScoreState, score_readiness
          assert classify_score('0.0').state is ScoreState.UNVERIFIED_ZERO
          assert classify_score('58.7').state is ScoreState.KNOWN
          q=score_readiness({'1': '0.0','2': '78.5','3': '54.0'}, ('1','2','3'))
          assert not q.can_predict
          assert q.unknown_riders=={'1':'unverified_zero'}
          assert q.known_score_ranks=={'2':1,'3':2}
          print('SCORE_UNKNOWN_AND_KNOWN_LOW_DISTINCT__NO_SILENT_IMPUTATION')
          PY
