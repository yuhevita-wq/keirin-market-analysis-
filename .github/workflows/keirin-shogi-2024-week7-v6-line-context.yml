name: Keirin Shogi 2024 Week 7 v6 Line Context
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-2024-week7-v6-line-context.yml'
      - 'scripts/keirin_shogi_weekly_v6_line_context_week7.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v6-week7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/keirin_shogi_weekly_v6_line_context_week7.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v6_line_context/2024-02-12_2024-02-18
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v6 line-context 2024 week 7"
            git push
          fi
