name: G3 Day3 Role Features

on:
  push:
    branches:
      - analysis/g3-day3-reality
    paths:
      - 'scripts/inspect_g3_day3_role_features.py'
      - '.github/workflows/g3-day3-role-features.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/g3-day3-reality
      - name: Inspect role features
        run: python scripts/inspect_g3_day3_role_features.py
      - name: Commit output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/g3_day3_reality/role_feature_schema.md
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'analysis: role feature schema output [skip ci]'
            git pull --rebase origin analysis/g3-day3-reality
            git push origin HEAD:analysis/g3-day3-reality
          fi
