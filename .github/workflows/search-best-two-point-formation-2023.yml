name: Search best two-point formation 2023

on:
  push:
    branches: [main]
    paths:
      - 'src/keirin_market_analysis/search_best_two_point_formation_2023.py'
      - '.github/workflows/search-best-two-point-formation-2023.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run search
        run: python src/keirin_market_analysis/search_best_two_point_formation_2023.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p='data/audits/best_two_point_formation_search_2023.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['accounting']['must_enter_evaluated'] == 358
          assert x['predefined_rule_count'] == 132
          assert x['fixed_context']['outcome_used_only_for_final_scoring'] is True
          print('PASS', x['ranked_by_realized_2023_roi'][:5])
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/best_two_point_formation_search_2023.json
          git commit -m 'analysis: save 2023 best two-point formation search' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
