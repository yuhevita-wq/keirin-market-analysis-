name: Test exclusion-first purchase of only surviving odds outcomes
on:
  push:
    branches: [main]
    paths:
      - 'research/nonlocal_receiver_v2/exclusion_purchase.py'
      - '.github/workflows/test-nonlocal-receiver-exclusions.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: receiver-exclusion-purchase
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy scikit-learn lightgbm
      - run: python -u research/nonlocal_receiver_v2/exclusion_purchase.py
      - name: Verify and publish
        run: |
          python - <<'PY'
          import json
          a=json.load(open('data/audits/nonlocal_receiver_v2_exclusion_purchase.json'))
          assert all(a['years'][y][k] for y in ('2025','2026') for k in ('trio','trifecta'))
          print('ALL_SELECTION_OPTIONS_VERIFIED')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audits/nonlocal_receiver_v2_exclusion_purchase.json
          git commit -m 'research: audit exclusion-first portfolio out-of-time results' || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
