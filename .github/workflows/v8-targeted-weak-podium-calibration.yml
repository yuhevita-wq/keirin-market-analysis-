name: V8 targeted known-weak podium calibration against all-ticket V6

on:
  push:
    branches:
      - research/v8-targeted-weak-podium-calibration-nozero
    paths:
      - 'research/independent_trifecta_2023/v8_targeted_weak_podium_calibration.py'
      - '.github/workflows/v8-targeted-weak-podium-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v8-targeted-known-weak-podium
  cancel-in-progress: false

jobs:
  full-trifecta-probability-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Sparse checkout raw race cards, lineup and top-three outcome archives without odds
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/independent_trifecta_2023/observe.py
            /research/independent_trifecta_2023/line_dependence_v2.py
            /research/independent_trifecta_2023/aab_guarded_v3.py
            /research/independent_trifecta_2023/v4_pattern_floor_2026.py
            /research/independent_trifecta_2023/v5_rider_score_role_size_interactions.py
            /research/independent_trifecta_2023/v6_opponent_competition_structure.py
            /research/independent_trifecta_2024/calibration_audit.py
            /research/independent_trifecta_2024/validate_2025.py
            /data/a_class_12/2023_*/races.csv
            /data/a_class_12/2023_*/entries.csv
            /data/a3_challenge/2023_*/races.csv
            /data/a3_challenge/2023_*/entries.csv
            /data/2023/**/races.csv
            /data/2023/**/entries.csv
            /data/grade_races/g1g2/*2023*.zip
            /data/grade_races/g3/2023/*.zip
            /data/result_universe_v2/combined/results_2023.jsonl.gz
            /data/a_class_12/2024_*/races.csv
            /data/a_class_12/2024_*/entries.csv
            /data/a3_challenge/2024_*/races.csv
            /data/a3_challenge/2024_*/entries.csv
            /data/2024/**/races.csv
            /data/2024/**/entries.csv
            /data/grade_races/g1g2/*2024*.zip
            /data/grade_races/g3/2024/*.zip
            /data/result_universe_v2/combined/results_2024.jsonl.gz
            /data/a_class_12/2025_*/races.csv
            /data/a_class_12/2025_*/entries.csv
            /data/a3_challenge/2025_*/races.csv
            /data/a3_challenge/2025_*/entries.csv
            /data/2025/**/races.csv
            /data/2025/**/entries.csv
            /data/grade_races/g1g2/*2025*.zip
            /data/grade_races/g3/2025/*.zip
            /data/result_universe_v2/combined/results_2025.jsonl.gz
            /data/a_class_12/2026_*/races.csv
            /data/a_class_12/2026_*/entries.csv
            /data/a_class_12/pilot_2026*/races.csv
            /data/a_class_12/pilot_2026*/entries.csv
            /data/a3_challenge/2026_*/races.csv
            /data/a3_challenge/2026_*/entries.csv
            /data/2026_h1/**/races.csv
            /data/2026_h1/**/entries.csv
            /data/2026_future_block1/**/races.csv
            /data/2026_future_block1/**/entries.csv
            /data/grade_races/g3/2026_h1/*.zip
            /data/result_universe_v2/combined/results_2026.jsonl.gz
            /research/independent_trifecta_2023/weak_rider_podium_zero_excluded.py
            /research/independent_trifecta_2023/v8_targeted_weak_podium_calibration.py

      - name: Verify historical parsers and study reproducibility
        run: |
          set -euo pipefail
          python -m py_compile research/independent_trifecta_2023/v8_targeted_weak_podium_calibration.py
          python -m py_compile research/independent_trifecta_2023/weak_rider_podium_zero_excluded.py
          test "$(git hash-object research/independent_trifecta_2023/observe.py)" = "19701f16c80fcc95dc8c032ed47b80dfcfe93bc6"
          test "$(git hash-object research/independent_trifecta_2023/line_dependence_v2.py)" = "2bb7362490b7b7f7eb0e8390face22f248649216"
          for year in 2023 2024 2025 2026; do
            test -s "data/result_universe_v2/combined/results_$year.jsonl.gz"
          done
          echo V8_ALL_HISTORIC_SCORE_AND_LABEL_FILES_VERIFIED

      - name: Fit 2023 nozero base, learn November targeted uplift, compare December and all 2024-2026 full trifecta
        run: |
          set -euo pipefail
          python research/independent_trifecta_2023/v8_targeted_weak_podium_calibration.py

      - name: Verify no unknown races and requirement of full-ticket proper scoring
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='data/audits/v8_targeted_low_rider_podium_calibration_zero_excluded_2023_2026.json'
          x=json.load(open(p))
          assert x['state']=='V8_TARGETED_LOWER_HALF_PODIUM_CALIBRATION_EVALUATED'
          assert x['no_zero_score_race_in_fit_or_evaluation']
          assert x['no_payout_market_or_odds_inputs']
          assert x['all_triple_probabilities_normalized']
          assert x['does_not_modify_existing_haruq_prediction']
          assert x['candidate_alpha_fixed_before_evaluation']==0.5
          for year,all_n in (('2024',25348),('2025',24635),('2026',11797)):
              a=x['periods'][year]
              assert a['source_races']==all_n
              assert a['score_eligible_races']+a['excluded_unknown_score_races']==all_n
              assert a['excluded_unknown_score_races']>0
              assert all(a['evaluations'][str(s)]['races']==a['score_eligible_races']
                         for s in (0.,.25,.5,1.))
              assert a['predeclared_half_tilt_candidate']['alpha']==0.5
          print('V8_TARGETED_CALIBRATION_BOTH_PROPER_SCORES_AND_NORMALIZATION_VERIFIED')
          PY

      - name: Upload complete 2023-2026 zero-free targeted correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-targeted-weak-podium-v6-zero-excluded-2023-2026
          path: data/audits/v8_targeted_low_rider_podium_calibration_zero_excluded_2023_2026.json
          retention-days: 90
          if-no-files-found: warn
