name: Audit 2026 Kyodo R3 Spill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_kyodo_2026_day1_r3_spill_audit.py'
      - '.github/workflows/audit-2026-kyodo-r3-spill.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: python scripts/keirin_shogi_kyodo_2026_day1_r3_spill_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/kyodo_2026_day1_r3_spill_audit.json
          git diff --cached --quiet || (git commit -m "research: save 2026 Kyodo R3 spill audit" && git pull --rebase origin main && git push)
