name: Keirin Shogi v28 Second Slot Allocation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-v28-second-slot-allocation.yml'
      - 'scripts/keirin_shogi_v28_second_slot_allocation.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q scikit-learn
      - run: python scripts/keirin_shogi_v28_second_slot_allocation.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v28_second_slot_allocation
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v28 second slot allocation"
            git push
          fi
