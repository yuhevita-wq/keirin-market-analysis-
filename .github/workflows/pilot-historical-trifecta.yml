name: Pilot historical 3rentan odds (one race, isolated)
on:
  push:
    branches:
      - pilot/trifecta-odds-20261109
    paths:
      - research/odds_trifecta_pilot/collect.py
      - research/odds_trifecta_pilot/batch.py
      - .github/workflows/pilot-historical-trifecta.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: single-historical-trifecta-pilot
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/odds_path_archive
            research/odds_trifecta_pilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test no contamination with 3renpuku
        run: python -m research.odds_trifecta_pilot.collect --self-test
      - name: Acquire at most one race of verified historic 3rentan odds
        run: |
          python -m research.odds_trifecta_pilot.collect \
            --day 2026-11-08 \
            --out "$RUNNER_TEMP/historical_3rentan_pilot_2026-11-08.json.gz"
      - name: Capture bounded ten-race audit of historical timepoints
        run: |
          python -m research.odds_trifecta_pilot.batch \
            --day 2026-11-08 \
            --out "$RUNNER_TEMP/historical_3rentan_10race_2026-11-08.json.gz"
      - name: Store verified data as draft release asset, not in public git
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/historical_3rentan_pilot_2026-11-08.json.gz"
          test -s "$file"
          batch="$RUNNER_TEMP/historical_3rentan_10race_2026-11-08.json.gz"
          test -s "$batch"
          tag="trifecta-odds-pilot-20261109"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_REF_NAME" \
              --title "Private 3連単 historical odds pilot 2026-11-09" \
              --notes "Research-only, at most 1 race. Source odds may be top-50; never claim full book."
          fi
          gh release upload "$tag" "$file" --clobber
          gh release upload "$tag" "$batch" --clobber
          echo "One verified 3連単 archive saved as an authenticated draft Release asset." >> "$GITHUB_STEP_SUMMARY"
