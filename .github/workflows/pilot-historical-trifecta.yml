name: Diagnose historical 3rentan top-50 pagination

on:
  push:
    branches:
      - pilot/trifecta-odds-20261109
    paths:
      - research/odds_trifecta_pilot/diagnose_cap.py
      - .github/workflows/pilot-historical-trifecta.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/odds_path_archive
            research/odds_trifecta_pilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify whether pages 1-3 return disjoint 3rentan selections
        run: python -m research.odds_trifecta_pilot.diagnose_cap
