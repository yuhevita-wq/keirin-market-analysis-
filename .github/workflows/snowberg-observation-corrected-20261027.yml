name: Corrected cross-pool observation | independently verify order labels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snowberg-observation-corrected-20261027.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snowberg-corrected-20261027
  cancel-in-progress: false
jobs:
  verify_and_observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[scrape]'
      - run: python -m py_compile research/snowberg_observation_corrected_20261027/observe.py
      - name: Regression checks for frame-market contamination
        run: python -m unittest research.snowberg_observation_corrected_20261027.test_orientation
      - name: Verify independent labels then reaggregate full archive
        env:
          KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM: ${{ secrets.KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM }}
        run: python research/snowberg_observation_corrected_20261027/observe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-observation-${{ github.run_id }}
          path: |
            research/snowberg_observation_corrected_20261027/summary.json
            research/snowberg_observation_corrected_20261027/compact.json
            research/snowberg_observation_corrected_20261027/README.md
          retention-days: 30
          if-no-files-found: warn
      - name: Publish only corrected aggregate reports
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/snowberg_observation_corrected_20261027/summary.json research/snowberg_observation_corrected_20261027/compact.json research/snowberg_observation_corrected_20261027/README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: publish independently checked ordered-market observations'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
