name: Keirin Shogi v22 Rolling Selector
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-v22-rolling-selector.yml'
      - 'scripts/keirin_shogi_v22_rolling_selector.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q scikit-learn
      - run: python scripts/keirin_shogi_v22_rolling_selector.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v22_rolling_selector
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v22 rolling selector"
            git push
          fi
