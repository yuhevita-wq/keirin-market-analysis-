name: Probe 2024Q1 market inputs

on:
  push:
    paths:
      - 'scripts/probe_2024q1_market_inputs.py'
      - '.github/workflows/probe-2024q1-market-inputs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe CSV inputs
        run: python scripts/probe_2024q1_market_inputs.py
      - name: Persist probe result
        run: |
          mkdir -p results/probes
          cp artifacts/2024q1_market_input_probe.json results/probes/2024q1_market_input_probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/probes/2024q1_market_input_probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Store 2024Q1 market input probe result'
          git push
