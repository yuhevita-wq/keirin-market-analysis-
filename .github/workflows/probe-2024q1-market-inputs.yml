name: Probe 2024Q1 market inputs

on:
  push:
    branches:
      - 'analysis/v6-1-hm01-2024q1'
    paths:
      - 'scripts/probe_2024q1_market_inputs.py'
      - 'src/keirin_market_analysis/v6_1_hm01_2024q1.py'
      - '.github/workflows/probe-2024q1-market-inputs.yml'
  pull_request:
    paths:
      - 'scripts/probe_2024q1_market_inputs.py'
      - 'src/keirin_market_analysis/v6_1_hm01_2024q1.py'
      - '.github/workflows/probe-2024q1-market-inputs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            data/2024/s_class_f1_all_parts/2024_q1
            scripts
            src/keirin_market_analysis
          sparse-checkout-cone-mode: true
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe CSV inputs
        run: python scripts/probe_2024q1_market_inputs.py
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: 2024q1-market-input-probe
          path: artifacts/2024q1_market_input_probe.json
