name: Collect 2024 G3 Q3 all races optimized

on:
  workflow_dispatch:
  push:
    branches:
      - g3-2024-q3-optimized
    paths:
      - ".github/workflows/collect-g3-all-2024-q3.yml"
      - "src/keirin_market_analysis/g3_all.py"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OUT_DIR: data/2024/g3_q3_all
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install -q --disable-pip-version-check -e '.[scrape]'

      - name: Collect 2024 G3 Q3 race cards
        run: |
          python -m keirin_market_analysis.g3_all \
            --start-date 2024-07-01 \
            --end-date 2024-09-30 \
            --out-dir "$OUT_DIR" \
            --sleep 0.05 \
            --allow-failures

      - name: Validate G3-only base scope
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          p=Path(os.environ['OUT_DIR'])
          races=list(csv.DictReader((p/'races.csv').open(encoding='utf-8-sig')))
          entries=list(csv.DictReader((p/'entries.csv').open(encoding='utf-8-sig')))
          s=json.loads((p/'summary.json').read_text(encoding='utf-8'))
          assert races, s
          assert len({r['race_id'] for r in races}) == len(races), 'duplicate race_id'
          assert all(r['meeting_grade']=='G3' for r in races)
          assert all(e['meeting_grade']=='G3' for e in entries)
          assert s['configured_meetings']==11, s
          assert s['parsed_g3_races']==len(races)
          assert s['entry_rows']==len(entries)
          assert s.get('candidate_g3_races', len(races)) == len(races)
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Enrich KDreams predicted line formation
        run: |
          python -m keirin_market_analysis.line_formation_2025 \
            --data-dir "$OUT_DIR" \
            --sleep 0.05

      - name: Extract results and payouts
        run: |
          python -m keirin_market_analysis.results_payouts_2025 \
            --data-dir "$OUT_DIR" \
            --sleep 0.05

      - name: Collect historical final trifecta and trio odds
        run: |
          python -m keirin_market_analysis.historical_final_odds \
            --data-dir "$OUT_DIR" \
            --workers 6 \
            --sleep 0.03

      - name: Build Q3 report
        if: always()
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          p=Path(os.environ['OUT_DIR'])
          p.mkdir(parents=True, exist_ok=True)
          files=[]
          for f in sorted(p.iterdir()):
              if f.is_file() and f.name != 'q3_report.json':
                  files.append({'name':f.name,'bytes':f.stat().st_size,'mib':round(f.stat().st_size/1024/1024,3)})
          total=sum(x['bytes'] for x in files)
          def rows(name):
              f=p/name
              if not f.exists(): return None
              with f.open(encoding='utf-8-sig',newline='') as h:
                  return sum(1 for _ in csv.reader(h))-1
          def js(name):
              f=p/name
              if not f.exists(): return None
              return json.loads(f.read_text(encoding='utf-8'))
          report={
              'target':'2024 G3 all races Q3 (2024-07-01 to 2024-09-30)',
              'files':files,
              'total_uncompressed_bytes':total,
              'total_uncompressed_mib':round(total/1024/1024,3),
              'row_counts':{
                  'races':rows('races.csv'),
                  'entries':rows('entries.csv'),
                  'results':rows('results.csv'),
                  'payouts':rows('payouts.csv'),
                  'trifecta_final_odds':rows('trifecta_final_odds.csv'),
                  'trio_final_odds':rows('trio_final_odds.csv'),
              },
              'base_summary':js('summary.json'),
              'line_summary':js('line_summary.json'),
              'result_summary':js('result_summary.json'),
              'odds_summary':js('odds_summary.json'),
          }
          (p/'q3_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload 2024 G3 Q3 dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-all-2024-q3
          retention-days: 7
          if-no-files-found: error
          path: ${{ env.OUT_DIR }}
