name: Backfill all authorized seven-bet odds to encrypted archive

# Disabled at the user's request on 2026-10-17.
# No scheduled or manual collection trigger and no backfill/self-dispatch jobs.
# A push changing this file runs cancellation only, never collection.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/odds-seven-bet-encrypted-backfill.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-previous-collectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Force-cancel all outstanding previous collectors
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            ids="$(gh run list --workflow odds-seven-bet-encrypted-backfill.yml --limit 300 --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId')"
            count=0
            while IFS= read -r id; do
              if [ -n "$id" ] && [ "$id" != "$CURRENT_RUN_ID" ]; then
                echo "Force-cancel legacy collector: $id"
                gh api --method POST "repos/$GH_REPO/actions/runs/$id/force-cancel" --silent || gh run cancel "$id" || true
                count=$((count + 1))
              fi
            done <<< "$ids"
            echo "Attempt $attempt: requested cancellation of $count legacy runs"
            sleep 7
          done
          echo "All automated seven-bet odds collection triggers remain disabled."
