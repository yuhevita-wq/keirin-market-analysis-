name: Backfill all authorized seven-bet odds to encrypted archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/odds-seven-bet-encrypted-backfill.yml'
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      days:
        type: number
        default: 2

permissions:
  contents: write

concurrency:
  group: authorized-seven-bet-encrypted-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      WINDOW_DAYS: ${{ github.event.inputs.days || '2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch freshest cursor, failure ledger and proof of a real full market
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install requests beautifulsoup4
      - name: Gate collection on offline tests
        run: python -m odds_market.test_collect_all_odds
      - name: Select next dates; refuse to start until live seven-bet validation exists
        id: window
        run: |
          python -m odds_market.backfill_cursor pick \
            --days "$WINDOW_DAYS" \
            --github-output "$GITHUB_OUTPUT"
      - name: Acquire full historical seven-bet market odds, excluding girls
        id: acquire
        if: steps.window.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -u odds_market/collect_all_odds.py \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --out "$RUNNER_TEMP/private_odds" \
            --pause 2 \
            --accept-terms 2>&1 | tee "$RUNNER_TEMP/collector.log"
      - name: Encrypt every verified complete race before Git storage
        if: always() && steps.window.outputs.ready == 'true'
        run: |
          python -m odds_market.seal_verified_odds \
            --source "$RUNNER_TEMP/private_odds" \
            --target data/odds_ciphertext \
            --run-id "$GITHUB_RUN_ID" \
            --audit "data/audits/odds_seven_bet_runs/$GITHUB_RUN_ID.json"
      - name: Update date cursor and failure/retry ledger without source odds
        if: always() && steps.window.outputs.ready == 'true'
        run: |
          python -m odds_market.backfill_cursor finish \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --mode "${{ steps.window.outputs.mode }}" \
            --audit "data/audits/odds_seven_bet_runs/$GITHUB_RUN_ID.json" \
            --log "$RUNNER_TEMP/collector.log" \
            --run-id "$GITHUB_RUN_ID"
      - name: Commit encrypted odds, manifest and cursor (never plaintext)
        if: always() && steps.window.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/odds_seven_bet_runs data/audits/odds_seven_bet_cursor.json
          if [ -d data/odds_ciphertext ]; then git add data/odds_ciphertext; fi
          if git diff --cached --quiet; then
            echo "No newly verified odds or cursor updates"
            exit 0
          fi
          git commit -m "data(odds): archive encrypted seven-bet run $GITHUB_RUN_ID"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "Failed to publish encrypted seven-bet batch" >&2
          exit 1
      - name: Require complete source acquisition; partial batches stay encrypted and retryable
        if: always() && steps.window.outputs.ready == 'true'
        env:
          ACQUIRE_OUTCOME: ${{ steps.acquire.outcome }}
        run: |
          test "$ACQUIRE_OUTCOME" = success
