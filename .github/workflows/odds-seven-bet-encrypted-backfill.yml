name: Backfill all authorized seven-bet odds to encrypted archive

# Collection disabled at the user's request on 2026-10-17.
# No schedule, workflow_dispatch, data acquisition or self-dispatch remains.
# This one-time push hook cancels collectors started by the previous workflow.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/odds-seven-bet-encrypted-backfill.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-previous-collectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Cancel queued and running seven-bet backfill runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            ids="$(gh run list --workflow odds-seven-bet-encrypted-backfill.yml --limit 300 --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId')"
            while IFS= read -r id; do
              if [ -n "$id" ] && [ "$id" != "$CURRENT_RUN_ID" ]; then
                echo "Cancel prior collection run: $id"
                gh run cancel "$id" || true
              fi
            done <<< "$ids"
            sleep 5
          done
          echo "Scheduled collection and self-dispatch have been disabled."
