name: Extract compact threshold overfit audit
on:
  push:
    branches: [main]
    paths:
      - "src/keirin_market_analysis/extract_threshold_overfit_compact.py"
      - ".github/workflows/extract-threshold-overfit-compact.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m keirin_market_analysis.extract_threshold_overfit_compact
      - name: Commit compact audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/threshold_overfit_2025_compact.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: save compact 2025 overfit report"
          git pull --rebase origin main
          git push origin HEAD:main
