name: Train Ninecar V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_ninecar_v2.py'
      - '.github/workflows/train-ninecar-v2.yml'

permissions:
  contents: write

concurrency:
  group: train-ninecar-v2
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Train and evaluate joint504 model
        run: python scripts/keirin_shogi_ninecar_v2.py --train-evaluate
      - name: Commit reproducible model and evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/ninecar_v2/
          if git diff --cached --quiet; then
            echo "No ninecar v2 changes."
          else
            git commit -m "model: train ninecar v2 joint504"
            git pull --rebase origin main
            git push
          fi
