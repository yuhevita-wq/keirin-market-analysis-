name: Study Ninecar Wide Conversion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_ninecar_wide_study.py'
      - '.github/workflows/study-ninecar-wide.yml'

permissions:
  contents: write

concurrency:
  group: study-ninecar-wide
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run wide conversion study
        run: python scripts/keirin_shogi_ninecar_wide_study.py
      - name: Commit study results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/ninecar_wide_study/summary.json results/keirin_shogi/ninecar_wide_study/summary.md
          if git diff --cached --quiet; then
            echo "No study changes."
          else
            git commit -m "research: save nine-car wide conversion study"
            git pull --rebase origin main
            git push
          fi
