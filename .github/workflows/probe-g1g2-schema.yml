name: Probe G1G2 archive schema

on:
  push:
    paths:
      - '.github/workflows/probe-g1g2-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            data/grade_races/g1g2
          sparse-checkout-cone-mode: true
      - name: Print raw entry JSON keys only
        shell: python
        run: |
          import csv, io, json, zipfile
          from pathlib import Path

          zp = Path('data/grade_races/g1g2/g1-g2-2021-non-girls-corrected.zip')
          with zipfile.ZipFile(zp) as z:
              text = z.read('entries.csv').decode('utf-8-sig')
              row = next(csv.DictReader(io.StringIO(text)))
              raw = row.get('raw_row_json') or ''
              try:
                  obj = json.loads(raw)
              except Exception as e:
                  print('RAW_NOT_JSON', type(e).__name__)
                  raise SystemExit

              def describe(value, path='root', depth=0):
                  if depth > 4:
                      return
                  if isinstance(value, dict):
                      print('DICT_KEYS', path, json.dumps(list(value.keys()), ensure_ascii=False))
                      for k, v in value.items():
                          describe(v, f'{path}.{k}', depth + 1)
                  elif isinstance(value, list):
                      print('LIST', path, 'len=', len(value), 'item_type=', type(value[0]).__name__ if value else 'empty')
                      if value:
                          describe(value[0], f'{path}[0]', depth + 1)
              describe(obj)
