name: Search sparse robust early conditions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/search-early-sparse-high-return.yml'
      - 'src/keirin_market_analysis/search_early_sparse_high_return.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Search 2024+2025 only
        run: python -m keirin_market_analysis.search_early_sparse_high_return
      - name: Validate OOS isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          code=Path('src/keirin_market_analysis/search_early_sparse_high_return.py').read_text(encoding='utf-8')
          assert 'data/2023' not in code
          p=Path('data/audits/early_sparse_high_return_search.json')
          s=json.loads(p.read_text(encoding='utf-8'))
          assert s['search_guardrails']['max_conditions']==2
          assert s['search_guardrails']['min_races_each_year']==10
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - name: Commit search result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audits/early_sparse_high_return_search.json
          git diff --cached --quiet || git commit -m 'analysis: record sparse robust early-condition search'
          git push
