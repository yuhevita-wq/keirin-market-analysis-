name: Analyze rider support rank1 miss 2023
on:
  push:
    paths:
      - 'src/keirin_market_analysis/analyze_rider_support_rank1_miss_2023.py'
      - '.github/workflows/analyze-rider-support-rank1-miss-2023.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python src/keirin_market_analysis/analyze_rider_support_rank1_miss_2023.py
      - name: Commit audit output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/rider_support_rank1_miss_2023.json
          git diff --cached --quiet || git commit -m 'Add 2023 rider support rank1 miss audit'
          git push
