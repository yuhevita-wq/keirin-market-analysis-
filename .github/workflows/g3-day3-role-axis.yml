name: G3 Day3 Role Axis

on:
  push:
    branches:
      - analysis/g3-day3-reality
    paths:
      - 'scripts/analyze_g3_day3_role_axis.py'
      - '.github/workflows/g3-day3-role-axis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/g3-day3-reality
      - name: Analyze role axis
        run: python scripts/analyze_g3_day3_role_axis.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/g3_day3_reality/role_axis.md results/g3_day3_reality/role_axis.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'analysis: role-axis output [skip ci]'
            git pull --rebase origin analysis/g3-day3-reality
            git push origin HEAD:analysis/g3-day3-reality
          fi
