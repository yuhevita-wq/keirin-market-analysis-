name: Baby AI GEN-004 excess-10000 reward training
on:
  push:
    branches: [main]
    paths:
      - 'research/ai_nursery/train_week4.py'
      - 'research/ai_nursery/test_week4.py'
      - '.github/workflows/baby-ai-gen004.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: baby-ai-gen004
  cancel-in-progress: false
jobs:
  reward-week:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Teach reward above ten thousand and train next seven days
        run: |
          python -m pip install 'numpy>=1.26'
          if [ -f research/ai_nursery/outputs/GEN-004/summary.json ]; then
            echo "GEN-004 exists; verify without overwriting"
          else
            OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python research/ai_nursery/train_week4.py
          fi
      - name: Check reward conditions, ancestry and sealed records
        run: |
          OPENBLAS_NUM_THREADS=1 python research/ai_nursery/test_week4.py
      - name: Freeze the new generation in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ai_nursery/outputs/GEN-004/ docs/ai-lab/nursery-gen004-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: save GEN-004 reward learning and independent reward balance"
          git pull --rebase origin main
          git push origin HEAD:main
