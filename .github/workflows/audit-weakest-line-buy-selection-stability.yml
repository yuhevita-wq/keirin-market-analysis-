name: Audit weakest-line buy selection stability

on:
  push:
    paths:
      - 'src/keirin_market_analysis/audit_weakest_line_buy_selection_stability.py'
      - '.github/workflows/audit-weakest-line-buy-selection-stability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m keirin_market_analysis.audit_weakest_line_buy_selection_stability
      - name: Validate scope
        run: |
          python - <<'PY'
          import json
          p='data/audits/weakest_line_buy_selection_stability_2023_2025.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['years_read']==[2023,2024,2025]
          assert d['evaluation_year_2026_used'] is False
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/weakest_line_buy_selection_stability_2023_2025.json
          git commit -m 'Add weakest-line buy selection stability audit' || exit 0
          git push
