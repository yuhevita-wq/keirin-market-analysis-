name: Independent trifecta V6 | opponents and line-rivalry interactions, all shapes

on:
  push:
    branches:
      - research/trifecta-v6-opponent-competition-structure
    paths:
      - 'research/independent_trifecta_2023/v5_rider_score_role_size_interactions.py'
      - '.github/workflows/independent-trifecta-v6-opponent-competition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-trifecta-v6-opponent-competition
  cancel-in-progress: false

jobs:
  audit-all-conditional-stages:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Sparse checkout immutable 2023-trained model and 2024-2026 result-only datasets
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/independent_trifecta_2023/observe.py
            /research/independent_trifecta_2023/line_dependence_v2.py
            /research/independent_trifecta_2023/aab_guarded_v3.py
            /research/independent_trifecta_2023/v4_pattern_floor_2026.py
            /research/independent_trifecta_2023/v5_rider_score_role_size_interactions.py
            /research/independent_trifecta_2023/v6_opponent_competition_structure.py
            /research/independent_trifecta_2024/calibration_audit.py
            /research/independent_trifecta_2024/validate_2025.py
            /data/a_class_12/2023_*/races.csv
            /data/a_class_12/2023_*/entries.csv
            /data/a3_challenge/2023_*/races.csv
            /data/a3_challenge/2023_*/entries.csv
            /data/2023/**/races.csv
            /data/2023/**/entries.csv
            /data/grade_races/g1g2/*2023*.zip
            /data/grade_races/g3/2023/*.zip
            /data/result_universe_v2/combined/results_2023.jsonl.gz
            /data/a_class_12/2024_*/races.csv
            /data/a_class_12/2024_*/entries.csv
            /data/a3_challenge/2024_*/races.csv
            /data/a3_challenge/2024_*/entries.csv
            /data/2024/**/races.csv
            /data/2024/**/entries.csv
            /data/grade_races/g1g2/*2024*.zip
            /data/grade_races/g3/2024/*.zip
            /data/result_universe_v2/combined/results_2024.jsonl.gz
            /data/a_class_12/2025_*/races.csv
            /data/a_class_12/2025_*/entries.csv
            /data/a3_challenge/2025_*/races.csv
            /data/a3_challenge/2025_*/entries.csv
            /data/2025/**/races.csv
            /data/2025/**/entries.csv
            /data/grade_races/g1g2/*2025*.zip
            /data/grade_races/g3/2025/*.zip
            /data/result_universe_v2/combined/results_2025.jsonl.gz
            /data/a_class_12/2026_*/races.csv
            /data/a_class_12/2026_*/entries.csv
            /data/a_class_12/pilot_2026*/races.csv
            /data/a_class_12/pilot_2026*/entries.csv
            /data/a3_challenge/2026_*/races.csv
            /data/a3_challenge/2026_*/entries.csv
            /data/2026_h1/**/races.csv
            /data/2026_h1/**/entries.csv
            /data/2026_future_block1/**/races.csv
            /data/2026_future_block1/**/entries.csv
            /data/grade_races/g3/2026_h1/*.zip
            /data/result_universe_v2/combined/results_2026.jsonl.gz

      - name: Verify immutable V2 and V3, no market odds, no earlier model changes
        run: |
          set -euo pipefail
          python -m py_compile research/independent_trifecta_2023/v6_opponent_competition_structure.py research/independent_trifecta_2023/v5_rider_score_role_size_interactions.py research/independent_trifecta_2023/aab_guarded_v3.py research/independent_trifecta_2023/v4_pattern_floor_2026.py
          test "$(git hash-object research/independent_trifecta_2023/observe.py)" = "19701f16c80fcc95dc8c032ed47b80dfcfe93bc6"
          test "$(git hash-object research/independent_trifecta_2023/line_dependence_v2.py)" = "2bb7362490b7b7f7eb0e8390face22f248649216"
          test "$(git hash-object research/independent_trifecta_2023/aab_guarded_v3.py)" = "04bb3a7956a5a5d43a987194df557838b6ac81e5"
          for year in 2023 2024 2025 2026; do
            test -s "data/result_universe_v2/combined/results_$year.jsonl.gz"
            test ! -e "data/odds_only/odds_$year.jsonl.gz"
          done
          echo FROZEN_MODELS_NO_MARKET_ALL_YEARS_VERIFIED

      - name: Fit 2023-only opponent-relations heads and replay V3 V5 V6 full ordered triples
        run: |
          set -euo pipefail
          python research/independent_trifecta_2023/v6_opponent_competition_structure.py

      - name: Assert all shapes, frozen baseline scores, full V6 probability and no market leakage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='data/audits/trifecta_v6_opponent_competition_structure_2023_2026.json'
          x=json.load(open(p))
          assert x['state']=='COMPETITION_RELATION_TRIFECTA_RESEARCH_V6_COMPLETE'
          assert x['all_line_shaped_sampled'] is True
          assert x['favored_line_shape'] is None
          assert x['baseline_V3_V5_frozen'] is True
          assert x['no_odds_payout_market'] is True
          assert x['production_promoted'] is False
          assert x['valid_blind_confirmatory_period_remaining'].startswith('NONE')
          assert x['selected_scale_2023_only'] in (0,0.25,0.5,1.0)
          for year,n,old3,old5 in (('2024',25348,4.31982650,4.31060107),
                                    ('2025',24635,4.36613863,4.35552835),
                                    ('2026',11797,4.40591444,4.39199251)):
              test=x['test_years'][year]['all_models']
              assert all(test[m]['races']==n for m in ('V3','V5','V6'))
              assert abs(test['V3']['NLL']-old3)<2e-5
              assert abs(test['V5']['NLL']-old5)<2e-5
              for m in ('V3','V5','V6'):
                  assert sum(t['actual'] for t in test[m]['line_pattern'].values())==n
                  assert abs(sum(t['predicted'] for t in test[m]['line_pattern'].values())-n)<0.01
                  assert test[m]['shapes_tested']>10
                  assert sum(test[m]['shape_race_counts'].values())==n
                  assert sum(t['actual'] for t in test[m]['V3_fixed_ticket_cohort'].values())==n
          print('V6_RIVALRY_FULL_TICKET_AND_FROZEN_BASELINES_VERIFIED')
          PY

      - name: Upload V6 competition relation study with fixed V3 rare-ticket cohort and line-matchup residuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-trifecta-v6-opponent-relations-all-shapes-2024-2026
          path: data/audits/trifecta_v6_opponent_competition_structure_2023_2026.json
          retention-days: 90
          if-no-files-found: warn
