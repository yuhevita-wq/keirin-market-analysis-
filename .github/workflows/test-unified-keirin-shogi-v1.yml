name: test-unified-keirin-shogi-v1

on:
  push:
    branches:
      - unified-v1-20260919
  pull_request:
    paths:
      - "scripts/keirin_shogi_unified_v1.py"
      - "scripts/keirin_shogi_v37_auto_place.py"
      - "docs/keirin-shogi/index.html"
      - ".github/workflows/test-unified-keirin-shogi-v1.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile unified Python entry points
        run: |
          python -m py_compile scripts/keirin_shogi_unified_v1.py
          python -m py_compile scripts/keirin_shogi_v37_auto_place.py
      - name: Verify unified UI policy is wired
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("docs/keirin-shogi/index.html").read_text(encoding="utf-8")
          assert "unified_joint_order_v1" in html
          assert "7車 統合v1" in html
          print("unified UI wiring OK")
          PY
