name: Keirin Shogi v25 Top2 Pair Second
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-v25-top2-pair-second.yml'
      - 'scripts/keirin_shogi_v25_top2_pair_second.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q scikit-learn
      - run: python scripts/keirin_shogi_v25_top2_pair_second.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v25_top2_pair_second
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v25 top2 pair second"
            git push
          fi
