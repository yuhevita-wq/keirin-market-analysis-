name: Resume 2024 G3 Q3 from cancelled race to final odds

on:
  workflow_dispatch:
  push:
    branches:
      - g3-2024-q3-optimized
    paths:
      - ".github/workflows/resume-g3-all-2024-q3-odds.yml"

permissions:
  contents: read
  actions: read

jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OUT_DIR: data/2024/g3_q3_all
      SOURCE_RUN_ID: "33488542495"
      CANCELLED_RACE_ID: "8620240725030008"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install -q --disable-pip-version-check -e '.[scrape]'

      - name: Reuse prior Q3 artifact
        uses: actions/download-artifact@v4
        with:
          name: g3-all-2024-q3
          path: ${{ env.OUT_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Resolve only the cancelled Beppu 8R
        run: |
          python - <<'PY'
          import csv, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from keirin_market_analysis.results_payouts_2025 import result_url

          p = Path(os.environ['OUT_DIR'])
          race_id = os.environ['CANCELLED_RACE_ID']
          races = list(csv.DictReader((p/'races.csv').open(encoding='utf-8-sig', newline='')))
          race = next((r for r in races if r['race_id'] == race_id), None)
          assert race is not None, f'cancelled race not found: {race_id}'
          assert race['race_date'] == '2024-07-27', race
          assert race['track'] == '別府競輪', race
          assert race['race_no'] == '8', race

          failures = list(csv.DictReader((p/'result_failures.csv').open(encoding='utf-8-sig', newline='')))
          target_failures = [r for r in failures if r['race_id'] == race_id]
          assert len(target_failures) == 1, target_failures
          assert 'refund table not found' in target_failures[0]['error'], target_failures[0]

          remaining = [r for r in failures if r['race_id'] != race_id]
          fields = list(failures[0].keys()) if failures else [
              'race_id','race_date','track','race_no','race_type','result_source_url','result_source','captured_at_utc','error'
          ]
          with (p/'result_failures.csv').open('w', encoding='utf-8-sig', newline='') as h:
              w = csv.DictWriter(h, fieldnames=fields)
              w.writeheader(); w.writerows(remaining)

          url = result_url(race['source_url'])
          cancelled_fields = ['race_id','race_date','track','race_no','race_type','status','source_url','captured_at_utc','note']
          cancelled = [{
              'race_id': race_id,
              'race_date': race['race_date'],
              'track': race['track'],
              'race_no': race['race_no'],
              'race_type': race['race_type'],
              'status': 'cancelled',
              'source_url': url,
              'captured_at_utc': datetime.now(timezone.utc).isoformat(),
              'note': '2024-07-27 別府G3 3日目8Rは悪天候で中止。KDreams公式インフォメーション等で確認済み。車券は全返還。結果・払戻行は生成しない。',
          }]
          with (p/'cancelled_races.csv').open('w', encoding='utf-8-sig', newline='') as h:
              w = csv.DictWriter(h, fieldnames=cancelled_fields)
              w.writeheader(); w.writerows(cancelled)

          s = json.loads((p/'result_summary.json').read_text(encoding='utf-8'))
          s['cancelled_races'] = 1
          s['cancelled_race_ids'] = [race_id]
          s['parse_failures'] = len(remaining)
          s['accounted_races'] = int(s.get('complete_result_races', 0)) + 1
          s['semantics'] = s.get('semantics','') + ' Cancelled races are recorded separately in cancelled_races.csv and have no synthetic result or payout rows.'
          (p/'result_summary.json').write_text(json.dumps(s, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY

      - name: Collect historical final trifecta and trio odds only
        run: |
          python -m keirin_market_analysis.historical_final_odds \
            --data-dir "$OUT_DIR" \
            --workers 6 \
            --sleep 0.03

      - name: Validate resumed Q3 dataset
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          p = Path(os.environ['OUT_DIR'])
          races = list(csv.DictReader((p/'races.csv').open(encoding='utf-8-sig')))
          cancelled = list(csv.DictReader((p/'cancelled_races.csv').open(encoding='utf-8-sig')))
          failures = list(csv.DictReader((p/'result_failures.csv').open(encoding='utf-8-sig')))
          rs = json.loads((p/'result_summary.json').read_text(encoding='utf-8'))
          osum = json.loads((p/'odds_summary.json').read_text(encoding='utf-8'))
          assert len(races) == 501
          assert len(cancelled) == 1 and cancelled[0]['race_id'] == os.environ['CANCELLED_RACE_ID']
          assert not failures, failures
          assert rs['complete_result_races'] == 500
          assert rs['cancelled_races'] == 1
          assert rs['accounted_races'] == 501
          assert osum['race_count_attempted'] == 501
          print(json.dumps({'result_summary':rs,'odds_summary':osum}, ensure_ascii=False, indent=2))
          PY

      - name: Upload completed 2024 G3 Q3 dataset
        uses: actions/upload-artifact@v4
        with:
          name: g3-all-2024-q3-complete
          retention-days: 7
          if-no-files-found: error
          path: ${{ env.OUT_DIR }}
