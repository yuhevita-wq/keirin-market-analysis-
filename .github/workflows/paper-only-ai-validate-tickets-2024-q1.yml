name: Paper-only AI | 2024 Q1 full ticket probability verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'paper_only_ai/validate_tickets_2024_q1.py'
      - '.github/workflows/paper-only-ai-validate-tickets-2024-q1.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: paper-only-ai-validate-tickets-2024-q1
  cancel-in-progress: false
jobs:
  validate-frozen-ticket-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            paper_only_ai
            docs/paper-only-ai-2023
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install paper-only study dependencies
        run: |
          python -m pip install 'numpy<3' 'pandas<3' 'scipy<2' 'scikit-learn<2' 'optuna<5' 'joblib<2'
      - name: Fetch immutable three-stage 2023 model bundle
        uses: actions/download-artifact@v4
        with:
          name: paper-only-2023-conditional-finish-order-models
          path: frozen_conditional_bundle
          run-id: 39362270286
          github-token: ${{ github.token }}
      - name: Check models and validation script
        run: |
          python -m py_compile paper_only_ai/validate_tickets_2024_q1.py
          find frozen_conditional_bundle -maxdepth 5 -type f -name '*.joblib' -print
          test -s frozen_conditional_bundle/frozen_2023/calibration.joblib
          test -s frozen_conditional_bundle/docs/paper-only-ai-2023/conditional_2023/stage2.joblib
          test -s frozen_conditional_bundle/docs/paper-only-ai-2023/conditional_2023/stage3.joblib
      - name: Out-of-time validation; NO 2024 model training or refitting
        env:
          FROZEN_TICKET_MODEL_DIR: frozen_conditional_bundle
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          PYTHONUNBUFFERED: '1'
        run: python paper_only_ai/validate_tickets_2024_q1.py
      - name: Upload out-of-time ticket-level probability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-only-2024-q1-ticket-probabilities-validation
          path: docs/paper-only-ai-2023/validation_tickets_2024_q1/
          if-no-files-found: warn
          retention-days: 60
      - name: Publish 2024 Q1 ticket-probability audit and metrics
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/paper-only-ai-2023/validation_tickets_2024_q1/report.json docs/paper-only-ai-2023/validation_tickets_2024_q1/progress.json
          if ! git diff --cached --quiet; then
            git commit -m "Record 2024 Q1 frozen 2023 AI ticket-level probability verification"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
