name: Benter Fundamental V1 empirical test

on:
  push:
    branches:
      - research/benter-fundamental-v1-20261017
    paths:
      - .github/workflows/benter-fundamental-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out only required entrant/result files
        uses: actions/checkout@v4
        with:
          ref: research/benter-fundamental-v1-20261017
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/benter_fundamental_v1/train_v1.py
            /data/2023/s_class_f1_all_parts/*/entries.csv
            /data/2023/s_class_f1_all_parts/*/results.csv
            /data/2024/s_class_f1_all_parts/*/entries.csv
            /data/2024/s_class_f1_all_parts/*/results.csv
            /data/2025/s_class_f1_all_parts/*/entries.csv
            /data/2025/s_class_f1_all_parts/*/results.csv
            /data/2026_h1/s_class_f1_all/entries.csv
            /data/2026_h1/s_class_f1_all/results.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Train, test, and report
        run: python research/benter_fundamental_v1/train_v1.py
      - name: Save reproducible numerical output to research branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f --sparse research/benter_fundamental_v1/output
          git commit -m "Record V1 empirical fit and 2026 holdout evaluation [skip ci]"
          git push origin HEAD:research/benter-fundamental-v1-20261017
      - name: Upload evidence files
        uses: actions/upload-artifact@v4
        with:
          name: benter-v1-empirical-report
          path: research/benter_fundamental_v1/output/
