name: Keirin Shogi v18 Ensemble Walkforward
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-v18-ensemble-walkforward.yml'
      - 'scripts/keirin_shogi_v18_ensemble_walkforward.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q scikit-learn
      - run: python scripts/keirin_shogi_v18_ensemble_walkforward.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v18_ensemble_walkforward
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v18 ensemble walkforward"
            git push
          fi
