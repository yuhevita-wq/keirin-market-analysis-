name: Discover new formation set geometry from results and odds, 2023 Jan-Apr
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-formation-geometry-2023-janapr.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: discover-formation-geometry-2023-janapr
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[scrape]'
      - name: Verify precommitted universal geometry and 2023 window before reading odds
        run: |
          python -m py_compile research/formation_discovery_from_outcomes_20261028/discover_2023_four_months.py
          python -m unittest research.snowberg_observation_corrected_20261027.test_orientation
          python - <<'PY'
          import research.formation_discovery_from_outcomes_20261028.discover_2023_four_months as x
          assert x.TRAIN==("2023-01-01","2023-02-28")
          assert x.TEST==("2023-03-01","2023-04-30")
          assert len(x.RECTS)==343
          assert x.LIMIT_LINES==3
          assert len({r[3] for r in x.RECTS})==343
          assert x.normalize_stage("Ａ級準決勝")=="準決勝"
          assert x.class_name("data/2023/s_class_f1_all_parts/2023_q2/races.csv")=="S級"
          print("FULL_GEOMETRIC_UNIVERSE_FROZEN: 343 Cartesian slots, no prechosen 34 templates")
          PY
      - name: Data-driven set discovery and temporal validation
        env:
          KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM: ${{ secrets.KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM }}
        run: python research/formation_discovery_from_outcomes_20261028/discover_2023_four_months.py
      - name: Upload all generated report outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovered-formation-geometry-${{ github.run_id }}
          path: |
            research/formation_discovery_from_outcomes_20261028/summary.json
            research/formation_discovery_from_outcomes_20261028/compact.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve observations with caveats
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/formation_discovery_from_outcomes_20261028/summary.json research/formation_discovery_from_outcomes_20261028/compact.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: outcome-first discovered union geometries and historical OOS results'
          for try in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
