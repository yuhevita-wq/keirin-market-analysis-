name: Publish static analysis sites
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publish-analysis-sites.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: analysis-sites-static
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs
          filter: blob:none
          fetch-depth: 1
      - name: Validate cross selection
        run: node --test docs/cross-lab/*.test.mjs
      - name: Preserve static module files
        run: touch docs/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy public sites
        id: deployment
        uses: actions/deploy-pages@v4
