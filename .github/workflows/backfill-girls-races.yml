name: Discover and backfill girls races, results and complete odds

on:
  push:
    branches: [main]
    paths:
      - research/odds_universe_v1/girls_discover.py
      - .github/workflows/backfill-girls-races.yml
  schedule:
    - cron: '38 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [pilot, auto, dated]
        default: auto
      start_date:
        type: string
        default: '2025-01-01'
      end_date:
        type: string
        default: '2025-01-03'

permissions:
  contents: write

concurrency:
  group: girls-race-backfill-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      MODE: ${{ github.event.inputs.mode }}
      START_DATE: ${{ github.event.inputs.start_date }}
      END_DATE: ${{ github.event.inputs.end_date }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[scrape]'
      - name: Discover actual girls races and fetch full final-market odds
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" || "$MODE" == "pilot" ]]; then
            python research/odds_universe_v1/girls_discover.py --start 2025-01-01 --end 2025-01-03 --sleep 0.35
          elif [[ "$EVENT" == "schedule" || "$MODE" == "auto" ]]; then
            python research/odds_universe_v1/girls_discover.py --auto --sleep 0.45
          elif [[ "$MODE" == "dated" ]]; then
            python research/odds_universe_v1/girls_discover.py --start "$START_DATE" --end "$END_DATE" --sleep 0.45
          else
            exit 2
          fi
      - name: Validate and publish historical discovery evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for f in Path('data/girls_universe').rglob('summary.json'):
              j=json.loads(f.read_text(encoding='utf-8'))
              assert j['full_odds_races']<=j['verified_girls_races'],f
              assert j['fully_labelled_races']<=j['verified_girls_races'],f
              assert j['both_market_and_result_races']<=j['full_odds_races'],f
              print(str(f),j['verified_girls_races'],j['both_market_and_result_races'])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/girls_universe
          git commit -m 'data: append discovered girls race cards, results and audited final odds' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
