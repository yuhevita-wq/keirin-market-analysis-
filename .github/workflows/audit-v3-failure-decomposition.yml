name: Audit V3 failure decomposition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-v3-failure-decomposition.yml"
      - "src/keirin_market_analysis/audit_v3_failure_decomposition.py"
      - "data/audits/v3_research_protocol.json"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Run V3 phase1 failure decomposition
        run: python -m keirin_market_analysis.audit_v3_failure_decomposition
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/audits/v3_failure_decomposition.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['status']=='V3_PHASE1_FAILURE_DECOMPOSITION_COMPLETE'
          assert set(d['strategies'])=={'early','middle','late'}
          for s in d['strategies'].values():
              assert set(s['periods'])=={'2023','2024','2025','2026_H1'}
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189821+github-actions[bot]@users.noreply.github.com"
          git add data/audits/v3_failure_decomposition.json
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "analysis: record V3 failure decomposition"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
