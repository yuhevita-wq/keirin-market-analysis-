name: Keirin Shogi v17 GBDT Walkforward
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-v17-gbdt-walkforward.yml'
      - 'scripts/keirin_shogi_v17_gbdt_walkforward.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q scikit-learn
      - run: python scripts/keirin_shogi_v17_gbdt_walkforward.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v17_gbdt_walkforward
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v17 gbdt walkforward"
            git push
          fi
