name: GEN008 V3-ME | fixed market-error model January 2024 observation
on:
  push:
    branches: [main]
    paths:
      - 'research/ai_nursery/recover_gen008_v3me_jan2024_odds.py'
      - 'research/ai_nursery/run_gen008_v3me_jan2024.py'
      - 'research/ai_nursery/verify_gen008_v3me_jan2024.py'
      - '.github/workflows/baby-ai-gen008-v3me-forward-2024-jan.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gen008-v3me-january2024-unchanged-observation
  cancel-in-progress: false
jobs:
  recovery-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified odds scraper and math dependencies
        run: python -m pip install -e '.[scrape]' 'numpy>=1.26' 'scipy>=1.12'
      - name: Check frozen market-error model and untouched December score
        run: |
          python -m py_compile research/ai_nursery/recover_gen008_v3me_jan2024_odds.py research/ai_nursery/run_gen008_v3me_jan2024.py research/ai_nursery/verify_gen008_v3me_jan2024.py
          python research/ai_nursery/test_gen008_v3_market_error.py
          python research/ai_nursery/verify_gen008_v3_market_error.py
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('research/ai_nursery/outputs/GEN-008-V3-MARKET-ERROR/dec-2023-expanded-authentic-prices')
          fit=json.loads((base/'market_error_fit.json').read_text())
          report=json.loads((base/'summary.json').read_text())
          assert report['status']=='COMPLETE' and report['test_races']==954
          assert fit['algorithm_sha256']==report['fitted_model_sha256']
          assert len(fit['coefficients'])==5 and fit['train_races']==761
          print('FROZEN_V3ME_SOURCE_VERIFIED',fit['algorithm_sha256'])
          PY
      - name: Recover authentic January 2024 historical final market books
        run: |
          if [ -f data/holdout_odds_recovery/gen008-2024-01-01-to-14/coverage.json ]; then
            echo 'Use archived exact-ID books rather than overwriting'
          else
            python research/ai_nursery/recover_gen008_v3me_jan2024_odds.py
          fi
      - name: Run unchanged OLD NEW V3 and V3-ME for further unseen observation
        run: |
          if [ -f research/ai_nursery/outputs/GEN-008-V3-MARKET-ERROR/frozen-jan-01-to-14-2024/summary.json ]; then
            echo 'Previously sealed examination present. Read-only verification follows.'
          else
            python research/ai_nursery/run_gen008_v3me_jan2024.py
          fi
      - name: Verify all exact race-ID predictions and post-label settlements
        run: python research/ai_nursery/verify_gen008_v3me_jan2024.py
      - name: Publish immutable original markets and independent 2024 forward evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/holdout_odds_recovery/gen008-2024-01-01-to-14/
          git add research/ai_nursery/outputs/GEN-008-V3-MARKET-ERROR/frozen-jan-01-to-14-2024/
          git add docs/ai-lab/gen008-v3-market-error-jan-2024.json
          if git diff --cached --quiet; then echo 'No new archive'; exit 0; fi
          git commit -m 'data: log January 2024 untouched V3 market-mispricing forward observation'
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Unable to publish archive' >&2
          exit 1
