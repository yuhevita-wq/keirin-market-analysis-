name: Chapter 1 | Learn what to delete from a full mark sheet
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chapter1-full-sheet-delete-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run-deletion-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            paper_only_ai
            docs/paper-only-ai-2023/chapter1_accuracy_ai
            docs/paper-only-ai-2023/autonomous_chapter1
            docs/paper-only-ai-2023/chapter1_full_sheet_deletion
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install 'numpy<3' 'pandas<3' 'scipy<2' 'scikit-learn<2' 'joblib<2' 'optuna<5'
      - name: Verify full-sheet deletion invariants and no outcome leakage
        run: |
          python -m py_compile paper_only_ai/chapter1_full_sheet_deletion.py
          python paper_only_ai/test_chapter1_full_sheet_deletion.py
      - name: Run cost-aware deletion learning on completed 2023 races
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python paper_only_ai/chapter1_full_sheet_deletion.py
      - name: Keep model and report even when experiment fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-deletion-experiment-${{ github.run_id }}
          path: docs/paper-only-ai-2023/chapter1_full_sheet_deletion/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve trained deletion scorers as immutable model release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=chapter1-full-sheet-deletion-2023-v1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Immutable trained weights already saved; refusing overwrite"
            exit 0
          fi
          gh release create "$TAG" \
            docs/paper-only-ai-2023/chapter1_full_sheet_deletion/delete_*.joblib \
            docs/paper-only-ai-2023/chapter1_full_sheet_deletion/deletion_2023.json \
            --target "$GITHUB_SHA" \
            --title "Experimental full-sheet deletion learning (2023)" \
            --notes "All tickets marked first, trained deletion loss on completed outcomes. Check results before claiming any positive profitability. Frozen September train, October selection, Nov-Dec scored after."
      - name: Permanently commit exact historical experiment outcome
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/paper-only-ai-2023/chapter1_full_sheet_deletion/deletion_2023.json
          if ! git diff --cached --quiet; then
            git commit -m "Preserve frozen full-sheet deletion research outcome"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
