name: Keirin Shogi v26 Top2 Pair Blind First
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-v26-top2-pair-blind-first.yml'
      - 'scripts/keirin_shogi_v26_top2_pair_blind_first.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v26:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q scikit-learn
      - run: python scripts/keirin_shogi_v26_top2_pair_blind_first.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v26_top2_pair_blind_first
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v26 top2 pair blind first"
            git push
          fi
