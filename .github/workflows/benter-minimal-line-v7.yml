name: Benter-first minimal line V7
on:
  push:
    branches:
      - research/benter-minimal-line-v7-20261018
    paths:
      - .github/workflows/benter-minimal-line-v7.yml
      - research/benter_minimal_line_v7/minimal_line.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/benter-minimal-line-v7-20261018
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/benter_minimal_line_v7/minimal_line.py
            /research/benter_line_conditional_v5/model_line_conditional.py
            /research/benter_line_conditional_v5/parameters_pretest.json
            /research/benter_third_survivor_v6/model_survivor_v6.py
            /research/benter_third_survivor_v6/frozen_3rd_survivor_parameters.json
            /research/benter_ordered_23/parameters_frozen.json
            /research/benter_score_challenge_v3/frozen_2026h2_probabilities.csv
            /research/benter_calibration_v4/sep_predictions_frozen.csv
            /research/benter_calibration_v4/sep_holdout/races.csv
            /research/benter_calibration_v4/sep_holdout/results.csv
            /research/benter_structural_discovery_v2/output/test_full_plus_line_win_probability.csv
            /data/2026_future_block1/s_class_f1_20260701_20260830/races.csv
            /data/2026_future_block1/s_class_f1_20260701_20260830/results.csv
            /data/2026_h1/s_class_f1_all/races.csv
            /data/2026_h1/s_class_f1_all/results.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Select minimum line features Jul train to Aug validation
        run: python -u research/benter_minimal_line_v7/minimal_line.py fit
      - name: Freeze all Benter-first line coefficients before target outcome scoring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f --sparse research/benter_minimal_line_v7/parameters_frozen.json
          git commit -m "Freeze sparse Benter line correction before comparison periods [skip ci]"
          git push origin HEAD:research/benter-minimal-line-v7-20261018
      - name: Compare minimal Benter, V5 and V6 on September
        run: python -u research/benter_minimal_line_v7/minimal_line.py sept
      - name: Replicate without refit on 2026 H1
        run: python -u research/benter_minimal_line_v7/minimal_line.py h1
      - name: Save comparisons
        run: |
          git add -f --sparse research/benter_minimal_line_v7/september_comparison.json research/benter_minimal_line_v7/h1_comparison.json
          git commit -m "Record sparse Benter vs complex line models same outcomes [skip ci]"
          git push origin HEAD:research/benter-minimal-line-v7-20261018
