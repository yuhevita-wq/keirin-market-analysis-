name: Retry incomplete men-only historical odds (maximum three attempts)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-incomplete-odds.yml'
  schedule:
    - cron: '27 17 * * 0,3'
  workflow_dispatch:
    inputs:
      limit:
        type: number
        default: 120

permissions:
  contents: write

concurrency:
  group: historical-odds-failed-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EVENT: ${{ github.event_name }}
      LIMIT: ${{ github.event.inputs.limit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read latest full-market failure/success ledger
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[scrape]'
      - name: Retry only incomplete odds for 2021-2025 and 2026 H1
        run: |
          if [[ "$EVENT" == "push" ]]; then
            python research/odds_universe_v1/backfill.py --retry-failed --limit 80 --workers 2 --sleep 0.7 --tag retry-existing-odds
          else
            python research/odds_universe_v1/backfill.py --retry-failed --limit "${LIMIT:-120}" --workers 2 --sleep 0.7 --tag retry-existing-odds
          fi
      - name: Commit attempted and verified market files, including failures
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/odds_universe_v1/data
          if git diff --cached --quiet; then
            echo 'No missing-market retry was eligible'
            exit 0
          fi
          git commit -m 'data: retry historically incomplete odds with explicit failure records'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Saved retry batch at attempt $attempt"
              exit 0
            fi
            sleep 3
          done
          echo 'Failed to commit immutable retry batch' >&2
          exit 1
