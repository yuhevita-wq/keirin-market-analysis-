name: Collect A1-A2 pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect-a-class-12-pilot.yml"
      - "src/keirin_market_analysis/a_class_12.py"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[scrape]'

      - name: Collect A1/A2 race cards
        run: |
          python -m keirin_market_analysis.a_class_12 \
            --start-date "2026-09-25" \
            --end-date "2026-10-02" \
            --out-dir "data/a_class_12/pilot_20260925_20261002" \
            --sleep 0.20

      - name: Validate collection
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          p = Path('data/a_class_12/pilot_20260925_20261002')
          s = json.loads((p / 'summary.json').read_text(encoding='utf-8'))
          races = list(csv.DictReader((p / 'races.csv').open(encoding='utf-8-sig')))
          entries = list(csv.DictReader((p / 'entries.csv').open(encoding='utf-8-sig')))
          failures = list(csv.DictReader((p / 'failures.csv').open(encoding='utf-8-sig')))

          assert s['parsed_a1_a2_races'] == len(races) and len(races) > 0, s
          assert s['entry_rows'] == len(entries) and len(entries) > 0, s
          assert s['failures'] == 0 and not failures, failures[:20]
          assert all(e['class'].replace('Ａ','A').replace('１','1').replace('２','2').strip() in {'A1','A2'} for e in entries)
          assert all(r['race_type'].startswith('Ａ級') for r in races)
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: a-class-12-pilot-20260925-20261002
          retention-days: 7
          path: data/a_class_12/pilot_20260925_20261002

      - name: Commit pilot dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/a_class_12/pilot_20260925_20261002
          if git diff --cached --quiet; then
            echo "No dataset changes to commit"
          else
            git commit -m "data: add A1/A2 pilot dataset"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
