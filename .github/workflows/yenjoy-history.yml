name: YenJoy History Year

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to collect'
        required: true
        default: '2024'
        type: choice
        options:
          - '2024'
          - '2025'
          - '2026'
      delay:
        description: 'Minimum delay between requests (seconds)'
        required: true
        default: '1.2'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  collect-year:
    name: collect-${{ inputs.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Resolve months
        id: range
        shell: bash
        run: |
          if [ "${{ inputs.year }}" = "2026" ]; then
            echo "end_month=09" >> "$GITHUB_OUTPUT"
          else
            echo "end_month=12" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect year month by month
        shell: bash
        run: |
          set +e
          mkdir -p results/year_${{ inputs.year }}
          : > results/year_${{ inputs.year }}/failed_months.txt

          for month in $(seq -w 1 "${{ steps.range.outputs.end_month }}"); do
            ym="${{ inputs.year }}${month}"
            out="results/year_${{ inputs.year }}/$ym"
            cache=".cache/yenjoy/$ym"

            echo "========== $ym =========="
            python scripts/collect_yenjoy_bulk.py \
              --start-month "$ym" \
              --end-month "$ym" \
              --delay "${{ inputs.delay }}" \
              --cache-dir "$cache" \
              --output "$out"
            collect_status=$?

            if [ "$collect_status" -ne 0 ]; then
              echo "$ym collect_failed" | tee -a results/year_${{ inputs.year }}/failed_months.txt
              continue
            fi

            python scripts/normalize_yenjoy_dataset.py \
              --input-dir "$out" \
              --start-month "$ym" \
              --end-month "$ym"
            normalize_status=$?

            if [ "$normalize_status" -ne 0 ]; then
              echo "$ym normalize_failed" | tee -a results/year_${{ inputs.year }}/failed_months.txt
            fi
          done

          exit 0

      - name: Merge completed months into yearly dataset
        shell: bash
        run: |
          python scripts/merge_yenjoy_history.py \
            --input-root "results/year_${{ inputs.year }}" \
            --output "results/year_${{ inputs.year }}/merged"

      - name: Upload yearly dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yenjoy-year-${{ inputs.year }}
          path: results/year_${{ inputs.year }}/
          if-no-files-found: error
          retention-days: 30

      - name: Report failed months
        if: always()
        shell: bash
        run: |
          file="results/year_${{ inputs.year }}/failed_months.txt"
          if [ -s "$file" ]; then
            echo "Some months failed:"
            cat "$file"
            exit 1
          fi
          echo "All requested months completed successfully."
