name: Search support-rank two-point formations 2023

on:
  push:
    branches: [main]
    paths:
      - 'src/keirin_market_analysis/search_support_rank_two_point_formations_2023.py'
      - '.github/workflows/search-support-rank-two-point-formations-2023.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run search
        run: python src/keirin_market_analysis/search_support_rank_two_point_formations_2023.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p='data/audits/support_rank_two_point_formations_2023.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['accounting']['must_enter_evaluated'] == 358
          assert x['method']['candidate_count'] == 210
          assert len(x['ranked_by_realized_2023_roi']) == 210
          print('PASS', x['ranked_by_realized_2023_roi'][:10])
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/support_rank_two_point_formations_2023.json
          git commit -m 'analysis: save support-rank two-point search 2023' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
