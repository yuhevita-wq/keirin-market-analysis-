name: Collect 2026 G3 Q2 all non-girls races optimized

on:
  workflow_dispatch:
  push:
    branches:
      - g3-2026-h1
    paths:
      - ".github/workflows/collect-g3-all-2026-q2.yml"
      - "src/keirin_market_analysis/g3_all_2026.py"

permissions:
  contents: read

concurrency:
  group: g3-2026-q2
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OUT_DIR: data/2026/g3_q2_all
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install -q --disable-pip-version-check -e '.[scrape]'

      - name: Collect 2026 G3 Q2 non-girls race cards
        run: |
          python -m keirin_market_analysis.g3_all_2026 \
            --start-date 2026-04-01 \
            --end-date 2026-06-30 \
            --out-dir "$OUT_DIR" \
            --sleep 0.05 \
            --allow-failures

      - name: Validate G3-only non-girls base scope
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          p=Path(os.environ['OUT_DIR'])
          races=list(csv.DictReader((p/'races.csv').open(encoding='utf-8-sig')))
          entries=list(csv.DictReader((p/'entries.csv').open(encoding='utf-8-sig')))
          s=json.loads((p/'summary.json').read_text(encoding='utf-8'))
          assert races, s
          assert len({r['race_id'] for r in races}) == len(races), 'duplicate race_id'
          assert all(r['meeting_grade']=='G3' for r in races)
          assert all(e['meeting_grade']=='G3' for e in entries)
          assert all(not r['race_type'].startswith('ガールズ') for r in races), 'girls race leaked into races.csv'
          assert s['configured_meetings']==12, s
          assert s['parsed_g3_races']==len(races)
          assert s['entry_rows']==len(entries)
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Enrich KDreams predicted line formation
        run: |
          python -m keirin_market_analysis.line_formation_2025 \
            --data-dir "$OUT_DIR" \
            --sleep 0.05 \
            --allow-failures

      - name: Extract results and payouts
        run: |
          python -m keirin_market_analysis.results_payouts_2025 \
            --data-dir "$OUT_DIR" \
            --sleep 0.05 \
            --allow-failures

      - name: Collect historical final trifecta and trio odds
        run: |
          python -m keirin_market_analysis.historical_final_odds \
            --data-dir "$OUT_DIR" \
            --workers 6 \
            --sleep 0.03

      - name: Build Q2 report
        if: always()
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          p=Path(os.environ['OUT_DIR']); p.mkdir(parents=True, exist_ok=True)
          def rows(name):
              f=p/name
              if not f.exists(): return None
              with f.open(encoding='utf-8-sig',newline='') as h: return sum(1 for _ in csv.reader(h))-1
          def js(name):
              f=p/name
              return json.loads(f.read_text(encoding='utf-8')) if f.exists() else None
          report={'target':'2026 G3 non-girls races Q2 (2026-04-01 to 2026-06-30)','failure_policy':'Girls races are excluded. Individual fetch/parse/line/result/odds failures are recorded and skipped; the quarter continues.','row_counts':{'races':rows('races.csv'),'entries':rows('entries.csv'),'excluded_girls':rows('excluded_girls.csv'),'results':rows('results.csv'),'payouts':rows('payouts.csv'),'trifecta_final_odds':rows('trifecta_final_odds.csv'),'trio_final_odds':rows('trio_final_odds.csv')},'base_summary':js('summary.json'),'line_summary':js('line_summary.json'),'result_summary':js('result_summary.json'),'odds_summary':js('odds_summary.json')}
          (p/'q2_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload 2026 G3 Q2 dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-all-2026-q2-non-girls
          retention-days: 7
          if-no-files-found: error
          path: ${{ env.OUT_DIR }}
