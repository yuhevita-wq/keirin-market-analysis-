name: Simulate 2024 market scenario portfolio v1 frozen from 2023

on:
  push:
    branches: [main]
    paths:
      - 'src/keirin_market_analysis/simulate_market_scenario_portfolio_2024_v1.py'
      - '.github/workflows/simulate-market-scenario-portfolio-2024-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run 2024 frozen v1 hobby simulation
        run: python -m keirin_market_analysis.simulate_market_scenario_portfolio_2024_v1
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/audits/market_scenario_portfolio_2024_v1.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['year']==2024
          assert x['years_read']==[2024]
          assert x['strategy_source_year']==2023
          assert x['trigami_violations']==0
          print(json.dumps(x, ensure_ascii=False, indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/market_scenario_portfolio_2024_v1.json data/audits/market_scenario_portfolio_2024_v1_decisions.csv
          git diff --cached --quiet || git commit -m 'Add frozen 2024 v1 market scenario simulation result'
          git push
