name: Market residual and interaction hypothesis
on:
  push:
    branches: [research/market-residual-interactions-20261128]
    paths:
      - 'research/market_residual_20261128/**'
      - '.github/workflows/market-residual-interactions-20261128.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        bet: [exacta, trio]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/market_residual_20261128/
            /data/rider_condition_2025_202610_full/*.csv.gz
            /data/odds_only/odds_2025.jsonl.gz
            /data/odds_only/odds_2026.jsonl.gz
            /data/2025/**/payouts.csv
            /data/2026_h1/**/payouts.csv
            /data/a_class_12/2025*/payouts.csv
            /data/a_class_12/2026_0*/payouts.csv
            /data/a3_challenge/2025*/payouts.csv
            /data/a3_challenge/2026_0*/payouts.csv
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.bet }}-joint-probability-learning
          run-id: 46005962698
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline_artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.2 scikit-learn==1.6.1 lightgbm==4.6.0
      - name: Validate scripts
        run: |
          python -m py_compile research/market_residual_20261128/*.py
          python research/market_residual_20261128/train.py --self-test
          python research/market_residual_20261128/solve.py --self-test
          python research/market_residual_20261128/audit.py --self-test
      - name: Learn market residual probability corrections
        run: python -u research/market_residual_20261128/train.py ${{ matrix.bet }}
      - name: Apply fixed mathematical optimizer
        run: python -u research/market_residual_20261128/solve.py ${{ matrix.bet }}
      - name: Statistical comparison against frozen baseline
        run: python -u research/market_residual_20261128/audit.py ${{ matrix.bet }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.bet }}-market-residual-research
          path: |
            market_residual_output/
            market_residual_math_output/
            market_residual_statistics_output/
          if-no-files-found: warn
