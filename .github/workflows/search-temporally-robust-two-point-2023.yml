name: Search temporally robust two-point 2023

on:
  push:
    paths:
      - 'src/keirin_market_analysis/search_temporally_robust_two_point_2023.py'
      - '.github/workflows/search-temporally-robust-two-point-2023.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run search
        run: python src/keirin_market_analysis/search_temporally_robust_two_point_2023.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p='data/audits/temporally_robust_two_point_2023.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['scope'].startswith('2023 only')
          assert x['candidate_count'] == 210
          assert x['accounting']['must_enter_evaluated'] > 300
          assert x['accounting']['date_parse_failures'] == 0
          print('PASS', x['ranked_by_worst_quarter_roi'][0])
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/temporally_robust_two_point_2023.json
          git commit -m 'analysis: save 2023 temporal robustness search' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
