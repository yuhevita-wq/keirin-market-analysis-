name: Audit 2024 vs 2025 OOS population

on:
  push:
    branches: [main]
    paths:
      - "src/keirin_market_analysis/audit_oos_population.py"
      - ".github/workflows/audit-oos-population.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m keirin_market_analysis.audit_oos_population
      - uses: actions/upload-artifact@v4
        with:
          name: oos-population-audit
          path: data/audits/oos_population_2024_vs_2025.json
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/oos_population_2024_vs_2025.json
          git commit -m "audit: save 2024 vs 2025 population stages" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
