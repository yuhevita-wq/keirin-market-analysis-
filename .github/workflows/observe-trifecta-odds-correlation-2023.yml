name: Observe 2023 independent 3連単 probabilities versus raw final market odds

on:
  push:
    branches:
      - research/trifecta-market-association-2023
    paths:
      - research/independent_trifecta_2023/market_association.py
      - .github/workflows/observe-trifecta-odds-correlation-2023.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: independent-trifecta-2023-price-association
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout only frozen model inputs, 2023 outcomes and published real final odds
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/independent_trifecta_2023/observe.py
            /research/independent_trifecta_2023/market_association.py
            /data/audits/independent_trifecta_recalibration_2024.json
            /data/audits/odds_only_export.json
            /data/odds_only/odds_2023.jsonl.gz
            /data/a_class_12/2023_*/races.csv
            /data/a_class_12/2023_*/entries.csv
            /data/a3_challenge/2023_*/races.csv
            /data/a3_challenge/2023_*/entries.csv
            /data/2023/**/races.csv
            /data/2023/**/entries.csv
            /data/grade_races/g1g2/*2023*.zip
            /data/grade_races/g3/2023/*.zip
            /data/result_universe_v2/combined/results_2023.jsonl.gz
      - name: Install stats for ranking comparison
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Ensure immutable independent model and odds files
        run: |
          python -m py_compile research/independent_trifecta_2023/market_association.py
          test "$(git hash-object research/independent_trifecta_2023/observe.py)" = "19701f16c80fcc95dc8c032ed47b80dfcfe93bc6"
          test -s data/odds_only/odds_2023.jsonl.gz
          test -s data/result_universe_v2/combined/results_2023.jsonl.gz
          test ! -e data/odds_only/odds_2024.jsonl.gz
          test ! -e data/odds_only/odds_2025.jsonl.gz
          echo "ORIGINAL_AI_FROZEN_AND_2023_ODDS_ISOLATED"
      - name: Run exact race-ID and full trifecta-ticket price/probability association
        run: python research/independent_trifecta_2023/market_association.py
        env:
          PYTHONUNBUFFERED: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - name: Verify no takeout assumptions and no betting or ROI scoring
        run: |
          python - <<'PY'
          import json,gzip,math
          report=json.load(open('data/audits/trifecta_market_association_2023.json'))
          assert report['market_odds_in_ai_training'] is False
          assert report['takeout_fraction_estimated_or_applied'] is False
          assert report['profit_roi_analyzed'] is False
          assert report['counts']['2023_price_complete_races']==6301
          assert report['counts']['matched_all_trifecta_and_model_races']>2000
          count=0
          with gzip.open('data/audits/trifecta_market_association_full_matches_2023.jsonl.gz','rt') as f:
              for line in f:
                  v=json.loads(line)
                  count+=1
                  p=sum(v['all_trifecta'][k]['p_ai_corrected'] for k in v['all_trifecta'])
                  assert abs(p-1)<1e-7,(v['race_id'],p)
          assert count==report['counts']['matched_all_trifecta_and_model_races']
          print("VALID_MARKET_ASSOCIATION_RACES",count)
          PY
      - name: Preserve all exact matched odds and probability pairs for reproducibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-2023-trifecta-market-association
          retention-days: 90
          if-no-files-found: warn
          path: |
            data/audits/trifecta_market_association_2023.json
            data/audits/trifecta_market_association_sample_2023.json
            data/audits/trifecta_market_association_full_matches_2023.jsonl.gz
      - name: Commit descriptive audit and example only (not all raw books)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse data/audits/trifecta_market_association_2023.json data/audits/trifecta_market_association_sample_2023.json
          git diff --cached --quiet || git commit -m "Publish actual 2023 full 3連単 probability versus final market odds correlation"
          git push origin HEAD:research/trifecta-market-association-2023
