name: Ablate remote market bias from outcome model
on:
  push:
    branches: [main]
    paths:
      - 'research/nonlocal_receiver_v2/ablate.py'
      - '.github/workflows/ablate-nonlocal-receiver-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odds-remote-ablation-v2
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy scikit-learn lightgbm
      - run: python -u research/nonlocal_receiver_v2/ablate.py
      - name: Verify and save outcomes
        run: |
          python - <<'PY'
          import json
          a=json.load(open('data/audits/nonlocal_receiver_v2_ablation.json'))
          assert a['compared']['LOCAL']['forward']['2025']['logloss']>0
          assert a['compared']['WITH_REMOTE']['forward']['2026']['logloss']>0
          print('PASS',a['years'],flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audits/nonlocal_receiver_v2_ablation.json
          git commit -m 'research: ablate remote odds information against actual results' || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
