name: Analyze insurance ticket additions 236-146 2023-2025
on:
  push:
    paths:
      - 'src/keirin_market_analysis/analyze_insurance_ticket_236_146_2023_2025.py'
      - '.github/workflows/analyze-insurance-ticket-236-146-2023-2025.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/keirin_market_analysis/analyze_insurance_ticket_236_146_2023_2025.py
      - name: Commit audit output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/insurance_ticket_236_146_2023_2025.json
          git diff --cached --quiet || git commit -m 'Add insurance ticket scan for 236+146'
          git push
