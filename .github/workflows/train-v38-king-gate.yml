name: Train v38 King Gate
on:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_v38_king_gate.py'
      - '.github/workflows/train-v38-king-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/keirin_shogi_v38_king_gate.py
      - name: Commit gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v38_king_seat_2024w1
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "results: add v38 king participation gate"
            git pull --rebase origin main
            git push
          fi
