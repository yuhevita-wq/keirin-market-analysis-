name: Analyze market support 1-3-4 quinella BOX 2023
on:
  push:
    paths:
      - 'src/keirin_market_analysis/analyze_market_support_134_quinella_box_2023.py'
      - '.github/workflows/analyze-market-support-134-quinella-box-2023.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/keirin_market_analysis/analyze_market_support_134_quinella_box_2023.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/market_support_134_quinella_box_2023.json
          git diff --cached --quiet || git commit -m 'Add 2023 market support 1-3-4 quinella BOX result'
          git push
