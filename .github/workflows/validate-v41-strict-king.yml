name: Validate v41 Strict KING
on:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_v41_strict_gate_sparse_seats.py'
      - '.github/workflows/validate-v41-strict-king.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: validate-v41-strict-king
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/keirin_shogi_v41_strict_gate_sparse_seats.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v41_strict_gate_sparse_seats
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "results: save v41 strict KING validation"
            git pull --rebase origin main
            git push
          fi
