name: V7 F1 S-class first-place research on frozen 14k
on:
  push:
    branches:
      - research/benter-minimal-line-v7-20261018
    paths:
      - .github/workflows/benter-v7-first-win-research.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research_first_win:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/benter-minimal-line-v7-20261018
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/benter_walkforward_v7/research_first_win.py
            /research/benter_walkforward_v7/freeze_prior_win.py
            /research/benter_walkforward_v7/frozen_sample_audit.json
            /research/benter_walkforward_v7/frozen/*
            /data/2023/s_class_f1_all_parts/*/entries.csv
            /data/2023/s_class_f1_all_parts/*/races.csv
            /data/2023/s_class_f1_all_parts/*/results.csv
            /data/2024/s_class_f1_all_parts/*/entries.csv
            /data/2024/s_class_f1_all_parts/*/races.csv
            /data/2024/s_class_f1_all_parts/*/results.csv
            /data/2025/s_class_f1_all_parts/*/entries.csv
            /data/2025/s_class_f1_all_parts/*/races.csv
            /data/2025/s_class_f1_all_parts/*/results.csv
            /data/2026_h1/s_class_f1_all/entries.csv
            /data/2026_h1/s_class_f1_all/races.csv
            /data/2026_h1/s_class_f1_all/results.csv
            /data/2026_future_block1/s_class_f1_20260701_20260830/entries.csv
            /data/2026_future_block1/s_class_f1_20260701_20260830/races.csv
            /data/2026_future_block1/s_class_f1_20260701_20260830/results.csv
            /research/benter_calibration_v4/sep_holdout/entries.csv
            /research/benter_calibration_v4/sep_holdout/races.csv
            /research/benter_calibration_v4/sep_holdout/results.csv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install statistical runtime
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Evaluate 1st-win probabilities and time-ordered calibration
        run: python -u research/benter_walkforward_v7/research_first_win.py
      - name: Commit reproducible first-place evaluation
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f --sparse research/benter_walkforward_v7/first_win_research/
          git commit -m "Archive 1st-win F1 S-class 14k sample residual and calibration research [skip ci]"
          git pull --rebase origin research/benter-minimal-line-v7-20261018
          git push origin HEAD:research/benter-minimal-line-v7-20261018
      - uses: actions/upload-artifact@v4
        with:
          name: benter-v7-first-win-research
          path: research/benter_walkforward_v7/first_win_research/
