name: Verify independent G3 conditional second-place probabilities
on:
  push:
    branches: [research/g3-independent-first-20261018]
    paths:
      - .github/workflows/g3-second-inference-tests.yml
      - research/g3_independent_v1/predict_g3_first_second.py
      - research/g3_independent_v1/test_g3_second.py
      - research/g3_independent_v1/models/g3_second_conditional_v1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent_second_distribution_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/g3-independent-first-20261018
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/g3_independent_v1/predict_g3_first_second.py
            /research/g3_independent_v1/test_g3_second.py
            /research/g3_independent_v1/models/g3_second_conditional_v1.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile pure-probability inference
        run: python -m py_compile research/g3_independent_v1/predict_g3_first_second.py
      - name: Test all G3 conditional second probabilities
        run: python -m unittest discover -s research/g3_independent_v1 -p test_g3_second.py -v
