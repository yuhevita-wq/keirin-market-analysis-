name: G3 Day3 Reality

on:
  push:
    branches:
      - analysis/g3-day3-reality
    paths:
      - 'scripts/inventory_g3_archives.py'
      - 'scripts/analyze_g3_day3_reality.py'
      - 'scripts/drilldown_g3_day3_reality.py'
      - 'scripts/analyze_g3_day3_offmain.py'
      - 'scripts/simulate_g3_day3_trio_formations.py'
      - 'scripts/select_g3_day3_trio_routes.py'
      - '.github/workflows/g3-day3-reality.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/g3-day3-reality
      - name: Inventory G3 archives
        run: python scripts/inventory_g3_archives.py
      - name: Analyze G3 day 3 reality
        run: python scripts/analyze_g3_day3_reality.py
      - name: Drill down market and race-type effects
        run: python scripts/drilldown_g3_day3_reality.py
      - name: Analyze off-mainline winners
        run: python scripts/analyze_g3_day3_offmain.py
      - name: Backtest trio formations
        run: python scripts/simulate_g3_day3_trio_formations.py
      - name: Validate two trio routes
        run: python scripts/select_g3_day3_trio_routes.py
      - name: Commit analysis outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/g3_day3_reality/
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'analysis: update G3 day3 reality report [skip ci]'
            git pull --rebase origin analysis/g3-day3-reality
            git push origin HEAD:analysis/g3-day3-reality
          fi
