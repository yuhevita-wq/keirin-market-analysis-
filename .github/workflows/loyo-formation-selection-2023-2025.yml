name: LOYO formation selection 2023-2025
on:
  push:
    paths:
      - 'src/keirin_market_analysis/loyo_formation_selection_2023_2025.py'
      - '.github/workflows/loyo-formation-selection-2023-2025.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  loyo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m keirin_market_analysis.loyo_formation_selection_2023_2025
      - name: Validate scope
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/audits/formation_slot_loyo_2023_2025.json',encoding='utf-8'))
          assert d['years_read']==[2023,2024,2025]
          assert d['evaluation_year_2026_used'] is False
          assert d['status']=='FORMATION_SELECTION_LOYO_2023_2025'
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/formation_slot_loyo_2023_2025.json
          git commit -m 'Add LOYO formation selection results' || exit 0
          git push
