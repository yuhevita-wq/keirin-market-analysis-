name: Formation synthetic odds | full archive price thresholds
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/formation-synthetic-odds-20261028.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: formation-synthetic-odds-20261028
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[scrape]'
      - name: Code and archive-orientation regression checks
        run: |
          python -m py_compile research/formation_synthetic_odds_20261028/evaluate.py
          python -m unittest research.snowberg_observation_corrected_20261027.test_orientation
      - name: Compute all full-archive formation prices and historical returns
        env:
          KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM: ${{ secrets.KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM }}
        run: python research/formation_synthetic_odds_20261028/evaluate.py
      - name: Store comprehensive evidence as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formation-synthetic-odds-${{ github.run_id }}
          path: |
            research/formation_synthetic_odds_20261028/summary.json
            research/formation_synthetic_odds_20261028/compact.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish aggregate results, not plaintext odds
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/formation_synthetic_odds_20261028/summary.json research/formation_synthetic_odds_20261028/compact.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record price-to-formation-ROI and chronology'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
