name: Analyze conditional plus1 236-146 2023dev
on:
  push:
    paths:
      - 'src/keirin_market_analysis/analyze_conditional_plus1_236_146_2023dev.py'
      - '.github/workflows/analyze-conditional-plus1-236-146-2023dev.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/keirin_market_analysis/analyze_conditional_plus1_236_146_2023dev.py
      - name: Commit audit output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/conditional_plus1_236_146_2023dev.json
          git diff --cached --quiet || git commit -m 'Add conditional plus1 analysis for 236+146'
          git push
