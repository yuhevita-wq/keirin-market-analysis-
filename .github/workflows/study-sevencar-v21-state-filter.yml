name: Study Seven-Car V21 State Filter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_sevencar_v21_state_filter.py'
      - '.github/workflows/study-sevencar-v21-state-filter.yml'

permissions:
  contents: write

concurrency:
  group: study-sevencar-v21-state-filter
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run v21 state-filter study
        run: python scripts/keirin_shogi_sevencar_v21_state_filter.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/sevencar_v21_state_filter
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "research: save seven-car v21 state-filter study"
            git pull --rebase origin main
            git push
          fi
