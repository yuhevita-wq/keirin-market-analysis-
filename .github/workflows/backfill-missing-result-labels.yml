name: Repair missing actual race results without training leakage

on:
  push:
    branches: [main]
    paths:
      - 'research/odds_universe_v1/result_labels_repair.py'
      - '.github/workflows/backfill-missing-result-labels.yml'
  schedule:
    - cron: '52 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        type: number
        default: 180

permissions:
  contents: write

concurrency:
  group: recovered-result-labels-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EVENT: ${{ github.event_name }}
      LIMIT: ${{ github.event.inputs.limit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch latest committed collection ledger before choosing candidate races
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[scrape]'
      - name: Recover archived 1st-3rd finishing positions and published payouts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            python research/odds_universe_v1/result_labels_repair.py --auto --limit 45
          elif [[ "$EVENT" == "schedule" ]]; then
            python research/odds_universe_v1/result_labels_repair.py --auto --limit 180
          else
            python research/odds_universe_v1/result_labels_repair.py --auto --limit "${LIMIT:-180}"
          fi
      - name: Validate and append result targets, never features
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('data/recovered_result_labels_v1').rglob('summary.json'):
              s=json.loads(p.read_text(encoding='utf-8'))
              assert s['actual_results_label_only']
              assert s['outcome_not_market_feature']
              assert s['attempted']==s['complete_podium']+s['failed_podium']
              assert (p.parent/'results.csv.gz').exists()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/recovered_result_labels_v1
          git commit -m 'data: append missing verified historical finishing-position labels' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Published on attempt $attempt"
              exit 0
            fi
            sleep 3
          done
          echo "Git push race after six attempts" >&2
          exit 1
