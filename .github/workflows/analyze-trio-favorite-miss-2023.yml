name: Analyze trio favorite miss 2023
on:
  push:
    paths:
      - 'src/keirin_market_analysis/analyze_trio_favorite_miss_2023.py'
      - '.github/workflows/analyze-trio-favorite-miss-2023.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run analysis
        run: python src/keirin_market_analysis/analyze_trio_favorite_miss_2023.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/trio_favorite_miss_2023.json
          git diff --cached --quiet || git commit -m "Add 2023 trio favorite miss audit"
          git push
