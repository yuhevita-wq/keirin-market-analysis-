name: Audit V3 condition bands

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-v3-condition-bands.yml"
      - "src/keirin_market_analysis/audit_v3_condition_bands.py"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Run audit
        run: python -m keirin_market_analysis.audit_v3_condition_bands
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/audits/v3_condition_band_audit.json').read_text(encoding='utf-8'))
          assert d['status']=='V3_CONDITION_BAND_AUDIT_COMPLETE'
          assert d['early'] and d['late']
          print(json.dumps({'early':d['early'][:10],'late':d['late'][:10]},ensure_ascii=False,indent=2))
          PY
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/v3_condition_band_audit.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "analysis: record V3 condition band audit" && git pull --rebase origin main && git push origin HEAD:main; fi
