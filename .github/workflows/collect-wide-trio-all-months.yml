name: Collect and verify all 22 months of wide and trio odds
on:
  push:
    branches: [data/monthly-wide-trio-20261126]
    paths: ['.github/workflows/collect-wide-trio-all-months.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: haruq-monthly-wide-trio
  cancel-in-progress: false
jobs:
  m202501:
    name: 2025-01
    uses: ./.github/workflows/monthly-wide-trio-worker.yml
    with:
      month: '2025-01'
  m202502:
    name: 2025-02
    needs: m202501
    uses: ./.github/workflows/monthly-wide-trio-worker.yml
