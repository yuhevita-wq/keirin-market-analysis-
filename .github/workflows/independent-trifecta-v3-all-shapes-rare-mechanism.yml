name: Independent trifecta V3 | explain rare 0.01% tails in ALL line formations

on:
  push:
    branches:
      - research/trifecta-rare-tail-causal-decomposition-all-shapes
    paths:
      - 'research/independent_trifecta_2023/v3_all_shapes_rare_mechanism_2024_2026.py'
      - '.github/workflows/independent-trifecta-v3-all-shapes-rare-mechanism.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-trifecta-v3-rare-mechanism-no-shape-bias
  cancel-in-progress: false

jobs:
  audit-all-conditional-stages:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Sparse checkout immutable 2023-trained model and 2024-2026 result-only datasets
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/independent_trifecta_2023/observe.py
            /research/independent_trifecta_2023/line_dependence_v2.py
            /research/independent_trifecta_2023/aab_guarded_v3.py
            /research/independent_trifecta_2023/v4_pattern_floor_2026.py
            /research/independent_trifecta_2023/v3_all_shapes_rare_mechanism_2024_2026.py
            /research/independent_trifecta_2024/calibration_audit.py
            /research/independent_trifecta_2024/validate_2025.py
            /data/a_class_12/2023_*/races.csv
            /data/a_class_12/2023_*/entries.csv
            /data/a3_challenge/2023_*/races.csv
            /data/a3_challenge/2023_*/entries.csv
            /data/2023/**/races.csv
            /data/2023/**/entries.csv
            /data/grade_races/g1g2/*2023*.zip
            /data/grade_races/g3/2023/*.zip
            /data/result_universe_v2/combined/results_2023.jsonl.gz
            /data/a_class_12/2024_*/races.csv
            /data/a_class_12/2024_*/entries.csv
            /data/a3_challenge/2024_*/races.csv
            /data/a3_challenge/2024_*/entries.csv
            /data/2024/**/races.csv
            /data/2024/**/entries.csv
            /data/grade_races/g1g2/*2024*.zip
            /data/grade_races/g3/2024/*.zip
            /data/result_universe_v2/combined/results_2024.jsonl.gz
            /data/a_class_12/2025_*/races.csv
            /data/a_class_12/2025_*/entries.csv
            /data/a3_challenge/2025_*/races.csv
            /data/a3_challenge/2025_*/entries.csv
            /data/2025/**/races.csv
            /data/2025/**/entries.csv
            /data/grade_races/g1g2/*2025*.zip
            /data/grade_races/g3/2025/*.zip
            /data/result_universe_v2/combined/results_2025.jsonl.gz
            /data/a_class_12/2026_*/races.csv
            /data/a_class_12/2026_*/entries.csv
            /data/a_class_12/pilot_2026*/races.csv
            /data/a_class_12/pilot_2026*/entries.csv
            /data/a3_challenge/2026_*/races.csv
            /data/a3_challenge/2026_*/entries.csv
            /data/2026_h1/**/races.csv
            /data/2026_h1/**/entries.csv
            /data/2026_future_block1/**/races.csv
            /data/2026_future_block1/**/entries.csv
            /data/grade_races/g3/2026_h1/*.zip
            /data/result_universe_v2/combined/results_2026.jsonl.gz

      - name: Verify immutable V2 and V3, no market odds, no earlier model changes
        run: |
          set -euo pipefail
          python -m py_compile research/independent_trifecta_2023/v3_all_shapes_rare_mechanism_2024_2026.py research/independent_trifecta_2023/aab_guarded_v3.py research/independent_trifecta_2023/v4_pattern_floor_2026.py
          test "$(git hash-object research/independent_trifecta_2023/observe.py)" = "19701f16c80fcc95dc8c032ed47b80dfcfe93bc6"
          test "$(git hash-object research/independent_trifecta_2023/line_dependence_v2.py)" = "2bb7362490b7b7f7eb0e8390face22f248649216"
          test "$(git hash-object research/independent_trifecta_2023/aab_guarded_v3.py)" = "04bb3a7956a5a5d43a987194df557838b6ac81e5"
          for year in 2023 2024 2025 2026; do
            test -s "data/result_universe_v2/combined/results_$year.jsonl.gz"
            test ! -e "data/odds_only/odds_$year.jsonl.gz"
          done
          echo FROZEN_MODELS_NO_MARKET_ALL_YEARS_VERIFIED

      - name: Audit ALL ordered triples and conditional line/rider stages over three result years
        run: |
          set -euo pipefail
          python research/independent_trifecta_2023/v3_all_shapes_rare_mechanism_2024_2026.py

      - name: Assert historical rare counts and all-shapes stage decomposition
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('data/audits/trifecta_v3_all_shapes_rare_tail_failure_mechanism_2024_2026.json'))
          assert x['state']=='FROZEN_V3_ALL_LINE_SHAPES_RARE_TRIFECTA_MECHANISM_AUDIT_COMPLETE'
          assert x['market_prices_odds_used'] is False
          assert x['original_V2_V3_code_changed'] is False
          assert x['2024_2025_2026_used_to_fit_model'] is False
          assert x['favored_line_shape_or_role']==[]
          assert x['all_shapes_sampled_without_prefilter'] is True
          expected={'2024':(25348,108),'2025':(24635,106),'2026':(11797,75)}
          for year,(races,hits) in expected.items():
              yr=x['yearly'][year]
              assert yr['races']==races and yr['distinct_line_shapes']>10
              assert sum(yr['line_shape_race_counts'].values())==races
              assert yr['frozen_V3_rare_below_0_01pct']['actual_events']==hits
              assert sum(z['actual_events'] for z in yr['rare_breakdowns']['rare_by_bottleneck'].values())==hits
              assert sum(z['actual_events'] for z in yr['rare_breakdowns']['rare_by_line_shape'].values())==hits
              assert len(yr['rare_trifecta_actual_observations'])==hits
          print('ALL_2024_2026_V3_RARE_STAGE_AND_GEOMETRY_PARTITIONS_PASSED')
          PY

      - name: Upload complete rare-mechanism diagnostic across all formations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-trifecta-v3-all-formations-rare-mechanism-2024-2026
          path: data/audits/trifecta_v3_all_shapes_rare_tail_failure_mechanism_2024_2026.json
          retention-days: 90
          if-no-files-found: warn
