name: Enumerate nationwide historical race calendar against saved universe

on:
  push:
    branches: [main]
    paths:
      - research/odds_universe_v1/nationwide_calendar.py
      - .github/workflows/census-nationwide-races.yml
  schedule:
    - cron: '11 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [auto, pilot, dated]
        default: auto
      start:
        type: string
        default: '2025-01-01'
      end:
        type: string
        default: '2025-01-03'

permissions:
  contents: write

concurrency:
  group: historical-nationwide-calendar-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODE: ${{ github.event.inputs.mode }}
      START: ${{ github.event.inputs.start }}
      END: ${{ github.event.inputs.end }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read latest completed census state before picking next month
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[scrape]'
      - name: Count every public daily-calendar race link
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            python research/odds_universe_v1/nationwide_calendar.py --auto --sleep .55
          elif [[ "$EVENT" == "schedule" || "$MODE" == "auto" ]]; then
            python research/odds_universe_v1/nationwide_calendar.py --auto --sleep .65
          elif [[ "$MODE" == "pilot" ]]; then
            python research/odds_universe_v1/nationwide_calendar.py --start 2025-01-04 --end 2025-01-06 --sleep .65
          elif [[ "$MODE" == "dated" ]]; then
            python research/odds_universe_v1/nationwide_calendar.py --start "$START" --end "$END" --sleep .65
          else
            exit 2
          fi
      - name: Publish verified daily discovery ledger
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,gzip,csv
          for p in Path('data/nationwide_calendar').glob('*/summary.json'):
              j=json.loads(p.read_text(encoding='utf-8'))
              assert j['days_succeeded']+j['days_failed']==j['days_attempted'],p
              with gzip.open(p.parent/'race_index.csv.gz','rt',encoding='utf-8') as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==j['unique_race_ids'],p
              assert len({r['race_id'] for r in rows})==len(rows),p
              print(str(p),j['unique_race_ids'])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/nationwide_calendar
          git commit -m 'data: append historical nationwide race-calendar census and missing-day evidence' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
