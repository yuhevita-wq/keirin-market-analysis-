name: Chapter 1 | Train nonlinear historical market-error AI
on:
  workflow_dispatch:
  push:
    paths:
      - 'paper_only_ai/chapter1_market_boost.py'
      - 'paper_only_ai/test_chapter1_market_boost.py'
      - '.github/workflows/chapter1-market-boost.yml'
permissions:
  contents: write
concurrency:
  group: chapter1-market-boost-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research-boost:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            paper_only_ai
            docs/paper-only-ai-2023/chapter1_market_boost
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy<3' 'pandas<3' 'scipy<2' 'scikit-learn<2' 'joblib<2' 'optuna<5'
      - name: Verify end-to-end model and outcome rules
        run: |
          python -m py_compile paper_only_ai/chapter1_market_boost.py
          python paper_only_ai/test_chapter1_market_boost.py
      - name: Train nonlinear AI and validate fixed historical ticket PnL
        env:
          PYTHONUNBUFFERED: '1'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python paper_only_ai/chapter1_market_boost.py
      - name: Preserve full model weights and detailed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-historical-market-boost-${{ github.run_id }}
          path: docs/paper-only-ai-2023/chapter1_market_boost/
          if-no-files-found: warn
          retention-days: 90
      - name: Store research weights as immutable release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=chapter1-market-boost-research-2023-v1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Immutable release already exists; refusing overwrite"
            exit 1
          fi
          gh release create "$TAG" \
            docs/paper-only-ai-2023/chapter1_market_boost/model_trifecta.joblib \
            docs/paper-only-ai-2023/chapter1_market_boost/model_trio.joblib \
            docs/paper-only-ai-2023/chapter1_market_boost/report_2023.json \
            --target "$GITHUB_SHA" \
            --title "2023 learned pricing-error AI research (unvalidated ROI)" \
            --notes "Historical price-error study, not an assurance of future profitability. Read report_2023.json for failed candidates and full data boundaries."
      - name: Commit source-independent performance report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/paper-only-ai-2023/chapter1_market_boost/report_2023.json
          if ! git diff --cached --quiet; then
            git commit -m "Record chronological boosted market-error learning and actual PnL"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
