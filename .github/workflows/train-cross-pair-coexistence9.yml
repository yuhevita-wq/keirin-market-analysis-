name: Train real nine-car pair coexistence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/cross_pair_coexistence9/train.py'
      - '.github/workflows/train-cross-pair-coexistence9.yml'

permissions:
  contents: write

concurrency:
  group: train-cross-pair-coexistence9
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy scikit-learn joblib
      - name: Fit against actual 2022-24 results, assess 2025 and 2026 H1
        run: python research/cross_pair_coexistence9/train.py
      - name: Commit separate training outputs and held-out assessment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/cross_pair_coexistence9/pair_model.json research/cross_pair_coexistence9/validation.json
          if git diff --cached --quiet; then
            echo 'No changes in learned pair report.'
          else
            git commit -m 'research: save observed pair compatibility and untouched-year validation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
