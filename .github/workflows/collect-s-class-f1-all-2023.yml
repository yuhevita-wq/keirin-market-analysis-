name: Collect 2023 F1 S-class all races

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect-s-class-f1-all-2023.yml"
      - "src/keirin_market_analysis/s_class_f1_2023.py"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[scrape]'

      - name: Collect all S-class races from 2023 F1 meetings
        run: |
          python -m keirin_market_analysis.s_class_f1_2023 \
            --start-date 2023-01-01 \
            --end-date 2023-12-31 \
            --out-dir data/2023/s_class_f1_all \
            --sleep 0.20

      - name: Validate base collection
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('data/2023/s_class_f1_all')
          s=json.loads((p/'summary.json').read_text(encoding='utf-8'))
          races=list(csv.DictReader((p/'races.csv').open(encoding='utf-8-sig')))
          entries=list(csv.DictReader((p/'entries.csv').open(encoding='utf-8-sig')))
          failures=list(csv.DictReader((p/'failures.csv').open(encoding='utf-8-sig')))
          assert s['parsed_f1_s_class_races']==len(races) and len(races)>0, s
          assert s['entry_rows']==len(entries) and len(entries)>0, s
          assert s['failures']==0 and not failures, failures[:20]
          assert all(r['meeting_grade']=='F1' for r in races)
          assert all(r['race_type'].startswith('Ｓ級') for r in races)
          assert all(e['meeting_grade']=='F1' for e in entries)
          assert all(e['race_type'].startswith('Ｓ級') for e in entries)
          assert all(r['race_date'].startswith('2023-') for r in races)
          assert len({r['race_type'] for r in races})>=2, s['race_type_counts']
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Enrich KDreams predicted line formation
        run: |
          python -m keirin_market_analysis.line_formation_2025 \
            --data-dir data/2023/s_class_f1_all \
            --sleep 0.20

      - name: Extract results and payouts
        run: |
          python -m keirin_market_analysis.results_payouts_2025 \
            --data-dir data/2023/s_class_f1_all \
            --sleep 0.20

      - name: Validate results and payouts
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('data/2023/s_class_f1_all')
          races=list(csv.DictReader((p/'races.csv').open(encoding='utf-8-sig')))
          s=json.loads((p/'result_summary.json').read_text(encoding='utf-8'))
          failures=list(csv.DictReader((p/'result_failures.csv').open(encoding='utf-8-sig')))
          assert s['race_count']==len(races) and len(races)>0, s
          assert s['complete_result_races']==len(races), s
          assert s['complete_payout_races']==len(races), s
          assert s['parse_failures']==0 and not failures, failures[:20]
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Collect historical final trifecta and trio odds
        run: |
          python -m keirin_market_analysis.historical_final_odds \
            --data-dir data/2023/s_class_f1_all \
            --workers 3 \
            --sleep 0.15

      - name: Validate final odds
        run: |
          python - <<'PY'
          import csv,json,math
          from pathlib import Path
          p=Path('data/2023/s_class_f1_all')
          races=list(csv.DictReader((p/'races.csv').open(encoding='utf-8-sig')))
          entries=list(csv.DictReader((p/'entries.csv').open(encoding='utf-8-sig')))
          s=json.loads((p/'odds_summary.json').read_text(encoding='utf-8'))
          trifecta=list(csv.DictReader((p/'trifecta_final_odds.csv').open(encoding='utf-8-sig')))
          trio=list(csv.DictReader((p/'trio_final_odds.csv').open(encoding='utf-8-sig')))
          assert s['race_count_attempted']==len(races), (s,len(races))
          assert s['complete_races']+s['failed_races']==len(races), s
          assert s['coverage_rate']>=0.95, s
          by_race={}
          for e in entries: by_race.setdefault(e['race_id'],set()).add(int(e['car_no']))
          for rid in {r['race_id'] for r in trio}:
              n=len(by_race[rid])
              assert sum(r['race_id']==rid for r in trio)==math.comb(n,3), (rid,n)
              assert sum(r['race_id']==rid for r in trifecta)==n*(n-1)*(n-2), (rid,n)
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: s-class-f1-all-2023
          retention-days: 7
          path: data/2023/s_class_f1_all

      - name: Commit 2023 F1 S-class dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/2023/s_class_f1_all
          if git diff --cached --quiet; then
            echo "No dataset changes to commit"
          else
            git commit -m "data: add 2023 F1 S-class all-race dataset"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
