name: search-high-payout-strategy-simple-v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/keirin_market_analysis/search_high_payout_strategy_simple_v1.py'
      - '.github/workflows/search-high-payout-strategy-simple-v1.yml'

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m keirin_market_analysis.search_high_payout_strategy_simple_v1
      - run: |
          python - <<'PY'
          import json
          d=json.load(open('data/audits/high_payout_strategy_simple_2023_2025_v1.json',encoding='utf-8'))
          assert d['years_read']==[2023,2024,2025]
          assert d['evaluation_year_2026_used'] is False
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/high_payout_strategy_simple_2023_2025_v1.json
          git commit -m 'Add simple 2023-2025 high payout search' || exit 0
          git push
