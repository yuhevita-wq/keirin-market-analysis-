name: Keirin Shogi Weekly Probe

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/keirin-shogi-weekly-probe.yml'
      - 'scripts/keirin_shogi_weekly_v0.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show CSV schemas
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          base=Path('data/2024/s_class_f1_all_parts/2024_q1')
          for name in ['entries.csv','races.csv','results.csv']:
              path=base/name
              print(f'### {name}')
              with path.open('r',encoding='utf-8-sig',newline='') as f:
                  r=csv.reader(f)
                  for i,row in enumerate(r):
                      print(row)
                      if i>=2:
                          break
          PY
