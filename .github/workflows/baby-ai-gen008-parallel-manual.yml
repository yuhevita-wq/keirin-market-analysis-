name: Baby AI GEN-008 | parallel experiment (MANUAL ONLY)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_PARALLEL_EXPERIMENT to run actual historical training"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: baby-ai-gen008-parallel-manual
  cancel-in-progress: false
jobs:
  both-models:
    if: inputs.confirmation == 'RUN_PARALLEL_EXPERIMENT'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical runtime
        run: python -m pip install 'numpy>=1.26'
      - name: Verify experiment from independent frozen parent
        run: OPENBLAS_NUM_THREADS=1 python research/ai_nursery/test_gen008.py
      - name: Train BOTH clones on identical Aug-Sep 2023 and test frozen Oct 2023
        run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python research/ai_nursery/parallel_gen008.py --run-training
      - name: Commit both branches and complete sealed comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ai_nursery/outputs/GEN-008-PARALLEL/
          git commit -m "data: freeze separate GEN-008 control and shadow-learning candidate"
          git pull --rebase origin main
          git push origin HEAD:main
