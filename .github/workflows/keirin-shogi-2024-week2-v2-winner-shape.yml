name: Keirin Shogi 2024 Week 2 v2 Winner Shape

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/keirin-shogi-2024-week2-v2-winner-shape.yml'
      - 'scripts/keirin_shogi_weekly_v2_winner_shape.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run winner-shape evaluator
        run: python scripts/keirin_shogi_weekly_v2_winner_shape.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v2_winner_shape/2024-01-08_2024-01-14
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v2 winner-shape 2024 week 2"
            git push
          fi
