name: Analyze S-class general bante wins

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-s-general-bante-win.yml"
      - "src/keirin_market_analysis/analyze_s_general_bante_win.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Analyze S-class general bante wins
        run: python -m keirin_market_analysis.analyze_s_general_bante_win
      - uses: actions/upload-artifact@v4
        with:
          name: s-general-bante-win
          path: results/s_general_bante_win
