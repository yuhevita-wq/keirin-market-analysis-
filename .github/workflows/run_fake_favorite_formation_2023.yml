name: Run fake favorite formation 2023

on:
  push:
    paths:
      - '.github/workflows/run_fake_favorite_formation_2023.yml'
      - 'src/keirin_market_analysis/fake_favorite_formation_sim_2023.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run simulation
        run: python src/keirin_market_analysis/fake_favorite_formation_sim_2023.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/fake_favorite_formation_sim_2023.json data/audits/fake_favorite_formation_sim_2023_decisions.csv
          git diff --cached --quiet || git commit -m "Run 2023 fake favorite formation simulation"
          git push
# rerun after result-column compatibility fix
