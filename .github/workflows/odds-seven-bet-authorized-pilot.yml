name: Authorized live seven-bet odds acquisition pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/odds-seven-bet-authorized-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: authorized-seven-bet-fixed-parser-smoke
  cancel-in-progress: false

jobs:
  live-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Assert complete odds matrix tests before touching the live site
        run: python -m odds_market.test_collect_all_odds
      - name: Collect authorized final odds, all sold bet types, one known nine-car race
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -u odds_market/collect_all_odds.py \
            --start 2024-07-04 \
            --end 2024-07-04 \
            --race-id 7320240704010001 \
            --out "$RUNNER_TEMP/private_odds" \
            --pause 2 \
            --accept-terms 2>&1 | tee "$RUNNER_TEMP/collector.log"
      - name: Publish counts and diagnostic summary, never publish source odds
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          python - <<'PY'
          import csv,gzip,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'private_odds'
          files=sorted(root.rglob('*.csv.gz'))
          ids=set()
          kinds=set()
          total=0
          for p in files:
              with gzip.open(p,'rt',encoding='utf-8',newline='') as f:
                  for row in csv.DictReader(f):
                      total+=1
                      ids.add(row['race_id'])
                      kinds.add(row['bet_type'])
          lines=[
              '## Authorized 7-bet pilot (2024-07-04)',
              f"- Collector outcome: {os.environ['COLLECT_OUTCOME']}",
              f'- Verified complete races: {len(ids)}',
              f'- Verified odds combination rows: {total}',
              f"- Observed bet types: {', '.join(sorted(kinds)) or 'none'}",
              '- Source odds are sealed with AES-256-GCM before Git storage; plaintext is not published.',
              '- This pilot does not establish nationwide coverage; archive decryption requires the private key.',
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('\n'.join(lines)+'\n')
          print('\n'.join(lines),flush=True)
          PY
      - name: Encrypt complete odds books for durable storage
        if: always()
        run: |
          python -m odds_market.seal_verified_odds \
            --source "$RUNNER_TEMP/private_odds" \
            --target data/odds_ciphertext \
            --run-id "$GITHUB_RUN_ID" \
            --audit "data/audits/odds_seven_bet_runs/$GITHUB_RUN_ID.json"
      - name: Commit ciphertext and counts only, never raw odds
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/odds_seven_bet_runs
          if [ -d data/odds_ciphertext ]; then git add data/odds_ciphertext; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(odds): seal authorized seven-bet pilot run $GITHUB_RUN_ID"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Fail visibly when source acquisition failed
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          test "$COLLECT_OUTCOME" = success
