name: V9 unexplained winning chance mixtures | score zero excluded

on:
  push:
    branches:
      - research/v9-unexplained-arrival-chaos-mixture-nozero
    paths:
      - 'research/independent_trifecta_2023/v9_unexplained_arrival_mixture.py'
      - '.github/workflows/v9-unexplained-arrival-mixture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v9-unexplained-arrival-mixture
  cancel-in-progress: false

jobs:
  nozero-full-trifecta-mixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout complete pre-race rider line cards and actual top-three outcomes
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/independent_trifecta_2023/observe.py
            /research/independent_trifecta_2023/line_dependence_v2.py
            /research/independent_trifecta_2023/aab_guarded_v3.py
            /research/independent_trifecta_2023/v4_pattern_floor_2026.py
            /research/independent_trifecta_2023/v5_rider_score_role_size_interactions.py
            /research/independent_trifecta_2023/v6_opponent_competition_structure.py
            /research/independent_trifecta_2024/calibration_audit.py
            /research/independent_trifecta_2024/validate_2025.py
            /data/a_class_12/2023_*/races.csv
            /data/a_class_12/2023_*/entries.csv
            /data/a3_challenge/2023_*/races.csv
            /data/a3_challenge/2023_*/entries.csv
            /data/2023/**/races.csv
            /data/2023/**/entries.csv
            /data/grade_races/g1g2/*2023*.zip
            /data/grade_races/g3/2023/*.zip
            /data/result_universe_v2/combined/results_2023.jsonl.gz
            /data/a_class_12/2024_*/races.csv
            /data/a_class_12/2024_*/entries.csv
            /data/a3_challenge/2024_*/races.csv
            /data/a3_challenge/2024_*/entries.csv
            /data/2024/**/races.csv
            /data/2024/**/entries.csv
            /data/grade_races/g1g2/*2024*.zip
            /data/grade_races/g3/2024/*.zip
            /data/result_universe_v2/combined/results_2024.jsonl.gz
            /data/a_class_12/2025_*/races.csv
            /data/a_class_12/2025_*/entries.csv
            /data/a3_challenge/2025_*/races.csv
            /data/a3_challenge/2025_*/entries.csv
            /data/2025/**/races.csv
            /data/2025/**/entries.csv
            /data/grade_races/g1g2/*2025*.zip
            /data/grade_races/g3/2025/*.zip
            /data/result_universe_v2/combined/results_2025.jsonl.gz
            /data/a_class_12/2026_*/races.csv
            /data/a_class_12/2026_*/entries.csv
            /data/a_class_12/pilot_2026*/races.csv
            /data/a_class_12/pilot_2026*/entries.csv
            /data/a3_challenge/2026_*/races.csv
            /data/a3_challenge/2026_*/entries.csv
            /data/2026_h1/**/races.csv
            /data/2026_h1/**/entries.csv
            /data/2026_future_block1/**/races.csv
            /data/2026_future_block1/**/entries.csv
            /data/grade_races/g3/2026_h1/*.zip
            /data/result_universe_v2/combined/results_2026.jsonl.gz
            /research/independent_trifecta_2023/weak_rider_podium_zero_excluded.py
            /research/independent_trifecta_2023/v8_targeted_weak_podium_calibration.py
            /research/independent_trifecta_2023/v9_unexplained_arrival_mixture.py

      - name: Verify frozen training architecture and untouched archived data
        run: |
          set -euo pipefail
          python -m py_compile research/independent_trifecta_2023/v9_unexplained_arrival_mixture.py
          test "$(git hash-object research/independent_trifecta_2023/observe.py)" = "19701f16c80fcc95dc8c032ed47b80dfcfe93bc6"
          test "$(git hash-object research/independent_trifecta_2023/line_dependence_v2.py)" = "2bb7362490b7b7f7eb0e8390face22f248649216"
          for year in 2023 2024 2025 2026; do
            test -s "data/result_universe_v2/combined/results_$year.jsonl.gz"
          done
          echo V9_CLEAN_SOURCE_FILES_VERIFIED

      - name: Fit 2023 score-verified V6, select shock only on November, evaluate December and all 2024-2026
        run: |
          set -euo pipefail
          python research/independent_trifecta_2023/v9_unexplained_arrival_mixture.py

      - name: Verify both uncertainty models preserve race mass and full-market scoring
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('data/audits/v9_unexplained_probability_mixture_nozero_2023_2026.json'))
          assert d['state']=='V9_UNEXPLAINED_CHANCE_MIXTURE_COMPLETE'
          assert d['all_outcomes_summed_to_one']
          assert d['zero_score_races_excluded_from_all_fit_and_evaluation']
          assert d['no_market_odds_or_payouts']
          assert d['model_production_unchanged']
          assert d['selected_november_only']['epsilon'] in d['epsilon_grid']
          for year,total in [('2024',25348),('2025',24635),('2026',11797)]:
              p=d['all_epsilon_sensitivity'][year]
              assert p['source_races']==total
              assert p['eligible_races']+sum(p['excluded_unknown_score_races'].values())==total
              assert p['excluded_unknown_score_races'].get('UNKNOWN_ZERO_OR_INVALID_SCORE',0)>0
              assert p['by_mode']['whole-race-uniform']['0.0']['nll']==p['by_mode']['uniform-winner-only']['0.0']['nll']
              assert p['eligible_races']>10000
          print('V9_UNEXPLAINED_PROBABILITY_MIXTURE_ALL_PERIODS_VALIDATED')
          PY

      - name: Upload inspectable mixture comparisons and exact weak-rider slot totals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-unexplained-finish-chance-mixtures-nozero-2023-2026
          path: data/audits/v9_unexplained_probability_mixture_nozero_2023_2026.json
          retention-days: 90
          if-no-files-found: warn
