name: Audit trifecta favorite miss by price band (2021-2026H1)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - research/favorite_price_miss_v1/analyze.py
      - .github/workflows/analyze-favorite-trifecta-price-bands.yml
permissions:
  contents: write
concurrency:
  group: favorite-trifecta-price-bands-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute actual favorite miss distribution from full-price archives and independent result labels
        run: python research/favorite_price_miss_v1/analyze.py
      - name: Commit audit output without stale-base conflicts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/favorite-price-audit
          cp data/audits/favorite_trifecta_price_bands_2021_2026h1.json /tmp/favorite-price-audit/
          cp data/audits/favorite_trifecta_price_bands_2021_2026h1.csv /tmp/favorite-price-audit/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/favorite-price-audit/* data/audits/
            git add data/audits/favorite_trifecta_price_bands_2021_2026h1.json data/audits/favorite_trifecta_price_bands_2021_2026h1.csv
            if git diff --cached --quiet; then
              echo "Audit report already current"
              exit 0
            fi
            git commit -m "data: publish favorite trifecta price bands with tie and car-count checks"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "Could not publish audit report" >&2
          exit 1
