name: Audit candidate threshold neighborhoods
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-candidate-threshold-neighborhoods.yml'
      - 'src/keirin_market_analysis/audit_candidate_threshold_neighborhoods.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e .
      - run: python -m keirin_market_analysis.audit_candidate_threshold_neighborhoods
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audits/three_year_candidate_neighborhoods.json
          git diff --cached --quiet || git commit -m 'analysis: add three-year candidate threshold neighborhoods'
          git push
