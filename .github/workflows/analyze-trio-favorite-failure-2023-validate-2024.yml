name: Analyze trio favorite failure 2023 validate 2024

on:
  push:
    paths:
      - 'src/keirin_market_analysis/analyze_trio_favorite_failure_2023_validate_2024.py'
      - '.github/workflows/analyze-trio-favorite-failure-2023-validate-2024.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run analysis
        run: python -m src.keirin_market_analysis.analyze_trio_favorite_failure_2023_validate_2024
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/trio_favorite_failure_2023_validate_2024.json
          git diff --cached --quiet || git commit -m "Add trio favorite failure 2023-2024 audit"
          git push
