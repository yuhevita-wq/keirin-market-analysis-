name: Build v38 King Seat
on:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_v38_king_seat_2024w1.py'
      - '.github/workflows/build-v38-king-seat.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/keirin_shogi_v38_king_seat_2024w1.py
      - name: Commit v38 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add results/keirin_shogi/v38_king_seat_2024w1
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "results: save v38 king-seat model"
            git push
          fi
