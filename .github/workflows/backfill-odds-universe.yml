name: Backfill missing A-class final odds (verified full markets)

on:
  push:
    branches: [main]
    paths:
      - research/odds_universe_v1/backfill.py
      - .github/workflows/backfill-odds-universe.yml
  schedule:
    - cron: '26 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "pilot uses A1/A2 and A3 samples; auto resumes oldest incomplete source"
        type: choice
        options: [pilot, auto, source]
        default: auto
      source:
        description: "Required for source mode, e.g. data/a_class_12/2025_01_02"
        type: string
        default: ""
      offset:
        description: "Start row in source mode"
        type: number
        default: 0
      limit:
        description: "Max races, 1..500"
        type: number
        default: 400

permissions:
  contents: write

concurrency:
  group: odds-universe-backfill-writer
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MODE: ${{ github.event.inputs.mode }}
      SOURCE: ${{ github.event.inputs.source }}
      OFFSET: ${{ github.event.inputs.offset }}
      LIMIT: ${{ github.event.inputs.limit }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch latest committed collection ledger before choosing candidate races
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[scrape]'
      - name: Collect confirmed KDreams 3連単 and 3連複 markets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == "pilot" ]]; then
            python research/odds_universe_v1/backfill.py --source data/a_class_12/2025_01_02 --offset 6 --limit 6 --workers 2 --sleep 0.6 --tag followup-A12
            python research/odds_universe_v1/backfill.py --source data/a3_challenge/2025_01_02 --offset 6 --limit 6 --workers 2 --sleep 0.6 --tag followup-A3
          elif [[ "$EVENT" == "push" ]]; then
            python research/odds_universe_v1/backfill.py --auto --limit 160 --workers 2 --sleep 0.6 --tag startup-broad-backfill
          elif [[ "$EVENT" == "schedule" ]]; then
            python research/odds_universe_v1/backfill.py --auto --limit 400 --workers 2 --sleep 0.6 --tag recurring-gap-backfill
          elif [[ "$MODE" == "auto" ]]; then
            python research/odds_universe_v1/backfill.py --auto --limit "${LIMIT:-400}" --workers 2 --sleep 0.6 --tag on-demand-gap-backfill
          elif [[ "$MODE" == "source" ]]; then
            python research/odds_universe_v1/backfill.py --source "$SOURCE" --offset "${OFFSET:-0}" --limit "${LIMIT:-40}" --workers 2 --sleep 0.6 --tag directed-source-backfill
          else
            echo "Unsupported mode" >&2
            exit 1
          fi
      - name: Verify and commit immutable compressed batches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          roots=list(Path('data/odds_universe_v1/data').rglob('summary.json'))
          assert roots,'No immutable backfill summary exists'
          for p in roots:
              r=json.loads(p.read_text(encoding='utf-8'))
              assert r['complete']+r['failed']==r['attempted'],p
              assert len(r['attempted_race_ids'])==r['attempted'],p
              assert r['full_numeric_market_required'] is True,p
              assert (p.parent/'trifecta_final_odds.csv.gz').exists(),p
              assert (p.parent/'trio_final_odds.csv.gz').exists(),p
          print('BACKFILL_BUNDLES_VERIFIED',len(roots))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/odds_universe_v1
          if git diff --cached --quiet; then
            echo 'No new incomplete race candidates'
            exit 0
          fi
          git commit -m 'data: append KDreams archived complete final odds with provenance'
          git pull --rebase origin main
          git push origin HEAD:main
