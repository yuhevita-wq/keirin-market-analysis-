name: Test 2026 Kyodo Day1 H5 Compression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/keirin_shogi_kyodo_2026_day1_h5_compression.py'
      - 'scripts/keirin_shogi_ninecar_v32.py'
      - '.github/workflows/test-2026-kyodo-day1-h5.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/keirin_shogi_kyodo_2026_day1_h5_compression.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/kyodo_2026_day1_h5_compression.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "research: save 2026 Kyodo day1 H5 compression result"
            git pull --rebase origin main
            git push
          fi
