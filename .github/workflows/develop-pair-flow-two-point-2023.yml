name: Develop pair-flow two-point 2023
on:
  push:
    paths:
      - 'src/keirin_market_analysis/develop_pair_flow_two_point_2023.py'
      - '.github/workflows/develop-pair-flow-two-point-2023.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run
        run: python src/keirin_market_analysis/develop_pair_flow_two_point_2023.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/audits/pair_flow_two_point_2023.json',encoding='utf-8'))
          assert x['law']['outcome_used_for_entry_or_ticket_selection'] is False
          assert 20 <= x['must_enter_rate_pct'] <= 30
          print('PASS',x['law']['entry_threshold'])
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/pair_flow_two_point_2023.json
          git commit -m 'analysis: save pair-flow two-point 2023 development' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
