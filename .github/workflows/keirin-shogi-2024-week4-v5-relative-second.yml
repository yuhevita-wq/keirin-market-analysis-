name: Keirin Shogi 2024 Week 4 v5 Relative Second
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-2024-week4-v5-relative-second.yml'
      - 'scripts/keirin_shogi_weekly_v5_relative_second.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/keirin_shogi_weekly_v5_relative_second.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v5_relative_second/2024-01-22_2024-01-28
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v5 relative-second 2024 week 4"
            git push
          fi
