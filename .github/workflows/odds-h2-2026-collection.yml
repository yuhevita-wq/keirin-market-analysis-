name: One-off Jul-Oct 2026 encrypted odds collection
on:
  push:
    branches: [data/odds-2026-jul-oct]
    paths:
      - '.github/workflows/odds-h2-2026-collection.yml'
      - 'research/odds_h2_2026/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odds-h2-2026-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        month: [7, 8, 9, 10]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/odds-2026-jul-oct
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pyproject.toml
            /README.md
            /src/
            /odds_market/
            /research/odds_h2_2026/
            /data/rider_condition_2025_202610_full/rider_races_2026.csv.gz
            /data/odds_universe_v1/data/2026_future_block1/
            /data/odds_h2_2026_encrypted/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[scrape]' requests beautifulsoup4 lxml
      - run: python -m odds_market.test_collect_all_odds
      - run: python -m py_compile research/odds_h2_2026/collect.py
      - name: Collect permitted historical odds and encrypt each day
        id: gather
        env:
          PYTHONPATH: .
        run: python -u research/odds_h2_2026/collect.py ${{ matrix.month }}
      - name: Persist ciphertext and audit only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d data/odds_h2_2026_encrypted ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/odds_h2_2026_encrypted
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: encrypted July-October odds month ${{ matrix.month }}"
          git push origin HEAD:data/odds-2026-jul-oct
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-odds-audit-2026-${{ matrix.month }}
          path: data/odds_h2_2026_encrypted/audit/
          if-no-files-found: warn
