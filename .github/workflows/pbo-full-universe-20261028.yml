name: Full universe | original candidate replay and CSCV
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pbo-full-universe-20261028.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pbo-full-universe-20261028
  cancel-in-progress: false
jobs:
  full_replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[scrape]'
      - name: Regression checks
        run: |
          python research/pbo_full_universe_20261028/test_replay.py
          python -m unittest research.snowberg_observation_corrected_20261027.test_orientation
          python -m py_compile research/pbo_full_universe_20261028/replay.py
      - name: Full archived market and racecard replay
        env:
          KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM: ${{ secrets.KEIRIN_SEVEN_BET_PRIVATE_KEY_PEM }}
        run: python research/pbo_full_universe_20261028/replay.py
      - name: Preserve coverage ledger and daily matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-universe-pbo-${{ github.run_id }}
          path: |
            research/pbo_full_universe_20261028/*.json
            research/pbo_full_universe_20261028/*.csv.gz
          if-no-files-found: warn
          retention-days: 30
      - name: Publish aggregate evidence without plaintext odds
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/pbo_full_universe_20261028/summary.json research/pbo_full_universe_20261028/compact.json research/pbo_full_universe_20261028/daily_candidate_matrix.csv.gz research/pbo_full_universe_20261028/race_coverage.csv.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: preserve full-universe coverage, daily candidates, CSCV and forward diagnostics'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
