name: Simulate selected 134-136-146 2025
on:
  push:
    paths:
      - 'src/keirin_market_analysis/simulate_selected_134_136_146_2025.py'
      - '.github/workflows/simulate-selected-134-136-146-2025.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/keirin_market_analysis/simulate_selected_134_136_146_2025.py
      - name: Commit audit output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/audits/selected_134_136_146_2025.json
          git diff --cached --quiet || git commit -m 'Add 2025 selected 1-346-346 audit'
          git push
