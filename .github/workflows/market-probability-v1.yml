name: Market Probability v1 chronological audit

on:
  push:
    branches: [main]
    paths:
      - 'research/market_probability_v1/**'
      - '.github/workflows/market-probability-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-probability-v1
  cancel-in-progress: false

jobs:
  train-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.13'
      - name: Synthetic unit smoke test
        run: python research/market_probability_v1/train.py --self-test
      - name: Fit and evaluate full archived data
        run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python research/market_probability_v1/train.py
      - name: Validate audit result
        run: |
          python - <<'PY'
          import json
          p='data/audits/market_probability_v1_2023_2026.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['odds_phase']=='final'
          assert r['valid_races_by_year']['2025']>3500
          assert r['valid_races_by_year']['2026']>1800
          for key in ('2025_out_of_time','2026_h1_out_of_time_not_untouched'):
              t=r['evaluations'][key]
              assert t['market']['races']==t['corrected']['races']
              for m in ('market','power_only','corrected'):
                  assert t[m]['logloss']>0
          print('AUDIT VERIFIED',r['valid_races_by_year'])
          PY
      - name: Commit reproducible results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/market_probability_v1_2023_2026.json data/models/market_probability_v1_s_f1_2025.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: publish chronological market probability v1 audit"
          git pull --rebase origin main
          git push origin HEAD:main
