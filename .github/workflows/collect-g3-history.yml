name: Collect G3 history

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date YYYY-MM-DD
        required: true
        default: '2026-09-04'
      end_date:
        description: End date YYYY-MM-DD
        required: true
        default: '2026-09-04'
      out_dir:
        description: Output directory
        required: true
        default: 'data/g3/2026_h2'
  push:
    paths:
      - 'src/keirin_market_analysis/g3_history.py'
      - '.github/workflows/collect-g3-history.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scraper dependencies
        run: python -m pip install -e '.[scrape]'
      - name: Resolve collection window
        id: window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "start=${{ inputs.start_date }}" >> "$GITHUB_OUTPUT"
            echo "end=${{ inputs.end_date }}" >> "$GITHUB_OUTPUT"
            echo "out=${{ inputs.out_dir }}" >> "$GITHUB_OUTPUT"
          else
            echo "start=2026-09-04" >> "$GITHUB_OUTPUT"
            echo "end=2026-09-04" >> "$GITHUB_OUTPUT"
            echo "out=data/g3/2026_h2" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect explicitly labelled G3 races
        run: |
          python -m keirin_market_analysis.g3_history \
            --start-date '${{ steps.window.outputs.start }}' \
            --end-date '${{ steps.window.outputs.end }}' \
            --out-dir '${{ steps.window.outputs.out }}' \
            --sleep 0.20
      - name: Enrich published line formation
        run: |
          python -m keirin_market_analysis.line_formation_2025 \
            --data-dir '${{ steps.window.outputs.out }}' \
            --sleep 0.20 \
            --allow-failures
      - name: Commit collected G3 data to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '${{ steps.window.outputs.out }}'
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git commit -m "Store G3 data ${{ steps.window.outputs.start }} to ${{ steps.window.outputs.end }}"
          git push origin HEAD:main
