name: Keirin Shogi v20 Stable Participation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-shogi-v20-stable-participation.yml'
      - 'scripts/keirin_shogi_v20_stable_participation.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-v20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q scikit-learn
      - run: python scripts/keirin_shogi_v20_stable_participation.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/keirin_shogi/v20_stable_participation
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: keirin shogi v20 stable participation"
            git push
          fi
